# One-click deploy on Render: New > Blueprint > pick this repo.
# After the first deploy, set the two secrets marked sync: false in the dashboard.
databases:
  - name: fieldwork-db
    databaseName: fieldwork
    user: fieldwork

services:
  - type: web
    name: fieldwork
    runtime: python
    buildCommand: pip install ".[postgres]"
    startCommand: fieldwork migrate && (if [ "$FIELDWORK_DEMO" = "1" ]; then fieldwork seed --if-empty; fi) && fieldwork serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FIELDWORK_DATABASE_URL
        fromDatabase: { name: fieldwork-db, property: connectionString }
      - key: FIELDWORK_SECRET_KEYS      # a Fernet key; see DEPLOY.md
        sync: false
      - key: FIELDWORK_ACCESS_PASSWORD  # the password gate; leave empty to make the site public
        sync: false
      - key: FIELDWORK_PUBLIC_URL       # e.g. https://fieldwork.onrender.com or your own domain
        sync: false
      - key: FIELDWORK_OPERATOR_TOKEN   # for /api/operator/metrics
        generateValue: true
      - key: FIELDWORK_DEMO
        value: "1"
      - key: FIELDWORK_DEMO_RESET_MINUTES  # public demo resets itself; set 0 for a real workspace
        value: "60"

  - type: cron
    name: fieldwork-digest
    runtime: python
    schedule: "45 12 * * 1-5"   # 8:45am New York on weekdays (UTC)
    buildCommand: pip install ".[postgres]"
    startCommand: fieldwork digest
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FIELDWORK_DATABASE_URL
        fromDatabase: { name: fieldwork-db, property: connectionString }
      - key: FIELDWORK_SECRET_KEYS
        sync: false
      - key: FIELDWORK_PUBLIC_URL
        sync: false
