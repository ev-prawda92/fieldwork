services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldwork
      POSTGRES_PASSWORD: fieldwork
      POSTGRES_DB: fieldwork
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwork"]
      interval: 2s
      retries: 20
  fieldwork:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      FIELDWORK_DATABASE_URL: postgresql://fieldwork:fieldwork@db/fieldwork
      FIELDWORK_DEMO: "1"
      # Production: set FIELDWORK_SECRET_KEYS from your secret manager and FIELDWORK_PUBLIC_URL.
      FIELDWORK_KEY_FILE: /data/.fieldwork_key
    volumes: ["keys:/data"]
volumes:
  pgdata:
  keys:
