<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014; --panel:#12151a; --panel2:#171b21; --line:#252a32; --line2:#303642;
  --ink:#e8e6df; --dim:#9aa0a8; --faint:#6b717a;
  --accent:#e8b25c; --accent-ink:#1a1307; --accent-soft:#1d1a13;
  --green:#7cc38b; --red:#e07a6f; --amber:#e8b25c; --blue:#7fa8d9; --violet:#b39ddb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px}
textarea{font-family:'IBM Plex Mono',monospace;font-size:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:7px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
nav.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand img{width:26px;height:26px;object-fit:contain}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--faint);font-size:11px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:8px 10px;border-radius:6px}
.navbtn:hover{background:var(--panel2);color:var(--ink)}
.navbtn.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.whoami{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.whoami .role{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
main{overflow:auto;padding:26px 32px 60px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.sub{color:var(--dim);margin:0 0 22px}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .n{font-size:26px;font-weight:600}
.kpi .l{color:var(--dim);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.on_track,.pass,.done,.apply,.met{color:var(--green)}
.at_risk,.warn,.arguable{color:var(--amber)}
.blocked,.fail,.missing{color:var(--red)}
.in_progress,.info,.open_question,.unknown{color:var(--blue)}
.open{color:var(--dim)}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:150px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:2px 4px 6px;display:flex;justify-content:space-between}
.dcard{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px;margin-bottom:8px;color:var(--ink)}
.dcard:hover{border-color:var(--accent)}
.dcard .c{color:var(--dim);font-size:12px}
.dcard .t{font-weight:600;margin:2px 0 6px}
.engine-tag{font-size:11px;color:var(--violet)}

.chain{display:flex;gap:4px;margin:14px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:90px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--faint);background:var(--panel)}
.step.past{color:var(--dim);border-color:#3b4f40}
.step.now{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.step small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.two{grid-template-columns:1.4fr 1fr}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hash{font-size:11px;color:var(--faint);word-break:break-all}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:8px;max-width:440px;box-shadow:0 8px 30px #0008;display:none;z-index:9}
.toast.err{border-color:var(--red)}
.empty{color:var(--faint);padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:8px}
details summary{cursor:pointer;color:var(--dim)}
.matrix{overflow-x:auto}
.matrix td,.matrix th{text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:normal;min-width:220px}
.matrix select{padding:3px 4px;font-size:12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.secret{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px;margin-top:10px}
.secret code{display:block;margin-top:6px;word-break:break-all;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:99px;padding:5px 12px;font-size:13px}
.tabs button.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

.signin{max-width:460px;margin:10vh auto;padding:0 16px}
.signin .card{padding:24px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;height:auto}
  nav.side{flex-direction:row;flex-wrap:wrap;padding:10px}
  .brand,.whoami{display:none}
  .navbtn{width:auto}
  main{padding:18px 16px 60px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const S = { token: null, me: null, cfg: null, engines: null, view: "overview", dep: null, settingsTab: "branding" };
try { S.token = sessionStorage.getItem("fw_token"); } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const can = a => !!(S.me && S.me.can[a]);
const canAll = a => !!(S.me && S.me.can[a] === "all");
const stageName = k => (S.cfg.stages.find(s => s.key === k) || {name: k}).name;
const roleName = k => (S.cfg.roles.find(r => r.key === k) || {name: k}).name;
const pill = (cls, txt) => `<span class="pill ${esc(cls)}">${esc(txt ?? String(cls).replace(/_/g, " "))}</span>`;
const fmtDate = s => s ? String(s).slice(0, 10) : "—";
const brand = () => (S.cfg && S.cfg.branding) || { product_name: "Fieldwork", accent: "#e8b25c", logo_url: "" };

function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : "");
  t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 4500);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { signOut(); throw new Error("signed out"); }
  if (!r.ok) {
    const d = j && j.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || r.statusText));
  }
  return j;
}
const act = fn => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== "signed out") toast(e.message, true); } };

/* white-label: accent color, product name, logo */
function applyBrand() {
  const b = brand();
  const hex = b.accent.replace("#", "");
  const [r, g, bl] = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (0.299 * r + 0.587 * g + 0.114 * bl) / 255;
  const root = document.documentElement.style;
  root.setProperty("--accent", b.accent);
  root.setProperty("--accent-ink", lum > 0.55 ? "#12140f" : "#ffffff");
  root.setProperty("--accent-soft", `rgba(${r},${g},${bl},0.12)`);
  document.title = b.product_name;
}
function logo(size = 26) {
  const b = brand();
  if (b.logo_url) return `<img src="${esc(b.logo_url)}" alt="" width="${size}" height="${size}">`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 26 26" fill="none" stroke="var(--accent)" stroke-width="1.8" aria-hidden="true"><path d="M3 20 L9 8 L14 16 L18 10 L23 20"/><path d="M3 22 H23" stroke-opacity=".5"/></svg>`;
}

function signOut() {
  if (S.token && S.token.startsWith("fwsess_")) fetch("/api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + S.token } }).catch(() => {});
  S.token = null; S.me = null; S.cfg = null; try { sessionStorage.removeItem("fw_token"); } catch (e) {} applyBrand(); renderSignIn();
}

async function signIn(token) {
  S.token = token.trim();
  try { S.me = await api("/api/me"); } catch (e) { S.token = null; toast("That token wasn't accepted", true); return; }
  try { sessionStorage.setItem("fw_token", S.token); } catch (e) {}
  await loadConfig();
  S.view = "overview"; S.dep = null; render();
}
async function loadConfig() {
  const c = await api("/api/config"); S.cfg = c.config; S.meta = c; S.engines = c.engines; applyBrand();
}

async function renderSignIn() {
  let demos = [];
  try { const r = await fetch("/api/demo"); if (r.ok) demos = await r.json(); } catch (e) {}
  $("#root").innerHTML = `
  <div class="signin">
    <div class="brand" style="padding:0 0 18px">${logo()}<div><b>${esc(brand().product_name)}</b><small>For deployment teams</small></div></div>
    <div class="card grid">
      <h2>Sign in</h2>
      <label class="f">Workspace<input id="ws" placeholder="your-company" autocomplete="organization" value="${esc(lastWorkspace())}"></label>
      <button class="btn primary" id="ssogo">Sign in with company SSO</button>
      <details><summary style="font-size:12px">Use an access token instead</summary>
        <div class="grid" style="gap:8px;margin-top:8px">
          <label class="f">Access token<input id="tok" type="password" autocomplete="off"></label>
          <button class="btn" id="go">Sign in with token</button></div></details>
      ${demos.length ? `<div style="height:1px;background:var(--line);margin:6px 0"></div>
        <div class="muted" style="font-size:12px">Demo workspace · Meridian AI's deployment team</div>
        <div class="grid" style="gap:8px">${demos.map((d, i) => `<button class="btn" data-demo="${i}" style="text-align:left">${esc(d.label)}</button>`).join("")}</div>` : ""}
    </div>
  </div>`;
  $("#go").onclick = () => signIn($("#tok").value);
  $("#tok").onkeydown = e => { if (e.key === "Enter") signIn($("#tok").value); };
  const sso = act(async () => {
    const slug = $("#ws").value.trim().toLowerCase();
    if (!slug) { toast("Enter your workspace name", true); return; }
    const r = await fetch(`/api/auth/workspace/${encodeURIComponent(slug)}`);
    if (!r.ok) { toast("No workspace by that name", true); return; }
    const w = await r.json();
    if (!w.sso) { toast(`${w.name} doesn't use company sign-in; use an access token`, true); return; }
    try { localStorage.setItem("fw_ws", slug); } catch (e) {}
    location.href = `/auth/sso/${encodeURIComponent(slug)}/start`;
  });
  $("#ssogo").onclick = sso;
  $("#ws").onkeydown = e => { if (e.key === "Enter") sso(); };
  document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => signIn(demos[+b.dataset.demo].token));
}
function lastWorkspace() { try { return localStorage.getItem("fw_ws") || ""; } catch (e) { return ""; } }

function render() {
  const items = [
    ["overview", "Home", true],
    ["deployments", S.me.can["deployment.view"] === "all" ? "Deployments" : "My deployments", can("deployment.view")],
    ["tasks", "My work", can("task.create")],
    ["team", "Team", can("people.read")],
    ["audit", "Audit trail", can("audit.read")],
    ["settings", "Workspace settings", can("config.edit") || can("engine.manage")],
  ].filter(x => x[2]);
  $("#root").innerHTML = `
  <div class="app">
    <nav class="side" aria-label="Main">
      <div class="brand">${logo()}<div><b>${esc(brand().product_name)}</b><small>${esc(S.me.tenant.name)}</small></div></div>
      ${items.map(([k, l]) => `<button class="navbtn ${S.view === k || (k === "deployments" && S.view === "deployment") ? "on" : ""}" data-v="${k}">${esc(l)}</button>`).join("")}
      <div class="whoami">
        <div class="role">${esc(S.me.user.role_name)}</div>
        <div>${esc(S.me.user.name)}</div>
        <div class="faint">${esc(S.me.user.email)}</div>
        <button class="btn small" style="margin-top:8px" id="out">Sign out</button>
      </div>
    </nav>
    <main id="main"><div class="faint">Loading…</div></main>
  </div>`;
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { S.view = b.dataset.v; S.dep = null; render(); });
  $("#out").onclick = signOut;
  const views = { overview, deployments, deployment: deploymentView, tasks: tasksView, team, audit: auditView, settings };
  act(views[S.view])();
}

function openDep(id) { S.view = "deployment"; S.dep = id; render(); }
function bindDeps(scope = document) { scope.querySelectorAll("[data-dep]").forEach(b => b.onclick = e => { e.preventDefault(); openDep(b.dataset.dep); }); }

/* ------------------------------------------------------------- home */
async function overview() {
  const d = await api("/api/dashboard");
  const w = d.widgets;
  const parts = [];
  if (w.includes("kpis") && d.kpis) parts.push(`<div class="grid kpis">
      <div class="card kpi"><div class="n">${d.kpis.deployments}</div><div class="l">Deployments</div></div>
      <div class="card kpi"><div class="n on_track">${d.kpis.on_track}</div><div class="l">On track</div></div>
      <div class="card kpi"><div class="n at_risk">${d.kpis.at_risk}</div><div class="l">At risk</div></div>
      <div class="card kpi"><div class="n blocked">${d.kpis.blocked}</div><div class="l">Blocked</div></div></div>`);
  for (const k of w) {
    if (k === "my_tasks" && d.my_tasks) parts.push(`<div><h2>My open tasks</h2><div class="card" id="w_tasks"></div></div>`);
    if (k === "chain" && d.chain) parts.push(`<div><h2>${S.me.can["deployment.view"] === "all" ? "Every deployment, by stage" : "Your deployments, by stage"}</h2>${chainBoard(d.chain)}</div>`);
    if (k === "findings" && d.findings) parts.push(`<div><h2>Findings awaiting confirmation</h2><div class="card">${d.findings.length ? `<table><tbody>${d.findings.map(f => `<tr><td><a href="#" data-dep="${esc(f.deployment_id)}">${esc(f.title)}</a><div class="faint" style="font-size:12px">${esc(f.deployment)}</div></td><td class="engine-tag">${esc((S.engines[f.engine] || {}).name || f.engine)}</td><td class="faint mono" style="font-size:12px">${fmtDate(f.created_at)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Nothing waiting.</div>`}</div></div>`);
    if (k === "team" && d.team) parts.push(`<div><h2>Team load</h2><div class="card"><table><thead><tr><th>Person</th><th>Role</th><th>Deployments</th><th>Open tasks</th></tr></thead><tbody>
      ${d.team.map(p => `<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.role_name)}</td><td>${p.deployments}</td><td>${p.open_tasks}</td></tr>`).join("")}</tbody></table></div></div>`);
  }
  $("#main").innerHTML = `<h1>Hi, ${esc(S.me.user.name.split(" ")[0])}</h1>
    <p class="sub">${esc(S.me.user.role_name)} · ${esc(S.me.tenant.name)}</p>
    <div class="grid" style="gap:26px">${parts.join("") || `<div class="empty">Your home screen has no sections. A workspace admin can add them in settings.</div>`}</div>`;
  const wt = $("#w_tasks"); if (wt) renderTasks(d.my_tasks, wt, () => act(overview)(), true);
  bindDeps();
}

function chainBoard(deps) {
  return `<div class="board">${S.cfg.stages.map(s => {
    const here = deps.filter(d => d.stage === s.key);
    const names = (s.engines || []).map(k => (S.engines[k] || {}).name || k);
    return `<div class="col"><h3><span>${esc(s.name)}</span><span>${here.length}</span></h3>
      <div class="engine-tag" style="margin:0 4px 10px">${names.length ? names.map(esc).join(" + ") : "&nbsp;"}</div>
      ${here.map(d => `<button class="dcard" data-dep="${esc(d.id)}">
        <div class="c">${esc(d.customer)}</div><div class="t">${esc(d.name)}</div>
        <div class="row">${pill(d.health)}<span class="faint" style="font-size:11px">${d.members.filter(m => m.role !== "customer").map(m => esc(m.name.split(" ")[0])).join(", ")}</span></div>
      </button>`).join("") || `<div class="faint" style="font-size:12px;padding:4px">—</div>`}
    </div>`;
  }).join("")}</div>`;
}

/* ---------------------------------------------------------- deployments */
async function deployments() {
  const [deps, customers] = await Promise.all([api("/api/deployments"), api("/api/customers")]);
  const people = can("people.read") ? await api("/api/people") : [];
  $("#main").innerHTML = `
    <div class="row"><div><h1>${S.me.can["deployment.view"] === "all" ? "Deployments" : "My deployments"}</h1>
    <p class="sub">${deps.length} active</p></div><div class="spacer"></div>
    ${can("deployment.create") ? `<button class="btn primary" id="newdep">New deployment</button>` : ""}</div>
    <div id="newform"></div>
    <div class="card"><table><thead><tr><th>Customer</th><th>Deployment</th><th>Stage</th><th>Health</th><th>Team</th></tr></thead><tbody>
    ${deps.map(d => `<tr><td>${esc(d.customer)}</td><td><a href="#" data-dep="${esc(d.id)}">${esc(d.name)}</a></td>
      <td>${esc(stageName(d.stage))}</td><td>${pill(d.health)}</td>
      <td class="muted">${d.members.map(m => esc(m.name)).join(", ")}</td></tr>`).join("")
      || `<tr><td colspan="5"><div class="empty">You're not on any deployments yet.</div></td></tr>`}
    </tbody></table></div>`;
  bindDeps();
  const nb = $("#newdep");
  if (nb) nb.onclick = () => {
    $("#newform").innerHTML = `<div class="card grid" style="margin-bottom:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <label class="f">Customer<select id="nd_c">${customers.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></label>
      <label class="f">Deployment name<input id="nd_n" placeholder="e.g. Invoice exception agent"></label>
      <label class="f">Lead<select id="nd_l"><option value="">—</option>${people.filter(p => p.role !== "customer").map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.role_name)}</option>`).join("")}</select></label>
      ${fieldInputs("deployment", {})}
      <div class="row" style="align-self:end"><button class="btn primary" id="nd_go">Open deployment</button></div>
    </div>`;
    $("#nd_go").onclick = act(async () => {
      const r = await api("/api/deployments", { method: "POST", body: {
        customer_id: $("#nd_c").value, name: $("#nd_n").value, lead_id: $("#nd_l").value || null, fields: readFields("deployment") } });
      toast("Deployment opened"); openDep(r.id);
    });
  };
}

function fieldInputs(scope, values, disabled) {
  return S.cfg.fields[scope].map(f => {
    const v = values[f.key] ?? "";
    const id = `fld_${scope}_${f.key}`;
    const dis = disabled ? "disabled" : "";
    let input;
    if (f.type === "select") input = `<select id="${id}" ${dis}><option value=""></option>${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.type === "bool") input = `<input id="${id}" type="checkbox" ${v ? "checked" : ""} ${dis}>`;
    else input = `<input id="${id}" ${dis} type="${f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}" value="${esc(v)}">`;
    return `<label class="f">${esc(f.label)}${input}</label>`;
  }).join("");
}
function readFields(scope) {
  const out = {};
  S.cfg.fields[scope].forEach(f => {
    const el = document.getElementById(`fld_${scope}_${f.key}`); if (!el) return;
    out[f.key] = f.type === "bool" ? el.checked : el.value;
  });
  return out;
}

/* ---------------------------------------------------- deployment detail */
async function deploymentView() {
  const id = S.dep;
  const [d, tasks, findings] = await Promise.all([
    api(`/api/deployments/${id}`), api(`/api/tasks?deployment_id=${encodeURIComponent(id)}`),
    api(`/api/deployments/${id}/findings`)]);
  const people = can("people.read") ? await api("/api/people") : [];
  const yc = a => d.you_can.includes(a);
  const keys = S.cfg.stages.map(s => s.key);
  const idx = keys.indexOf(d.stage);
  const stage = S.cfg.stages[idx] || { name: d.stage, engines: [], exit_criteria: "" };
  const next = keys[idx + 1];
  const teamView = yc("task.view_internal");

  let mover = "";
  if (yc("deployment.jump")) mover = `<select id="advto" aria-label="Move to stage">${S.cfg.stages.map(s => `<option value="${esc(s.key)}" ${s.key === next ? "selected" : ""} ${s.key === d.stage ? "disabled" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <input id="advnote" placeholder="Note (required to move back)" style="min-width:220px"><button class="btn primary" id="adv">Move</button>`;
  else if (yc("deployment.advance") && next) mover = `<button class="btn primary" id="adv" data-to="${esc(next)}">Advance to ${esc(stageName(next))}</button>`;

  $("#main").innerHTML = `
    <button class="btn small" id="back">← Back</button>
    <div class="row" style="margin-top:14px"><div>
      <div class="muted">${esc(d.customer)}</div><h1>${esc(d.name)}</h1></div>
      <div class="spacer"></div>
      ${yc("deployment.edit") ? `<select id="health" aria-label="Health">${["on_track", "at_risk", "blocked"].map(h => `<option value="${h}" ${h === d.health ? "selected" : ""}>${h.replace("_", " ")}</option>`).join("")}</select>` : pill(d.health)}
    </div>
    ${!teamView ? `<p class="muted" style="margin:6px 0 0">You're seeing what the deployment team has shared with you.</p>` : ""}
    <div class="chain">${S.cfg.stages.map((s, i) => `<div class="step ${i < idx ? "past" : i === idx ? "now" : ""}"><small>${i + 1}</small>${esc(s.name)}</div>`).join("")}</div>
    <div class="card" style="margin-top:12px"><div class="row">
      <div><div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Exit criteria · ${esc(stage.name)}</div>
      <div>${esc(stage.exit_criteria || "None set")}</div></div><div class="spacer"></div>${mover}</div></div>

    <div class="grid two" style="margin-top:14px">
      <div class="grid">
        ${yc("engine.run") || yc("bench.match") ? `<div class="card" id="enginePanel"></div>` : ""}
        <div class="card"><h2>Findings</h2><div id="findings"></div></div>
      </div>
      <div class="grid">
        <div class="card"><h2 style="margin:0">Tasks</h2>
          <div id="tasklist" style="margin-top:10px"></div>
          ${yc("task.create") ? `<div class="row" style="margin-top:12px">
            <input id="nt" placeholder="New task" style="flex:1;min-width:160px">
            ${yc("task.assign") ? `<select id="nta" aria-label="Assignee"><option value="">Me</option>${d.members.filter(p => p.id !== S.me.user.id).map(p => `<option value="${esc(p.id)}">${esc(p.name)}${p.role === "customer" ? " (customer)" : ""}</option>`).join("")}</select>` : ""}
            <input id="ntd" type="date" aria-label="Due">
            ${yc("customer.share") ? `<label class="row" style="gap:4px;font-size:12px;color:var(--dim)"><input type="checkbox" id="nts"> share with customer</label>` : ""}
            <button class="btn" id="ntgo">Add</button></div>` : ""}
        </div>
        <div class="card"><h2 style="margin:0">Team</h2>
          <div style="margin-top:10px">${d.members.map(m => `<div class="row" style="padding:4px 0"><span>${esc(m.name)}</span><span class="faint" style="font-size:12px">${esc(roleName(m.role))}</span>${m.id === d.lead_id ? `<span class="pill plain">lead</span>` : ""}<div class="spacer"></div>
          ${yc("deployment.staff") ? `<button class="btn small" data-rm="${esc(m.id)}">Remove</button>` : ""}</div>`).join("")}</div>
          ${yc("deployment.staff") && people.length ? `<div class="row" style="margin-top:8px"><select id="addm" aria-label="Person">${people.filter(p => !d.members.some(m => m.id === p.id)).map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.role_name)}</option>`).join("")}</select><button class="btn small" id="addmgo">Add to team</button></div>` : ""}
        </div>
        ${S.cfg.fields.deployment.length ? `<div class="card grid"><h2 style="margin:0">Details</h2>${fieldInputs("deployment", d.fields, !yc("deployment.edit"))}
          ${yc("deployment.edit") ? `<button class="btn small" id="savef" style="justify-self:start">Save details</button>` : ""}</div>` : ""}
        <div class="card"><h2>History</h2>${d.history.map(h => `<div style="padding:4px 0;font-size:12px"><span class="faint mono">${fmtDate(h.at)}</span> ${esc(h.actor)} → <b>${esc(stageName(h.to_stage))}</b>${h.note ? ` <span class="muted">· ${esc(h.note)}</span>` : ""}</div>`).join("")}</div>
      </div>
    </div>`;

  $("#back").onclick = () => { S.view = can("deployment.view") ? "deployments" : "overview"; S.dep = null; render(); };
  const reload = () => act(deploymentView)();
  const h = $("#health"); if (h) h.onchange = act(async () => { await api(`/api/deployments/${id}`, { method: "PATCH", body: { health: h.value } }); toast("Health updated"); });
  const adv = $("#adv");
  if (adv) adv.onclick = act(async () => {
    const to = adv.dataset.to || $("#advto").value;
    await api(`/api/deployments/${id}/advance`, { method: "POST", body: { to_stage: to, note: ($("#advnote") || {}).value || "" } });
    toast(`Moved to ${stageName(to)}`); reload();
  });
  const sf = $("#savef"); if (sf) sf.onclick = act(async () => { await api(`/api/deployments/${id}`, { method: "PATCH", body: { fields: readFields("deployment") } }); toast("Saved"); });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = act(async () => { await api(`/api/deployments/${id}/members/${b.dataset.rm}`, { method: "DELETE" }); reload(); }));
  const am = $("#addmgo"); if (am) am.onclick = act(async () => { await api(`/api/deployments/${id}/members`, { method: "POST", body: { user_id: $("#addm").value } }); reload(); });
  const nt = $("#ntgo"); if (nt) nt.onclick = act(async () => {
    const r = await api("/api/tasks", { method: "POST", body: { deployment_id: id, title: $("#nt").value, assignee_id: ($("#nta") || {}).value || null,
      due: $("#ntd").value || null, visibility: ($("#nts") || {}).checked ? "shared" : "internal" } });
    if (r.visibility === "shared" && !($("#nts") || {}).checked) toast("Shared with the customer, since it's assigned to them");
    reload();
  });

  renderTasks(tasks, $("#tasklist"), reload, false, yc("task.update_any"), yc("customer.share") && teamView, teamView);
  renderFindings(findings, reload, yc("finding.confirm"), yc("customer.share"));
  if ($("#enginePanel")) renderEngines(stage, d, reload, yc);
}

function renderTasks(tasks, el, reload, showDep, updateAny, mayShare, showBadge) {
  if (!tasks.length) { el.innerHTML = `<div class="empty">No tasks.</div>`; return; }
  el.innerHTML = `<table><tbody>${tasks.map(t => {
    const editable = t.assignee_id === S.me.user.id || updateAny;
    return `<tr><td style="width:44%">${esc(t.title)}${showDep ? `<div class="faint" style="font-size:12px">${esc(t.deployment)}</div>` : ""}
        ${t.visibility === "shared" && showBadge ? ` <span class="pill plain" style="color:var(--violet)">shared</span>` : ""}</td>
      <td class="muted">${esc(t.assignee || "—")}</td><td class="faint mono" style="font-size:12px">${fmtDate(t.due)}</td>
      <td>${editable ? `<select data-task="${esc(t.id)}" aria-label="Status">${["open", "in_progress", "blocked", "done"].map(s => `<option value="${s}" ${s === t.status ? "selected" : ""}>${s.replace("_", " ")}</option>`).join("")}</select>` : pill(t.status)}</td>
      ${mayShare ? `<td><button class="btn small" data-vis="${esc(t.id)}" data-to="${t.visibility === "shared" ? "internal" : "shared"}">${t.visibility === "shared" ? "Make internal" : "Share"}</button></td>` : ""}</tr>`;
  }).join("")}</tbody></table>`;
  el.querySelectorAll("[data-task]").forEach(s => s.onchange = act(async () => {
    await api(`/api/tasks/${s.dataset.task}`, { method: "PATCH", body: { status: s.value } }); toast("Task updated"); reload();
  }));
  el.querySelectorAll("[data-vis]").forEach(b => b.onclick = act(async () => {
    await api(`/api/tasks/${b.dataset.vis}`, { method: "PATCH", body: { visibility: b.dataset.to } });
    toast(b.dataset.to === "shared" ? "Shared with the customer" : "Now internal only"); reload();
  }));
}

/* ------------------------------------------------ engine result views */
const kv = (label, value, cls) => `<div class="kpi"><div class="n ${cls || ""}" style="font-size:20px">${esc(value)}</div><div class="l">${esc(label)}</div></div>`;
function resultView(engine, r) {
  const x = r.result || {};
  const head = `<div class="row">${pill(r.status)}<b>${esc(r.summary)}</b></div>`;
  let body = "";
  if (engine === "census" && x.systems) body = `<table style="margin-top:8px"><tbody>${x.systems.map(s => `<tr><td>${esc(s.system)}</td><td>${pill(s.severity === "blocker" ? "fail" : s.severity === "gap" ? "warn" : "pass", s.severity === "ok" ? "ready" : s.severity)}</td><td class="muted" style="font-size:12px">${esc(s.gaps.join("; "))}</td></tr>`).join("")}</tbody></table>
      <details style="margin-top:8px"><summary style="font-size:12px">Findings memo</summary><pre class="mono" style="font-size:12px;white-space:pre-wrap">${esc(x.memo)}</pre></details>`;
  else if (engine === "cortex" && x.scenarios) body = `<table style="margin-top:8px"><thead><tr><th>Scenario</th><th>Expected</th><th>Cortex decided</th></tr></thead><tbody>${x.scenarios.map(s => `<tr><td>${esc(s.scenario)}<div class="faint" style="font-size:11px">${esc(s.reasons.join("; "))}</div></td><td class="mono" style="font-size:12px">${esc(s.expected || "—")}</td><td>${pill(s.ok ? "pass" : "fail", s.decision)}</td></tr>`).join("")}</tbody></table>
      ${x.profile_errors.length ? `<div class="blocked" style="margin-top:6px;font-size:12px">${x.profile_errors.map(esc).join("<br>")}</div>` : ""}
      ${x.risks.length ? `<div style="margin-top:8px;font-size:12px"><b class="at_risk">Risks</b><ul style="margin:4px 0 0;padding-left:18px">${x.risks.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>` : ""}`;
  else if (engine === "conformance" && x.by_category) body = `<table style="margin-top:8px"><thead><tr><th>Category</th><th>Pass</th><th>Rate</th></tr></thead><tbody>${Object.entries(x.by_category).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.passed}/${v.total}</td><td>${pill(v.rate >= x.threshold ? "pass" : "fail", Math.round(v.rate * 100) + "%")}</td></tr>`).join("")}</tbody></table>
      ${x.failures.length ? `<div style="margin-top:8px;font-size:12px"><b>Failures</b>${x.failures.map(f => `<div class="${f.critical ? "blocked" : "muted"}">${esc(f.case_id)} · expected “${esc(f.expected)}”, got “${esc(f.actual)}”${f.critical ? " · critical" : ""}</div>`).join("")}</div>` : ""}`;
  else if (engine === "golive" && x.checks) body = `<table style="margin-top:8px"><tbody>${x.checks.map(c => `<tr><td>${esc(c.check)}</td><td>${pill(c.ok ? "pass" : "fail", c.ok ? "met" : "not met")}</td><td class="muted" style="font-size:12px">${esc(c.detail)}</td></tr>`).join("")}</tbody></table>
      <div class="faint" style="font-size:12px;margin-top:6px">Mean time to resolve: sev1 ${x.mean_time_to_resolve.sev1_hours ?? "—"}h · sev2 ${x.mean_time_to_resolve.sev2_hours ?? "—"}h</div>`;
  else if (engine === "attribution" && x.value) {
    const v = x.value;
    const total = Object.values(x.delay_days_by_cause).reduce((a, b) => a + b, 0) + (x.unattributed_days || 0);
    const seg = (n, col) => total ? `<i style="width:${100 * n / total}%;background:${col}"></i>` : "";
    body = `<div class="grid kpis" style="margin-top:10px">${kv("Improvement", v.improvement_pct + "%", "on_track")}${v.hours_saved_per_month != null ? kv("Hours saved / month", v.hours_saved_per_month) : ""}${v.value_per_year != null ? kv("Value / year", "$" + v.value_per_year.toLocaleString()) : ""}</div>
      ${x.slip_days ? `<div style="margin-top:10px;font-size:12px">${x.slip_days} days late, attributed:</div>
      <div class="bar" style="height:12px;margin:6px 0">${seg(x.delay_days_by_cause.customer, "var(--blue)")}${seg(x.delay_days_by_cause.vendor, "var(--amber)")}${seg(x.delay_days_by_cause.third_party, "var(--violet)")}${seg(x.unattributed_days, "var(--line2)")}</div>
      <div class="row faint" style="font-size:12px"><span style="color:var(--blue)">customer ${x.delay_days_by_cause.customer}d</span><span style="color:var(--amber)">us ${x.delay_days_by_cause.vendor}d</span><span style="color:var(--violet)">third party ${x.delay_days_by_cause.third_party}d</span><span>unattributed ${x.unattributed_days}d</span></div>` : ""}`;
  } else if (Object.keys(x).length) body = `<details style="margin-top:6px"><summary style="font-size:12px">Details</summary><pre class="mono" style="font-size:11px;white-space:pre-wrap;color:var(--dim)">${esc(JSON.stringify(x, null, 2))}</pre></details>`;
  return head + body;
}

function findingBody(f) {
  const r = f.result;
  if (f.engine === "sendero") return senderoSummary(r);
  if (f.engine === "threshold") return `<span class="muted">${r.ranked.length} people scored · top: ${esc(r.ranked[0]?.name)} (${esc((r.ranked[0]?.verdict || "").replace("_", " "))})</span>`;
  return resultView(f.engine, r);
}

function renderFindings(findings, reload, mayConfirm, mayShare) {
  const el = $("#findings");
  if (!findings.length) { el.innerHTML = `<div class="empty">${S.me.can["finding.view_internal"] ? "No engine runs on this deployment yet." : "Nothing has been shared with you yet."}</div>`; return; }
  el.innerHTML = findings.map(f => `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
    <div class="row"><b>${esc(f.title)}</b><span class="engine-tag">${esc((S.engines[f.engine] || {}).name || f.engine)}</span>
    ${f.visibility === "shared" && mayShare ? `<span class="pill plain" style="color:var(--violet)">shared with customer</span>` : ""}<div class="spacer"></div>
    ${f.confirmed_by ? pill("done", "confirmed · " + f.confirmed_by_name)
      : mayConfirm && f.created_by !== S.me.user.id ? `<button class="btn small" data-confirm="${esc(f.id)}">Confirm</button>` : `<span class="pill plain faint">awaiting confirmation</span>`}
    ${mayShare && f.confirmed_by ? `<button class="btn small" data-share="${esc(f.id)}" data-to="${f.visibility === "shared" ? "0" : "1"}">${f.visibility === "shared" ? "Unshare" : "Share with customer"}</button>` : ""}</div>
    <div class="faint" style="font-size:12px">${esc(f.created_by_name)} · ${fmtDate(f.created_at)}</div>
    <div style="margin-top:6px">${findingBody(f)}</div>
  </div>`).join("");
  el.querySelectorAll("[data-confirm]").forEach(b => b.onclick = act(async () => { await api(`/api/findings/${b.dataset.confirm}/confirm`, { method: "POST" }); toast("Finding confirmed into the record"); reload(); }));
  el.querySelectorAll("[data-share]").forEach(b => b.onclick = act(async () => {
    await api(`/api/findings/${b.dataset.share}/share`, { method: "POST", body: { shared: b.dataset.to === "1" } });
    toast(b.dataset.to === "1" ? "Shared with the customer" : "Now internal only"); reload();
  }));
}

function senderoSummary(r) {
  const b = Math.round(r.build_score * 100);
  const col = r.classification === "BUILD" ? "var(--red)" : r.classification === "TRAINING" ? "var(--blue)" : "var(--amber)";
  return `<div class="row"><b style="color:${col}">${esc(r.classification)}</b><span class="muted">${r.confidence_pct}% confidence · n=${r.n}</span></div>
    <div class="bar" style="margin:6px 0" title="build ${b}% / training ${100 - b}%"><i style="width:${b}%;background:var(--red)"></i><i style="width:${100 - b}%;background:var(--blue)"></i></div>
    <div class="faint" style="font-size:11px">build ${b}% · training ${100 - b}%</div>`;
}

function renderEngines(stage, d, reload, yc) {
  const el = $("#enginePanel");
  const list = (stage.engines || []).filter(k => S.engines[k]);
  const tabKey = "eng_" + d.id + "_" + stage.key;
  let current = S[tabKey] && list.includes(S[tabKey]) ? S[tabKey] : list[0];
  const mayRun = yc("engine.run");
  const draw = () => {
    const eng = current ? S.engines[current] : null;
    const tabs = list.length > 1 ? `<div class="tabs" role="tablist" style="margin-bottom:10px">${list.map(k => `<button role="tab" aria-selected="${k === current}" class="${k === current ? "on" : ""}" data-etab="${esc(k)}">${esc(S.engines[k].name)}</button>`).join("")}</div>` : "";
    let body = "";
    if (!eng) body = `<div class="empty">No engine on this stage. Add one in Workspace settings → Deployment chain.</div>`;
    else if (!mayRun) body = `<div class="empty">Your role can view results but not run engines here.</div>`;
    else if (current === "sendero") body = `<div class="grid" style="gap:8px">
      <label class="f">Friction point<input id="se_t" placeholder="e.g. Invoice exception handling time"></label>
      <label class="f">Per-user data (CSV: one row per user, a metric column, cohort columns)<textarea id="se_csv" rows="6" placeholder="user_id,minutes,tenure_months,site"></textarea></label>
      <div class="row"><label class="f">Metric column<input id="se_m" style="width:190px"></label>
      <label class="f">Baseline<input id="se_b" type="number" step="any" style="width:100px"></label>
      <label class="f">Higher is worse<select id="se_h"><option value="1">yes</option><option value="0">no</option></select></label></div>
      <div class="row"><button class="btn primary" id="se_go">Classify</button><button class="btn" id="se_sample">Load sample data</button></div>
      <div id="eng_out"></div></div>`;
    else if (eng.kind === "push") body = `<div class="empty">This engine runs in its own environment and posts results in. They appear under Findings.</div>`;
    else body = `<div class="grid" style="gap:8px">
      <label class="f">Input${eng.input_hint ? `<span class="faint">${esc(eng.input_hint)}</span>` : ""}<textarea id="gen_in" rows="9"></textarea></label>
      <div class="row"><button class="btn primary" id="gen_go">Run ${esc(eng.name)}</button><button class="btn" id="gen_sample">Load sample</button></div>
      <div id="eng_out"></div></div>`;
    el.innerHTML = tabs + (eng ? `<div class="row"><h2 style="margin:0">${esc(eng.name)}</h2><div class="spacer"></div>
      ${eng.builtin === false ? `<span class="pill plain">your engine · ${esc(eng.kind)}</span>` : `<span class="pill plain faint">built in</span>`}</div>
      <p class="muted" style="margin:6px 0 12px">${esc(eng.does || "")}</p>` : "") + body + benchHtml(d, yc);
    el.querySelectorAll("[data-etab]").forEach(b => b.onclick = () => { current = S[tabKey] = b.dataset.etab; draw(); });
    bindRun(eng, current, d, reload, yc);
  };
  draw();
}

function benchHtml(d, yc) {
  if (!yc("bench.match")) return "";
  return `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <div class="row"><b>Bench · Threshold</b><span class="muted" style="font-size:12px">who can staff this deployment</span></div>
      <details style="margin:8px 0"><summary>Staffing requirements</summary>
        <textarea id="th_req" rows="8" style="width:100%;margin-top:6px">${esc(d.staffing_req)}</textarea>
        ${yc("deployment.staff") ? `<button class="btn small" id="th_save">Save requirements</button>` : ""}</details>
      <button class="btn" id="th_go">Match bench</button><div id="th_out" style="margin-top:10px"></div></div>`;
}

function bindRun(eng, key, d, reload, yc) {
  const refreshFindings = async () => renderFindings(await api(`/api/deployments/${d.id}/findings`), reload, yc("finding.confirm"), yc("customer.share"));
  const done = async () => { toast("Saved as a finding, awaiting confirmation"); await refreshFindings(); };
  const go = $("#se_go");
  if (go) {
    $("#se_sample").onclick = act(async () => {
      const s = await api("/api/demo/sample-csv");
      $("#se_csv").value = s.csv; $("#se_m").value = s.metric; $("#se_b").value = s.baseline;
      if (!$("#se_t").value) $("#se_t").value = "Invoice exception handling time";
    });
    go.onclick = act(async () => {
      const b = $("#se_b").value;
      const r = await api(`/api/deployments/${d.id}/engines/sendero`, { method: "POST", body: {
        title: $("#se_t").value || "Friction point", csv: $("#se_csv").value, metric: $("#se_m").value.trim(),
        baseline: b === "" ? null : +b, higher_is_worse: $("#se_h").value === "1" } });
      const x = r.result;
      $("#eng_out").innerHTML = `<div class="card" style="background:var(--panel2);margin-top:8px">${senderoSummary(x)}
        <p style="margin:10px 0 6px">${esc(x.recommendation)}</p>
        <div class="muted" style="font-size:12px">${esc(x.level1_dispersion.reading)}</div>
        <div class="muted" style="font-size:12px;margin-top:4px">${esc(x.level2_explanatory.reading)}</div></div>`;
      await done();
    });
  }
  const gg = $("#gen_go");
  if (gg) {
    $("#gen_sample").onclick = act(async () => { $("#gen_in").value = (await api(`/api/demo/sample-input/${key}`)).input; });
    gg.onclick = act(async () => {
      gg.disabled = true;
      try {
        const path = eng.builtin ? `stage/${key}` : `custom/${key}`;
        const r = await api(`/api/deployments/${d.id}/engines/${path}`, { method: "POST", body: { input: $("#gen_in").value } });
        $("#eng_out").innerHTML = `<div class="card" style="background:var(--panel2);margin-top:8px">${resultView(key, r.result)}</div>`;
        await done();
      } finally { gg.disabled = false; }
    });
  }
  const ts = $("#th_save");
  if (ts) ts.onclick = act(async () => { await api(`/api/deployments/${d.id}`, { method: "PATCH", body: { staffing_req: $("#th_req").value } }); d.staffing_req = $("#th_req").value; toast("Requirements saved"); });
  const tg = $("#th_go");
  if (tg) tg.onclick = act(async () => {
    const r = await api(`/api/deployments/${d.id}/engines/threshold`, { method: "POST" });
    $("#th_out").innerHTML = r.result.ranked.map(p => `<details style="padding:6px 0;border-bottom:1px solid var(--line)">
      <summary><span style="color:var(--ink)">${esc(p.name)}</span> ${pill(p.verdict)} <span class="faint" style="font-size:12px">${esc(p.summary)}</span></summary>
      <table style="margin-top:6px"><tbody>${p.findings.map(f => `<tr><td style="font-size:12px">${f.gate ? "<b>gate</b> · " : ""}${esc(f.requirement)}</td>
        <td>${pill(f.status)}</td><td class="faint" style="font-size:12px">${esc(f.detail)}${f.citations.length ? `<div class="mono">${f.citations.map(esc).join(", ")}</div>` : ""}</td></tr>`).join("")}</tbody></table></details>`).join("");
    await done();
  });
}

      <td class="mono" style="font-size:12px">${esc(r.action)}</td><td style="font-size:12px"><span class="muted">${esc(Object.entries(r.detail).map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · "))}</span>

        ${acts.map(([a, desc]) => `<tr><td>${esc(desc)}<div class="faint mono" style="font-size:11px">${a}</div></td>
          ${cfg.roles.map(r => {
            const v = (cfg.permissions[a] || {})[r.key] || "";
            const ws = meta.workspace_actions.includes(a);
            return `<td><select data-perm="${a}" data-role="${esc(r.key)}" aria-label="${esc(r.name + ": " + desc)}">
              <option value="" ${!v ? "selected" : ""}>—</option>${ws ? "" : `<option value="own" ${v === "own" ? "selected" : ""}>own</option>`}

          }).join("")}</tr>`).join("")}

    }
    if (t === "views") body = `<div class="card"><p class="muted" style="margin-top:0">Choose what each role sees when they sign in, in order.</p>

        <table><thead><tr><th></th><th>Stage</th><th>Key</th><th>Engines</th><th>Exit criteria</th><th></th></tr></thead><tbody>
        ${cfg.stages.map((s, i) => `<tr><td class="faint mono">${i + 1}</td>

          <td style="min-width:220px">${s.engines.map((k, j) => `<span class="pill plain" style="margin:0 4px 4px 0">${esc((engines[k] || {}).name || k)} <button class="btn small" style="padding:0 5px;border:0;background:none" data-edrop="${i}:${j}" aria-label="Remove engine">✕</button></span>`).join("")}
            ${s.engines.length < 4 ? `<select data-eadd="${i}" aria-label="Add engine" style="font-size:12px;padding:3px"><option value="">+ engine</option>${engOpts.filter(([k]) => !s.engines.includes(k)).map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join("")}</select>` : ""}</td>
          <td><input data-s="${i}" data-k="exit_criteria" value="${esc(s.exit_criteria)}" style="width:100%;min-width:240px"></td>
          <td style="white-space:nowrap"><button class="btn small" data-up="${i}" ${i ? "" : "disabled"} aria-label="Move up">↑</button>
            <button class="btn small" data-del="${i}" aria-label="Remove stage">✕</button></td></tr>`).join("")}
        </tbody></table>
        <div class="row" style="margin-top:10px"><button class="btn small" id="addstage">Add stage</button><button class="btn small" id="resetstages">Reset to default template</button></div></div>`;
    }
    if (t === "engines") {
      const custom = Object.values(engines).filter(e => !e.builtin);
      body = `<div class="card"><h2>Your engines</h2>
        <p class="muted" style="margin-top:0">Plug in your own scripts and integrations. Results become findings, with the same confirmation and audit trail as the built-in engines.</p>
        ${custom.length ? `<table><thead><tr><th>Engine</th><th>Kind</th><th>Where</th><th></th></tr></thead><tbody>
          ${custom.map(e => `<tr><td><b>${esc(e.name)}</b><div class="faint" style="font-size:12px">${esc(e.does)}</div></td>
            <td>${e.kind === "webhook" ? "Webhook · we call it" : "Push · it calls us"}</td>
            <td class="mono" style="font-size:12px;word-break:break-all">${esc(e.url || "posts to /api/ingest/findings")}</td>
            <td style="white-space:nowrap"><button class="btn small" data-rot="${esc(e.key)}">Rotate credential</button>
              ${can("config.edit") ? `<button class="btn small" data-edel="${esc(e.key)}">Remove</button>` : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No engines of your own yet.</div>`}
        <div id="eng_secret"></div></div>
        <div class="card grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
          <h2 style="grid-column:1/-1;margin:0">Register an engine</h2>
          <label class="f">Name<input id="ne_name" placeholder="Integration health check"></label>
          <label class="f">Key<input id="ne_key" class="mono" placeholder="integration_health"></label>
          <label class="f">Kind<select id="ne_kind"><option value="webhook">Webhook: we call your service</option><option value="push">Push: your script posts results</option></select></label>
          <label class="f" id="ne_url_l">URL (https)<input id="ne_url" placeholder="https://engines.yourco.com/health"></label>
          <label class="f" style="grid-column:1/-1">What it does<input id="ne_does"></label>
          <label class="f" style="grid-column:1/-1">Input hint (shown to whoever runs it)<input id="ne_hint"></label>
          <div><button class="btn primary" id="ne_go">Register engine</button></div>
        </div>
        <div class="card" style="margin-top:14px"><h2>Built-in engines</h2><table><tbody>
          ${Object.values(engines).filter(e => e.builtin && e.key !== "none").map(e => `<tr><td><b>${esc(e.name)}</b><div class="faint" style="font-size:12px">${esc(e.does)}</div></td><td>${e.status === "live" ? pill("done", "live") : `<span class="pill plain faint">planned</span>`}</td></tr>`).join("")}
        </tbody></table></div>`;
    }
    if (t === "sso" && ssoInfo) {
      const c = cfg.sso;
      body = `<div class="card grid" style="max-width:760px">
        <p class="muted" style="margin:0">Let people sign in with your identity provider (Okta, Microsoft Entra ID, Google Workspace, or any OpenID Connect provider).</p>
        <label class="row" style="gap:8px"><input type="checkbox" id="sso_on" ${c.enabled ? "checked" : ""}> Enable company sign-in</label>
        <label class="f">Issuer URL<input id="sso_iss" value="${esc(c.issuer)}" placeholder="https://yourco.okta.com"></label>
        <label class="f">Client ID<input id="sso_cid" value="${esc(c.client_id)}"></label>
        <label class="f">Client secret ${ssoInfo.client_secret_set ? `<span class="done">· set (stored encrypted)</span>` : `<span class="at_risk">· not set</span>`}
          <div class="row"><input id="sso_sec" type="password" placeholder="${ssoInfo.client_secret_set ? "Enter a new secret to replace it" : "Paste from your identity provider"}" style="flex:1"><button class="btn small" id="sso_sec_go">Save secret</button></div></label>
        <label class="f">Allowed email domains (comma-separated)<input id="sso_dom" value="${esc(c.allowed_domains.join(", "))}" placeholder="yourco.com"></label>
        <label class="f">Create accounts on first sign-in with role
          <select id="sso_jit"><option value="">Off: an admin adds people first</option>${cfg.roles.map(r => `<option value="${esc(r.key)}" ${r.key === c.jit_role ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
        <label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="sso_req" style="margin-top:4px" ${c.required ? "checked" : ""}> Require company sign-in (access tokens keep working only for people who can edit settings, as break-glass access)</label>
        <div class="card" style="background:var(--panel2)"><div class="faint" style="font-size:12px">Give your identity provider this redirect URI</div><code class="mono">${esc(ssoInfo.redirect_uri)}</code>
          <div class="faint" style="font-size:12px;margin-top:8px">Your people's sign-in link</div><code class="mono">${esc(ssoInfo.start_url)}</code></div></div>`;
    }
    if (t === "fields") body = `<div class="card"><p class="muted" style="margin-top:0">JSON. Types: text, number, date, select (with options), bool.</p>
      <textarea id="fields" rows="14" style="width:100%">${esc(JSON.stringify(cfg.fields, null, 2))}</textarea></div>`;

    const needsSave = t !== "engines";
    $("#main").innerHTML = `<h1>Workspace settings</h1><p class="sub">Start from the default template and make it yours. Every change is validated and audited.</p>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === t}" class="${k === t ? "on" : ""}" data-tab="${k}">${esc(l)}</button>`).join("")}</div>
      ${body}
      ${needsSave ? `<div class="row" style="margin-top:14px"><button class="btn primary" id="savecfg">Save settings</button><button class="btn" id="resetcfg">Discard changes</button></div>` : ""}`;
    bind();
  };

  const bind = () => {
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.settingsTab = b.dataset.tab; draw(); });
    const sc = $("#savecfg"); if (sc) sc.onclick = () => {
      if (S.settingsTab === "fields") { try { cfg.fields = JSON.parse($("#fields").value); } catch (e) { toast("Custom fields isn't valid JSON", true); return; } }
      save();
    };
    const rc = $("#resetcfg"); if (rc) rc.onclick = () => act(settings)();
    // branding
    const bn = $("#b_name"); if (bn) {
      bn.oninput = () => cfg.branding.product_name = bn.value;
      $("#b_acc").oninput = e => { cfg.branding.accent = e.target.value; $("#b_acc_t").value = e.target.value; };
      $("#b_acc_t").oninput = e => { cfg.branding.accent = e.target.value; };
      $("#b_logo").oninput = e => cfg.branding.logo_url = e.target.value;
    }
    // roles
    document.querySelectorAll("[data-rn]").forEach(el => el.oninput = () => { cfg.roles[+el.dataset.rn].name = el.value; });
    document.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => {
      const k = cfg.roles[+b.dataset.rdel].key;
      cfg.roles.splice(+b.dataset.rdel, 1);
      Object.values(cfg.permissions).forEach(p => delete p[k]); delete cfg.views[k]; draw();
    });
    const nr = $("#nr_go"); if (nr) nr.onclick = () => {
      const name = $("#nr_name").value.trim(); if (!name) return;
      let key = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 32) || "role";
      if (!/^[a-z]/.test(key)) key = "r_" + key;
      while (cfg.roles.some(r => r.key === key)) key += "_2";
      cfg.roles.push({ key, name }); cfg.views[key] = ["my_tasks", "chain"]; draw();
    };
    document.querySelectorAll("[data-perm]").forEach(el => el.onchange = () => {
      const p = cfg.permissions[el.dataset.perm] = cfg.permissions[el.dataset.perm] || {};
      if (el.value) p[el.dataset.role] = el.value; else delete p[el.dataset.role];
    });
    // views
    document.querySelectorAll("[data-w]").forEach(el => el.onchange = () => {
      const v = new Set(cfg.views[el.dataset.role] || []);
      el.checked ? v.add(el.dataset.w) : v.delete(el.dataset.w);
      cfg.views[el.dataset.role] = Object.keys(meta.widgets).filter(w => v.has(w));
    });
    // stages
    document.querySelectorAll("[data-eadd]").forEach(el => el.onchange = () => { if (el.value) { cfg.stages[+el.dataset.eadd].engines.push(el.value); draw(); } });
    document.querySelectorAll("[data-edrop]").forEach(b => b.onclick = () => { const [i, j] = b.dataset.edrop.split(":").map(Number); cfg.stages[i].engines.splice(j, 1); draw(); });
    // company sign-in
    const so = $("#sso_on"); if (so) {
      const sync = () => { cfg.sso = { enabled: $("#sso_on").checked, issuer: $("#sso_iss").value.trim(), client_id: $("#sso_cid").value.trim(),
        allowed_domains: $("#sso_dom").value.split(",").map(x => x.trim()).filter(Boolean), jit_role: $("#sso_jit").value, required: $("#sso_req").checked }; };
      ["#sso_on", "#sso_iss", "#sso_cid", "#sso_dom", "#sso_jit", "#sso_req"].forEach(q => { $(q).oninput = $(q).onchange = sync; });
      $("#sso_sec_go").onclick = act(async () => {
        if (!$("#sso_sec").value) return;
        await api("/api/sso/secret", { method: "PUT", body: { client_secret: $("#sso_sec").value } });
        toast("Client secret saved, encrypted"); await settings();
      });
    }
    document.querySelectorAll("[data-s]").forEach(el => el.oninput = el.onchange = () => { cfg.stages[+el.dataset.s][el.dataset.k] = el.value; });
    document.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; [cfg.stages[i - 1], cfg.stages[i]] = [cfg.stages[i], cfg.stages[i - 1]]; draw(); });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { cfg.stages.splice(+b.dataset.del, 1); draw(); });
    const as = $("#addstage"); if (as) as.onclick = () => { cfg.stages.push({ key: "stage_" + (cfg.stages.length + 1), name: "New stage", engine: "none", exit_criteria: "" }); draw(); };
    const rs = $("#resetstages"); if (rs) rs.onclick = () => { cfg.stages = JSON.parse(JSON.stringify(meta.defaults.stages)); draw(); };
    // engines
    const kind = $("#ne_kind"); if (kind) {
      kind.onchange = () => { $("#ne_url_l").style.display = kind.value === "webhook" ? "" : "none"; };
      $("#ne_name").oninput = () => { if (!$("#ne_key").dataset.touched) $("#ne_key").value = $("#ne_name").value.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 32); };
      $("#ne_key").oninput = () => $("#ne_key").dataset.touched = "1";
      $("#ne_go").onclick = act(async () => {
        const body = { name: $("#ne_name").value, key: $("#ne_key").value, kind: kind.value, does: $("#ne_does").value, input_hint: $("#ne_hint").value };
        if (kind.value === "webhook") body.url = $("#ne_url").value;
        const r = await api("/api/engines", { method: "POST", body });
        await loadConfig(); await settings();
        showSecret(r);
      });
    }
    document.querySelectorAll("[data-rot]").forEach(b => b.onclick = act(async () => showSecret(await api(`/api/engines/${b.dataset.rot}/rotate`, { method: "POST" }))));
    document.querySelectorAll("[data-edel]").forEach(b => b.onclick = act(async () => {
      const k = b.dataset.edel;
      if (cfg.stages.some(s => s.engines.includes(k))) { toast("Detach this engine from its stage first (Deployment chain tab)", true); return; }
      cfg.engines = cfg.engines.filter(e => e.key !== k); await save();
    }));
  };

  function showSecret(r) {
    const el = $("#eng_secret"); if (!el) return;
    const [label, val] = r.signing_secret ? ["Signing secret", r.signing_secret] : ["Engine token", r.engine_token];
    el.innerHTML = `<div class="secret"><b>${label}</b> <span class="muted">· ${esc(r.note)}</span><code class="mono">${esc(val)}</code></div>`;
  }

  draw();
}

applyBrand();
(function boot() {
  // Company sign-in returns here with the session (or an error) in the URL fragment,
  // which browsers never send to servers or put in logs.
  const frag = new URLSearchParams(location.hash.slice(1));
  if (frag.has("session") || frag.has("sso_error")) history.replaceState(null, "", location.pathname);
  if (frag.get("session")) return act(signIn)(frag.get("session"));
  if (frag.get("sso_error")) { renderSignIn(); return toast(frag.get("sso_error"), true); }
  S.token ? act(signIn)(S.token) : renderSignIn();
})();
</script>
</body>
</html>
