  const facts = `<div class="grid g3" style="gap:10px">${[["Direction", t.dir], ["Sync", t.sync], ["Auth", t.auth]].map(([k, v]) => `<div class="sub-card" style="padding:10px 12px;gap:4px"><div class="label" style="font-size:10px">${k}</div><div style="font-size:13px">${esc(v)}</div></div>`).join("")}</div>`;
  const mapping = `<div class="stack" style="gap:8px"><div class="label">What it syncs</div><div style="border:1px solid var(--line);border-radius:8px;overflow:hidden"><div class="mapgrid h"><span>${esc(upper(t.name))}</span><span></span><span>${esc(upper(brand().product_name))}</span></div>
      ${t.map.map(([a, b]) => `<div class="mapgrid"><span class="mono small text2">${esc(a)}</span><span class="mono small accent">${SYNC_ARROWS[t.dir] || "↔"}</span><span>${esc(b)}</span></div>`).join("")}</div></div>`;
  const autos = `<div class="stack" style="gap:8px"><div class="label">Automations</div>${t.auto.map(a => `<div class="row nowrap small" style="align-items:flex-start"><span class="mono good">→</span><span>${esc(a)}</span></div>`).join("")}</div>
    <div class="stack" style="gap:8px"><div class="label">Powers</div><div class="row" style="gap:6px">${t.powers.map(x => `<span class="chip blue">${esc(x)}</span>`).join("")}</div></div>`;
  const foot = `<div class="xs muted" style="border-top:1px solid var(--line);padding-top:12px;line-height:1.5">${esc(t.guard)}${p && !p.verified ? " Built against the vendor's published API; the first live connection is where any rough edge will show, and its health will say so." : ""}</div>`;
  let controls = "";
  if (p && p.personal) {
    const mine = p.connections.find(c => c.status !== "disconnected");
    controls = `<div class="small text2">Each person connects their own${p.people_connected ? `: ${plural(p.people_connected, "person has", "people have")} so far` : ""}. They'll find it under <a href="#/work">My work</a>.</div>
      ${!p.configured ? setupHtml(p, cat) : mine ? `<div class="small">Yours: <b>${esc(mine.account_name)}</b> · ${esc((HEALTH[mine.health.state] || [mine.health.state])[0].toLowerCase())}</div>` : p.you_can_connect ? `<div>${connectBtn(p, "Connect yours")}</div>` : ""}`;
  } else if (p) {
    const c = p.connections.find(x => x.status !== "disconnected");
    controls = !p.configured ? setupHtml(p, cat) : c ? `<div id="cxdetail"><div class="muted small">Loading…</div></div>` : `<div class="stack" style="gap:8px"><div>${connectBtn(p)}</div>${["github", "linear", "jira"].includes(t.key) ? `<div class="xs muted">Then link a deployment to a repo, team or project from its Overview page.</div>` : ""}</div>`;
    if (["github", "linear", "jira"].includes(t.key)) controls += `<details><summary class="small">Use a pasted token instead</summary><div class="stack" style="margin-top:10px">${legacyTracker(t, cfg, info)}</div></details>`;
    if (t.key === "slack") controls += slackControls(cfg, info, !!c);
  } else controls = otherControls(t, cfg, info);
  return `${head}${facts}${mapping}${autos}<div class="divider"></div><div class="stack">${controls}</div>${foot}`;
}

async function connectionDetail(cid, t) {
  const box = $("#cxdetail"); if (!box) return;
  const [x, evs] = await Promise.all([api(`/api/connections/${cid}`), api(`/api/connections/${cid}/events`)]);
  const h = x.health; const [hl, hc] = HEALTH[h.state] || [upper(h.state), ""];
  const redraw = () => connectionDetail(cid, t);
  const sync = full => on(async () => { const r = await api(`/api/connections/${cid}/sync`, { method: "POST", body: { full } }); const got = Object.entries(r.result || {}).filter(([, v]) => v).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", "); toast(full ? "Reconciled" + (got ? ": " + got : "") : (got ? "Synced: " + got : "Synced, nothing new")); route(); });
  const drop = on(async () => { const r = await api(`/api/connections/${cid}`, { method: "DELETE" }); toast(r.cleanup_error ? `Disconnected (cleanup: ${r.cleanup_error})` : "Disconnected"); route(); });
  const settings = { ...x.settings };
  const saveSettings = on(async () => { await api(`/api/connections/${cid}/settings`, { method: "PATCH", body: { settings } }); toast("Saved"); redraw(); });
  const fieldHtml = f => {
    if (f.type === "bool") { const hh = on(el => { settings[f.key] = el.checked; }); return `<label class="row" style="gap:8px;font-size:13px"><input type="checkbox" ${settings[f.key] ? "checked" : ""} data-chg="${hh}"> ${esc(f.label)}</label>`; }
    if (f.type === "map") {
      const m = settings[f.key] || {};
      const rows = Object.entries(m).map(([k, v]) => { const del = on(() => { delete m[k]; settings[f.key] = m; H[saveSettings](); }); return `<div class="row nowrap small"><span class="mono">${esc(k)}</span><span class="muted">→</span><span style="flex:1">${esc(v)}</span><button class="btn xs ghost" data-on="${del}">Remove</button></div>`; }).join("");
      const add = on(() => { const a = val(`mk_${f.key}`).trim(), b = val(`mv_${f.key}`).trim(); if (!a || !b) return; settings[f.key] = { ...m, [a]: b }; H[saveSettings](); });
      return `<div class="stack" style="gap:6px"><div class="label" style="font-size:10px">${esc(f.label)}</div>${f.help ? `<div class="xs muted">${esc(f.help)}</div>` : ""}${rows}
        <div class="row nowrap"><input id="mk_${f.key}" placeholder="from" style="flex:1"><input id="mv_${f.key}" placeholder="to" style="flex:1"><button class="btn xs" data-on="${add}">Add</button></div></div>`;
    }
    const hh = on(el => { settings[f.key] = el.value; });
    return `<label class="field"><span>${esc(f.label)}${f.help ? ` <span class="muted">· ${esc(f.help)}</span>` : ""}</span><input value="${esc(settings[f.key] ?? "")}" data-chg="${hh}"></label>`;
  };
  const projects = (x.options && x.options.projects) || [];

/* Live updates: the server says something changed; the current screen refreshes itself. */
function startStream() {
  if (S.streaming || !S.token) return;
  S.streaming = true;
  const gen = (S.streamGen = (S.streamGen || 0) + 1);
  const tok = S.token; let backoff = 3000, timer = null;
  const setLive = on_ => { const el = $("#live"); if (el) el.classList.toggle("on", on_); S.live = on_; };
  const refresh = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const a = document.activeElement;
      const busy = a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || document.querySelector("details[open] input:not([type=checkbox])") || $("#menu") || $("#fbbox");
      if (busy || document.visibilityState !== "visible") { refresh(); return; }
      const sc = document.querySelector(".scroll"); const top = sc ? sc.scrollTop : 0;
      invalidate(); await route();
      const sc2 = document.querySelector(".scroll"); if (sc2) sc2.scrollTop = top;
    }, 1200);
  };
  (async function loop() {
    while (S.token === tok && S.streamGen === gen) {
      try {
        const r = await fetch("/api/stream", { headers: { Authorization: "Bearer " + tok } });
        if (!r.ok || !r.body) throw new Error("stream " + r.status);
        setLive(true); backoff = 3000;
        const reader = r.body.getReader(); S.streamReader = reader; const dec = new TextDecoder(); let buf = "";
        while (S.token === tok) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          let i; while ((i = buf.indexOf("\n\n")) >= 0) { const chunk = buf.slice(0, i); buf = buf.slice(i + 2); if (/^event: change/m.test(chunk)) refresh(); }
        }
        try { reader.cancel(); } catch (e) {}
      } catch (e) {}
      setLive(false);
      if (S.token !== tok) break;
      await new Promise(res => setTimeout(res, backoff)); backoff = Math.min(backoff * 2, 60000);
    }
    if (S.streamGen === gen) S.streaming = false;
  })();
}

            ${s.engines.length < 4 ? `<select style="height:28px;font-size:12px" data-chg="${on(el => { if (el.value) { s.engines.push(el.value); draw(); } })}" aria-label="Add engine"><option value="">+ engine</option>${engOpts.filter(([k]) => !s.engines.includes(k)).map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join("")}</select>` : ""}</div></td>
          <td>${inp(s, "exit_criteria", 'style="width:100%;min-width:240px"')}</td>
          <td style="white-space:nowrap"><button class="btn xs" ${i ? "" : "disabled"} aria-label="Move up" data-on="${on(() => { [cfg.stages[i - 1], cfg.stages[i]] = [cfg.stages[i], cfg.stages[i - 1]]; draw(); })}">↑</button> <button class="btn xs danger" aria-label="Remove stage" data-on="${on(() => { cfg.stages.splice(i, 1); draw(); })}">✕</button></td></tr>`).join("")}
        </tbody></table></div><div class="tfoot"><button class="btn sm" data-on="${on(() => { cfg.stages.push({ key: "stage_" + (cfg.stages.length + 1), name: "New stage", engines: [], target_days: 14, exit_criteria: "" }); draw(); })}">Add stage</button><button class="btn sm" data-on="${on(() => { cfg.stages = JSON.parse(JSON.stringify(meta.defaults.stages)); draw(); })}">Reset to default template</button></div></div>`;
    }
    if (t === "engines") {
      const custom = Object.values(engines).filter(e => !e.builtin);
      const reg = on(async () => {
        const b = { name: val("ne_name"), key: val("ne_key"), kind: val("ne_kind"), does: val("ne_does"), input_hint: val("ne_hint") };
        if (b.kind === "webhook") b.url = val("ne_url");
        const r = await api("/api/engines", { method: "POST", body: b }); await loadConfig(); showSecret(r);
      });
      body = `<div class="panel"><div class="label">Your engines</div><p class="small muted" style="margin:0">Plug in your own scripts and integrations. Results become findings with the same confirmation and audit trail as the built-ins.</p>
        ${custom.length ? `<table class="tbl compact inpanel"><thead><tr><th>Engine</th><th>Kind</th><th>Where</th><th></th></tr></thead><tbody>${custom.map(e => `<tr><td><div class="nm">${esc(e.name)}</div><div class="sm">${esc(e.does)}</div></td><td class="small">${e.kind === "webhook" ? "Webhook · we call it" : "Push · it calls us"}</td><td class="mono xs" style="word-break:break-all">${esc(e.url || "posts to /api/ingest/findings")}</td>
          <td style="white-space:nowrap;text-align:right"><button class="btn xs" data-on="${on(async () => showSecret(await api(`/api/engines/${e.key}/rotate`, { method: "POST" })))}">Rotate credential</button>
          ${can("config.edit") ? `<button class="btn xs danger" data-on="${on(async () => { if (cfg.stages.some(s => s.engines.includes(e.key))) { toast("Take it off its stage first (Deployment chain tab)", true); return; } cfg.engines = cfg.engines.filter(x => x.key !== e.key); await save(); })}">Remove</button>` : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No engines of your own yet.</div>`}
        <div id="eng_secret"></div></div>
        <div class="panel"><div class="label">Register an engine</div><div class="formgrid">
          <label class="field"><span>Name</span><input id="ne_name" placeholder="Integration health check" data-chg="${on(() => { if (!$("#ne_key").dataset.touched) $("#ne_key").value = val("ne_name").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 32); })}"></label>
          <label class="field"><span>Key</span><input id="ne_key" class="mono" placeholder="integration_health" data-chg="${on(el => { el.dataset.touched = "1"; })}"></label>
          <label class="field"><span>Kind</span><select id="ne_kind" data-chg="${on(el => { $("#ne_url_l").style.display = el.value === "webhook" ? "" : "none"; })}"><option value="webhook">Webhook: we call your service</option><option value="push">Push: your script posts results</option></select></label>
          <label class="field" id="ne_url_l"><span>URL (https)</span><input id="ne_url" placeholder="https://engines.yourco.com/health"></label>
          <label class="field" style="grid-column:1/-1"><span>What it does</span><input id="ne_does"></label>
          <label class="field" style="grid-column:1/-1"><span>Input hint (shown to whoever runs it)</span><input id="ne_hint"></label>
          <div><button class="btn primary" data-on="${reg}">Register engine</button></div></div></div>
        <div class="panel flush"><table class="tbl"><thead><tr><th>Built-in engine</th><th>Status</th></tr></thead><tbody>${Object.values(engines).filter(e => e.builtin && e.key !== "none").map(e => `<tr><td><div class="nm">${esc(e.name)}</div><div class="sm">${esc(e.does)}</div></td><td><span class="chip good">LIVE</span></td></tr>`).join("")}</tbody></table></div>`;
    }
    if (t === "sso" && ssoInfo) {
      const c = cfg.sso;
      const sync = on(() => { cfg.sso = { enabled: val("sso_on"), issuer: val("sso_iss").trim(), client_id: val("sso_cid").trim(), allowed_domains: val("sso_dom").split(",").map(x => x.trim()).filter(Boolean), jit_role: val("sso_jit"), required: val("sso_req") }; });
      const sec = on(async () => { if (!val("sso_sec")) return; await api("/api/sso/secret", { method: "PUT", body: { client_secret: val("sso_sec") } }); toast("Client secret saved, encrypted"); draw(); });
      body = `<div class="panel" style="max-width:780px"><p class="small muted" style="margin:0">Let people sign in with your identity provider: Okta, Microsoft Entra ID, Google Workspace, or any OpenID Connect provider.</p>
        <label class="row" style="gap:8px"><input type="checkbox" id="sso_on" data-chg="${sync}" ${c.enabled ? "checked" : ""}> Enable company sign-in</label>
        <label class="field"><span>Issuer URL</span><input id="sso_iss" data-chg="${sync}" value="${esc(c.issuer)}" placeholder="https://yourco.okta.com"></label>
        <label class="field"><span>Client ID</span><input id="sso_cid" data-chg="${sync}" value="${esc(c.client_id)}"></label>
        <label class="field"><span>Client secret ${ssoInfo.client_secret_set ? `<b class="good">· set</b>` : `<b class="warn">· not set</b>`}</span><div class="row nowrap"><input id="sso_sec" type="password" placeholder="${ssoInfo.client_secret_set ? "Enter a new secret to replace it" : "Paste from your identity provider"}" style="flex:1"><button class="btn sm" data-on="${sec}">Save secret</button></div></label>
        <label class="field"><span>Allowed email domains, comma-separated</span><input id="sso_dom" data-chg="${sync}" value="${esc(c.allowed_domains.join(", "))}" placeholder="yourco.com"></label>
        <label class="field"><span>Create accounts on first sign-in with role</span><select id="sso_jit" data-chg="${sync}"><option value="">Off: an admin adds people first</option>${cfg.roles.map(r => `<option value="${esc(r.key)}" ${r.key === c.jit_role ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
        <label class="row nowrap" style="gap:8px;align-items:flex-start;font-size:13px"><input type="checkbox" id="sso_req" data-chg="${sync}" style="margin-top:3px" ${c.required ? "checked" : ""}> Require company sign-in. Access tokens keep working only for people who can edit settings, as break-glass access.</label>
        <div class="panel sunk"><div class="label">Redirect URI for your identity provider</div><code class="mono small">${esc(ssoInfo.redirect_uri)}</code><div class="label" style="margin-top:6px">Your people's sign-in link</div><code class="mono small">${esc(ssoInfo.start_url)}</code></div></div>`;
    }
    if (t === "fields") body = `<div class="panel"><p class="small muted" style="margin:0">JSON. Types: text, number, date, select (with options), bool.</p><textarea id="fields" rows="16">${esc(JSON.stringify(cfg.fields, null, 2))}</textarea></div>`;
    const saveBtn = on(async () => { if (S.settingsTab === "fields") { try { cfg.fields = JSON.parse(val("fields")); } catch (e) { toast("Custom fields isn't valid JSON", true); return; } } await save(); });
    page(`<div><h1>Settings</h1><p class="lede">Start from the default template and make it yours. Every change is validated and audited.${can("integrations.manage") ? ` Slack, trackers and webhooks live under <a href="#/integrations">Integrations</a>.` : ""}</p></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === t}" class="tab ${k === t ? "on" : ""}" data-on="${on(() => { S.settingsTab = k; draw(); })}">${esc(l)}</button>`).join("")}</div>
      ${body}
      ${t !== "engines" ? `<div class="row"><button class="btn primary" data-on="${saveBtn}">Save settings</button><button class="btn" data-on="${on(() => route())}">Discard changes</button></div>` : ""}`);
  };
  function showSecret(r) {
    const el = $("#eng_secret"); if (!el) { draw(); return; }
    const [label, v] = r.signing_secret ? ["Signing secret", r.signing_secret] : ["Engine token", r.engine_token];
    el.innerHTML = `<div class="secret"><b>${label}</b> <span class="muted">· ${esc(r.note)}</span><code>${esc(v)}</code></div>`;
  }
  draw();
}

/* ============================================================== import */
async function importView() {
  const fieldCols = S.cfg.fields.deployment.map(f => f.key).join(", ");
  const roleList = S.cfg.roles.map(r => r.name).join(", ");
  const kinds = [
    ["deployments", "Deployments", can("deployment.create"), `Columns: <b>customer, deployment</b> (required), stage, health, lead_email, industry${fieldCols ? ", " + esc(fieldCols) : ""}. Customers are created if they don't exist.`, "customer,deployment,stage,health,lead_email\nAcme Foods,Order-to-cash agent,Integrate,at risk,"],
    ["tasks", "Tasks", can("task.create"), `Columns: <b>deployment, title</b> (required), assignee_email, status, due, share. Deployment is matched by name. Tasks for customer contacts are shared with them.`, "deployment,title,assignee_email,status,due\nOrder-to-cash agent,Map invoice states,,open,2026-10-09"],
    ["time", "Timesheets", can("people.read"), `Columns: <b>email, day, hours</b> (required), deployment. Export from Harvest, Toggl or your PSA. Hours feed utilization, burn and the budget rule.`, "email,day,hours,deployment\nmaya@yourco.com,2026-09-22,6,AP exception agent"],
    ["pipeline", "Pipeline", can("pipeline.edit"), `Columns: <b>name</b> (required), customer, use_case, value, probability, stage (lead, qualified, proposal, commit, won, lost), expected_start, weekly_hours, external_id. Re-importing updates deals by external_id or name.`, "name,customer,value,probability,stage,expected_start,weekly_hours,external_id\nAcme · Claims agent,Acme,250000,40%,proposal,2026-11-02,60,006Qx0001"],
    ["people", "People", can("people.manage"), `Columns: <b>name, email</b> (required), role (${esc(roleList)}), weekly_hours. Everyone added signs in with the email you list. Existing emails are skipped.`, "name,email,role,weekly_hours\nMaya Chen,maya@yourco.com,Forward Deployed Engineer,40"],
  ].filter(k => k[2]);
  if (!kinds.some(k => k[0] === S.importKind)) S.importKind = kinds[0][0];
  const k = kinds.find(x => x[0] === S.importKind);
  const file = on(async el => { const f = el.files[0]; if (f) $("#imp_csv").value = await f.text(); });
  const run = on(async () => {
    const r = await api("/api/import", { method: "POST", body: { kind: k[0], csv: val("imp_csv") } });
    $("#imp_out").innerHTML = `<div class="panel sunk"><b class="good">${r.created} imported</b>${r.note ? `<div class="small">${esc(r.note)}</div>` : ""}${r.errors.length ? `<div class="small"><b class="warn">${plural(r.errors.length, "row")} skipped</b>${r.errors.map(x => `<div class="muted">${esc(x)}</div>`).join("")}</div>` : ""}</div>`;
    if (r.created) { invalidate(); toast(`${r.created} ${k[1].toLowerCase()} imported`); }
  });
  page(`<div><h1>Import</h1><p class="lede">Bring what you already have in from a spreadsheet. Save it as CSV, then paste it or pick the file. Every row is checked; bad rows are skipped and listed.</p></div>
    <div class="tabs" role="tablist">${kinds.map(x => `<button role="tab" class="tab ${x[0] === k[0] ? "on" : ""}" data-on="${on(() => { S.importKind = x[0]; route(); })}">${esc(x[1])}</button>`).join("")}</div>
    <div class="panel"><div class="small text2">${k[3]}</div>
      <textarea id="imp_csv" rows="10" aria-label="CSV" placeholder="${esc(k[4])}"></textarea>
      <div class="row"><input type="file" accept=".csv,text/csv" aria-label="CSV file" data-chg="${file}" style="height:auto;border:0;padding:0"><div class="spacer"></div><button class="btn primary" data-on="${run}">Import</button></div>
      <div id="imp_out"></div></div>`);
}

/* =============================================================== audit */
async function auditView() {
  const rows = await api("/api/audit?limit=200");
  const verify = on(async () => {
    const x = await api("/api/audit/verify");
    $("#vout").innerHTML = `<div class="panel ${x.ok ? "goodline" : "alert"}">${x.ok ? `<b class="good">Chain intact</b> <span class="muted">· ${x.entries} entries verified</span>` : `<b class="bad">Chain broken</b> at entry #${x.broken_at}`}<div class="hash">head ${esc(x.head)}</div></div>`;
  });
  page(`<div class="headrow"><div><h1>Audit trail</h1><p class="lede">Every change, run, sign-in, sync and agent action, hash-chained. Editing or deleting any entry breaks every hash after it.</p></div>${can("audit.verify") ? `<button class="btn primary" data-on="${verify}">Verify chain</button>` : ""}</div>
    <div id="vout"></div>
    <div class="panel flush"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>#</th><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="mono muted">${r.seq}</td><td class="mono xs" style="white-space:nowrap">${esc(String(r.at).replace("T", " ").slice(0, 16))}</td><td class="small">${esc(r.actor)}</td><td class="mono xs">${esc(r.action)}</td>
      <td class="small"><span class="text2">${esc(Object.entries(r.detail).map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · "))}</span><div class="hash">${esc(r.hash)}</div></td></tr>`).join("")}</tbody></table></div></div>`);
}

/* ============================================================ AI tools */
async function aiView() {
  const toks = await api("/api/me/tokens");
  const base = location.origin; const tokenFor = S.newToken || "fwp_YOUR_TOKEN";
  const snip = (title, note, code) => `<div class="panel"><div class="phead"><b>${esc(title)}</b><button class="btn xs" data-on="${on(async () => { try { await navigator.clipboard.writeText(code); toast("Copied"); } catch (e) { toast("Couldn't copy; select the text instead", true); } })}">Copy</button></div>${note ? `<div class="small muted">${note}</div>` : ""}<pre class="code">${esc(code)}</pre></div>`;
  const mcpJson = key => JSON.stringify({ mcpServers: { fieldwork: { [key]: `${base}/mcp`, headers: { Authorization: `Bearer ${tokenFor}` } } } }, null, 2);
  const stdioJson = JSON.stringify({ mcpServers: { fieldwork: { command: "fieldwork", args: ["mcp", "--url", base, "--token", tokenFor] } } }, null, 2);
  const create = on(async () => { const r = await api("/api/me/tokens", { method: "POST", body: { name: val("tok_name") || "AI tool" } }); S.newToken = r.token; await aiView(); S.newToken = null; });
  page(`<div><h1>AI tools</h1><p class="lede">Use ${esc(brand().product_name)} from Claude, Cursor, Codex, Gemini, the OpenAI API or Grok. Your AI tool acts as you, with your permissions; everything it does is on the audit trail under your name. Engine results still need someone else to confirm them, and actions on a customer system can ask a person first with <span class="mono">request_approval</span>.</p></div>
    <div class="panel"><div class="label">Your access tokens</div>
      ${toks.length ? `<table class="tbl compact inpanel"><thead><tr><th>Name</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody>${toks.map(t => `<tr><td>${esc(t.name)}</td><td class="mono xs">${fmtDate(t.created_at)}</td><td class="mono xs">${t.last_used_at ? fmtDate(t.last_used_at) : "never"}</td><td style="text-align:right"><button class="btn xs danger" data-on="${on(async () => { await api(`/api/me/tokens/${t.id}`, { method: "DELETE" }); toast("Token revoked"); aiView(); })}">Revoke</button></td></tr>`).join("")}</tbody></table>` : `<div class="small muted">No tokens yet.</div>`}
      <div class="row nowrap"><input id="tok_name" placeholder="Name it after the tool, e.g. Cursor" style="flex:1" data-enter="${create}"><button class="btn primary" data-on="${create}">Create token</button></div>
      ${S.newToken ? `<div class="secret"><b>New token</b> <span class="muted">· shown once; it's filled into the setups below</span><code>${esc(S.newToken)}</code></div>` : ""}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(360px,1fr))">
      ${snip("Claude Code", "Run once in a terminal.", `claude mcp add --transport http fieldwork ${base}/mcp --header "Authorization: Bearer ${tokenFor}"`)}
      ${snip("Cursor", "Add to ~/.cursor/mcp.json, or .cursor/mcp.json in a project.", mcpJson("url"))}
      ${snip("Gemini CLI", "Add to ~/.gemini/settings.json.", mcpJson("httpUrl"))}
      ${snip("Codex CLI", "Add to ~/.codex/config.toml. Uses the local bridge: pip install fieldwork first.", `[mcp_servers.fieldwork]\ncommand = "fieldwork"\nargs = ["mcp", "--url", "${base}", "--token", "${tokenFor}"]`)}
      ${snip("Claude Desktop", "Add to claude_desktop_config.json. Uses the local bridge: pip install fieldwork first.", stdioJson)}
      ${snip("OpenAI API (Responses, Agents)", "Pass as a remote MCP tool.", `tools=[{\n  "type": "mcp",\n  "server_label": "fieldwork",\n  "server_url": "${base}/mcp",\n  "headers": {"Authorization": "Bearer ${tokenFor}"},\n  "require_approval": "always"\n}]`)}
      ${snip("Grok (xAI API)", "Add as a remote MCP tool with this URL and header; see xAI's Remote MCP Tools docs for the request shape.", `server_url:  ${base}/mcp\nheader:      Authorization: Bearer ${tokenFor}`)}
      <div class="panel"><b>ChatGPT and Claude.ai connectors</b><div class="small muted">These sign in to remote servers with OAuth, which is on the roadmap. Until then, use one of the setups here.</div></div>
    </div>
    <div class="panel"><div class="label">Try asking</div><div class="text2">“What needs me today?” · “Mark the NetSuite connector task done on Northfield.” · “Harborview is waiting on the customer's security review; log it.” · “Ask for approval before writing to Epic.” · “Which deployments are past their stage targets?”</div></div>`);
}

/* ================================================================ boot */
setTheme(theme());
applyBrand();
(async function boot() {
  try { const r = await fetch("/api/demo"); S.demo = r.ok; } catch (e) {}
  // One-click installs come back as ?connected=<provider> or ?oauth_error=<reason>.
  const qs = new URLSearchParams(location.search);
  if (qs.has("login_error")) { const m = qs.get("login_error"); history.replaceState(null, "", location.pathname + (qs.has("signup") ? "?signup=1" : "")); setTimeout(() => toast(m, true), 300); }
  if (qs.has("connected") || qs.has("oauth_error")) {
    S.flash = { connected: qs.get("connected"), oauth_error: qs.get("oauth_error") };
    history.replaceState(null, "", location.pathname + location.hash);
  }
  // Company sign-in returns with the session (or an error) in the fragment, which browsers never send to servers.
  const frag = new URLSearchParams(location.hash.slice(1));
  if (frag.has("session") || frag.has("sso_error") || frag.has("dep")) history.replaceState(null, "", location.pathname);
  if (frag.get("dep")) S.pendingDep = frag.get("dep");
  if (frag.get("note")) { S.welcome = frag.get("note") === "welcome"; if (!S.welcome) setTimeout(() => toast(frag.get("note")), 800); }
  if (frag.get("session")) return act(signIn)(frag.get("session"));
  if (frag.get("sso_error")) { renderSignIn(); return toast(frag.get("sso_error"), true); }
  S.token ? act(signIn)(S.token) : renderSignIn();
})();
</script>
