<!doctype html>
<html lang="en" class="fw-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.fw-dark{--bg:#0e1014;--header:#101318;--sunk:#12151a;--panel:#151920;--panel2:#1b2028;--line:#252a32;--line2:#1d2128;--line3:#353b45;--line4:#4a505a;--pending:#2a2f38;--text:#e8e6df;--text2:#c9cbc8;--muted:#a3a9b2;--accent:#e8b25c;--accenthi:#f3c97f;--onaccent:#1a1408;--accentbg:#2a2216;--selbg:#1f1b14;--selline:#3a3122;--good:#5fb98a;--goodbg:#18251f;--goodline:#27402f;--bad:#e07a6a;--badbg:#2e1d1a;--badline:#3a2a26;--blue:#6fa3d9;--bluebg:#1f2530;--purple:#c9a0dc;--purplebg:#261f2b;--warn:#e8b25c;--warnbg:#2a2216;--shadow:0 10px 30px #0009;color-scheme:dark}
.fw-light{--bg:#f6f4ee;--header:#fbfaf6;--sunk:#efece4;--panel:#ffffff;--panel2:#f1eee6;--line:#e2ddd2;--line2:#ece8df;--line3:#cfc9bc;--line4:#a9a293;--pending:#dcd6ca;--text:#1c1b18;--text2:#3d3a33;--muted:#6b665c;--accent:#a8660f;--accenthi:#8a520a;--onaccent:#ffffff;--accentbg:#f6ead3;--selbg:#faf1e0;--selline:#e6cfa3;--good:#2f7d55;--goodbg:#e3f1e8;--goodline:#b9dcc6;--bad:#b4432f;--badbg:#f8e3de;--badline:#efc6bd;--blue:#2f5f9a;--bluebg:#e3ebf5;--purple:#7a4f96;--purplebg:#f1e8f6;--warn:#a8660f;--warnbg:#f6ead3;--shadow:0 10px 30px #3a30201f;color-scheme:light}
/* white-label accent: set by applyBrand() when the workspace picks its own color */
.branded.fw-dark{--accent:var(--brand);--accenthi:color-mix(in srgb,var(--brand) 80%,#fff);--accentbg:color-mix(in srgb,var(--brand) 16%,#0e1014);--selbg:color-mix(in srgb,var(--brand) 9%,#12151a);--selline:color-mix(in srgb,var(--brand) 30%,#1d2128);--onaccent:var(--brand-ink)}
.branded.fw-light{--accent:color-mix(in srgb,var(--brand) 70%,#000);--accenthi:color-mix(in srgb,var(--brand) 55%,#000);--accentbg:color-mix(in srgb,var(--brand) 16%,#fff);--selbg:color-mix(in srgb,var(--brand) 8%,#fff);--selline:color-mix(in srgb,var(--brand) 35%,#fff);--onaccent:#fff}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{color:var(--accenthi)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
input,select,textarea{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line3);border-radius:6px;padding:0 10px;height:36px}
textarea{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px;height:auto;width:100%;line-height:1.5}
input[type=checkbox]{height:auto;accent-color:var(--accent)}
input[type=color]{padding:2px;width:56px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::placeholder{color:var(--line4)}

/* ------------------------------------------------------------ shell */
.shell{display:flex;height:100vh;min-height:0}
nav.side{width:236px;flex-shrink:0;background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:26px;height:26px;object-fit:contain;border-radius:4px}
.brand b{display:block;font-weight:700;font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.navlist{display:flex;flex-direction:column;gap:2px}
.navsep{height:1px;background:var(--line);margin:8px 6px}
.navitem{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:8px 10px;border-radius:7px;text-align:left;color:var(--text);border:1px solid transparent;background:transparent;gap:8px}
.navitem:hover{background:var(--panel)}
.navitem.on{background:var(--selbg);border-color:var(--selline)}
.navitem .l{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.navitem .t{font-size:13.5px;font-weight:500}
.navitem .s{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.navitem .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
.navitem .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
.navitem.back{min-height:36px;color:var(--muted)}
.navfoot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px;line-height:1.45;color:var(--text2)}
main.main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
header.top{height:64px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--header);gap:16px}
header.top .ctx{display:flex;align-items:center;gap:14px;min-width:0}
header.top .ctx .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ctx .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .me{display:flex;align-items:center;gap:12px;flex-shrink:0}
header.top .who{font-size:13px;color:var(--muted);white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:0}
.scroll{flex-grow:1;overflow:auto}
.page{padding:26px 28px 60px;display:flex;flex-direction:column;gap:20px;max-width:1600px}
.menu{position:absolute;right:28px;top:58px;background:var(--panel);border:1px solid var(--line3);border-radius:8px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:20}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--panel2)}
.menu .mhead{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;color:var(--muted)}

/* ------------------------------------------------------ typography */
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.005em}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:0;font-size:14px;font-weight:600}
.lede{margin:6px 0 0;font-size:13.5px;color:var(--muted);max-width:860px}
.label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.label.bad{color:var(--bad)} .label.accent{color:var(--accent)} .label.warn{color:var(--warn)} .label.good{color:var(--good)}
.muted{color:var(--muted)} .text2{color:var(--text2)} .small{font-size:12px} .xs{font-size:11px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .blue{color:var(--blue)} .purple{color:var(--purple)}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.lg{gap:16px}

/* ----------------------------------------------------------- panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flush{padding:0;gap:0;overflow:hidden}
.panel.alert{border-color:var(--badline)}
.panel.goodline{border-color:var(--goodline)}
.panel.sunk{background:var(--sunk)}
.panel .phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub-card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:7px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-wide{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.w12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;grid-auto-flow:row dense}
.band{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.span12{grid-column:span 12} .span7{grid-column:span 7} .span5{grid-column:span 5} .span6{grid-column:span 6}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.kpi .v{font-size:30px;font-weight:600;margin-top:6px;line-height:1.15}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:var(--badline)}

/* ------------------------------------------------------------ chips */
@media (max-width:900px){.int-split{grid-template-columns:minmax(0,1fr)!important}.int-split #tooldetail{position:static!important}}
.livedot{display:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--good);align-items:center;gap:5px}.livedot.on{display:inline-flex}.livedot::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--good)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--panel2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.3}
.chip.accent{background:var(--accentbg);color:var(--accent)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.blue{background:var(--bluebg);color:var(--blue)}
.chip.purple{background:var(--purplebg);color:var(--purple)}
.chip.line{background:transparent;border:1px solid var(--line3)}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}

/* ------------------------------------------------------------ chain */
.cells{display:grid;gap:4px}
.cell{height:10px;border-radius:3px;background:var(--pending)}
.cell.done{background:var(--good)} .cell.progress{background:var(--warn)} .cell.stalled{background:var(--bad)}
.cells.sm .cell{height:8px;border-radius:2px}
.cell.skipped{background:transparent;border:1px dashed var(--line4)} .cell.hold{background:var(--blue)}
.step.skipped{opacity:.65} .step.skipped .bar{background:transparent;border-top:1px dashed var(--line4);height:0;margin-top:10px}
.step.hold{border-color:var(--blue);background:var(--bluebg)} .step.hold .bar{background:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line3);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border:0;border-right:1px solid var(--line3);background:transparent;color:var(--muted);font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--text);background:var(--panel2)}
.seg button.on{color:var(--text);font-weight:600;background:var(--panel2)}
.seg button.on.done{background:var(--goodbg);color:var(--good)} .seg button.on.in_progress{background:var(--warnbg);color:var(--warn)}
.waiting{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);padding:0 0 6px}
.chipbtn{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line3);background:transparent;color:var(--text);font-size:12px}
.chipbtn:hover{border-color:var(--accent);background:var(--selbg)}
.holdbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--bluebg);border:1px solid var(--blue);color:var(--text);font-size:13px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:2px;display:inline-block}
.stepper{display:grid;gap:6px}
.step{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel);min-width:0}
.step .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--muted)}
.step .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .bar{height:4px;border-radius:2px;background:var(--pending);margin-top:8px}
.step.done .bar{background:var(--good)} .step.progress{border-color:var(--warn);background:var(--warnbg)} .step.progress .bar{background:var(--warn)}
.step.stalled{border-color:var(--badline);background:var(--badbg)} .step.stalled .bar{background:var(--bad)}

/* ----------------------------------------------------------- tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:400;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.compact th,.tbl.compact td{padding:9px 12px}
.tbl.inpanel th:first-child,.tbl.inpanel td:first-child{padding-left:0}
.tbl.inpanel th:last-child,.tbl.inpanel td:last-child{padding-right:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--selbg)}
.tbl .nm{font-weight:500}
.tbl .sm{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto;max-width:100%}
.grid>*{min-width:0}
.tfoot{display:flex;gap:18px;padding:12px 18px;flex-wrap:wrap}

/* ---------------------------------------------------------- buttons */
.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line3);background:transparent;color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line4);background:var(--panel2);color:var(--text)}
.btn.primary{border:0;background:var(--accent);color:var(--onaccent);font-weight:600}
.btn.primary:hover{background:var(--accenthi)}
.btn.danger{border-color:var(--badline);color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.xs{height:26px;padding:0 8px;font-size:11.5px}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:inherit;text-align:left}
.linkbtn:hover{color:var(--accenthi);text-decoration:underline}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:36px;padding:0 14px;border-radius:6px;font-size:13px;color:var(--text);border:1px solid var(--line);background:transparent}
.tab.on{border-color:var(--selline);background:var(--selbg)}

/* ------------------------------------------------------------ tasks */
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:46px;border-top:1px solid var(--line2);padding:6px 0}
.task:first-of-type{border-top:0}
.task .ttl{font-size:13.5px;min-width:0}
.task .ttl.done{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.box{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--onaccent);border:1px solid var(--line4);background:transparent;padding:0}
.box.on{border-color:var(--good);background:var(--good)}
.box.blocked{border-color:var(--bad);color:var(--bad);font-weight:700}
.box:disabled{cursor:default;opacity:.7}
.task select{height:28px;font-size:12px;padding:0 6px}

/* ------------------------------------------------------------- bars */
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.track.thin{height:6px;border-radius:3px}
.track .fill{height:100%;border-radius:inherit;background:var(--good)}
.track .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);border-radius:1px}
.capacity{display:grid;grid-template-columns:170px minmax(0,1fr) 72px;gap:14px;align-items:center}
.stbar{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:12px;align-items:center}

/* ------------------------------------------------------------- misc */
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line3);border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.field > span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
.secret{background:var(--accentbg);border:1px solid var(--selline);border-radius:8px;padding:12px;font-size:13px}
.secret code{display:block;margin-top:6px;word-break:break-all;color:var(--text);font-size:12px}
.code{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:var(--text2);margin:0}
.hash{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);word-break:break-all}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--line4)}
details[open]>summary::before{content:"▾ "}
.md h3{font-size:15px;margin:2px 0 6px}
.md .h{margin:12px 0 4px;font-weight:600}
.md .li{padding-left:14px;text-indent:-10px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1px solid var(--line3);padding:11px 14px;border-radius:8px;max-width:440px;box-shadow:var(--shadow);display:none;z-index:40;font-size:13px}
.toast.err{border-color:var(--bad)}
.divider{height:1px;background:var(--line)}
.mapgrid{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line2);font-size:12.5px;align-items:center}
.mapgrid.h{background:var(--sunk);border-top:0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.tile{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;border-radius:8px;text-align:left;color:var(--text);border:1px solid var(--line);background:var(--panel);width:100%}
.tile.on{border-color:var(--accent);background:var(--selbg)}
.mark{width:32px;height:32px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--bg)}
.mark.lg{width:44px;height:44px;border-radius:9px;font-size:14px}
.mark.off{opacity:.45}
.sep{color:var(--line4)}

.signin{max-width:440px;margin:9vh auto;padding:0 16px;display:flex;flex-direction:column;gap:18px}

@media (max-width:1200px){.band{grid-template-columns:1fr}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main,.g-wide{grid-template-columns:1fr}.span7,.span5,.span6{grid-column:span 12}}
@media (max-width:900px){
  .shell{flex-direction:column;height:auto;min-height:100vh}
  nav.side{width:auto;flex-direction:row;padding:10px 12px;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .brand,.navfoot,.navsep{display:none}
  .navlist{flex-direction:row}
  .navitem{min-height:38px;width:auto}
  .navitem .s,.navitem .n{display:none}
  header.top{padding:0 16px}
  header.top .who{display:none}
  .page{padding:18px 16px 60px}
  .g2,.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .capacity{grid-template-columns:120px minmax(0,1fr) 60px}
  .scroll{overflow:visible}
}
@media (max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.tbl th,.tbl td{padding:10px 12px}.task{grid-template-columns:24px minmax(0,1fr)}.task .meta{grid-column:2;justify-content:flex-start}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================================================================ core */
const S = { token: null, me: null, cfg: null, engines: null, meta: null, route: ["home"], cache: {}, settingsTab: "branding", intSel: null };
try { S.token = sessionStorage.getItem("fw_token"); } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const can = a => !!(S.me && S.me.can[a]);
const scope = a => (S.me && S.me.can[a]) || null;
const stageOf = k => (S.cfg.stages.find(s => s.key === k) || { key: k, name: k, engines: [], exit_criteria: "", target_days: null });
const stageName = k => stageOf(k).name;
const roleName = k => (S.cfg.roles.find(r => r.key === k) || { name: k }).name;
const engName = k => (S.engines[k] || {}).name || k;
const brand = () => (S.cfg && S.cfg.branding) || { product_name: "Fieldwork", accent: "#e8b25c", logo_url: "" };
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const parseDay = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => { const d = parseDay(s); return d ? `${MON[d.getMonth()]} ${d.getDate()}` : "—"; };
const fmtDateY = s => { const d = parseDay(s); return d ? `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : "—"; };
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const daysFrom = s => { const d = parseDay(s); if (!d) return null; const t = parseDay(todayIso()); return Math.round((d - t) / 86400000); };
const money = v => v == null ? "—" : v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "k" : "$" + Math.round(v);
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const num = v => v == null ? "—" : (Math.round(v * 10) / 10).toLocaleString();
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;
const upper = s => String(s || "").toUpperCase();

function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : "");
  t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 4800);
}
async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && S.me) { signOut(); throw new Error("signed out"); }
  if (!r.ok) { const d = j && j.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || r.statusText)); }
  return j;
}
const act = fn => async (...a) => { try { return await fn(...a); } catch (e) { if (e.message !== "signed out") toast(e.message, true); } };

/* Event delegation: markup carries data-on="h12"; handlers live in H for the current render. */
let H = {}, hid = 0;
const on = fn => { const id = "h" + (++hid); H[id] = act(fn); return id; };
document.addEventListener("click", e => {
  const el = e.target.closest("[data-on]");
  if (el && H[el.dataset.on] && !el.disabled) { if (el.tagName === "A" || el.tagName === "BUTTON") e.preventDefault(); H[el.dataset.on](el, e); }
  const m = $("#menu"); if (m && !e.target.closest("#menu") && !e.target.closest("#avatar")) m.remove();
});
document.addEventListener("change", e => { const el = e.target.closest("[data-chg]"); if (el && H[el.dataset.chg]) H[el.dataset.chg](el, e); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { const el = e.target.closest("[data-enter]"); if (el && H[el.dataset.enter]) { e.preventDefault(); H[el.dataset.enter](el, e); } }
  if (e.key === "Escape") { const m = $("#menu"); if (m) m.remove(); }
});
const val = id => { const el = document.getElementById(id); return el ? (el.type === "checkbox" ? el.checked : el.value) : null; };

/* ============================================================ theme, brand */
function theme() { try { return localStorage.getItem("fw_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch (e) { return "dark"; } }
function setTheme(t) {
  try { localStorage.setItem("fw_theme", t); } catch (e) {}
  const h = document.documentElement; h.classList.remove("fw-dark", "fw-light"); h.classList.add("fw-" + t);
}
function applyBrand() {
  const b = brand(); const h = document.documentElement;
  const custom = b.accent && b.accent.toLowerCase() !== "#e8b25c";
  h.classList.toggle("branded", !!custom);
  if (custom) {
    const hex = b.accent.replace("#", ""); const [r, g, bl] = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
    h.style.setProperty("--brand", b.accent);
    h.style.setProperty("--brand-ink", (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.55 ? "#14120c" : "#ffffff");
  }
  document.title = b.product_name;
}
function logo(size = 26) {
  const b = brand();
  if (b.logo_url) return `<img src="${esc(b.logo_url)}" alt="" width="${size}" height="${size}">`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 26 26" fill="none" style="stroke:var(--accent)" stroke-width="1.8" aria-hidden="true"><path d="M3 20 L9 8 L14 16 L18 10 L23 20"/><circle cx="9" cy="8" r="1.6"/><circle cx="18" cy="10" r="1.6"/></svg>`;
}
const sunIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="stroke:currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;

/* ============================================================== sign-in */
function signOut() {
  if (S.token && S.token.startsWith("fwsess_")) fetch("/api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + S.token } }).catch(() => {});
  S.token = null; S.me = null; S.cfg = null; S.cache = {};
  if (S.streamReader) { try { S.streamReader.cancel(); } catch (e) {} S.streamReader = null; }
  S.streaming = false;
  try { sessionStorage.removeItem("fw_token"); } catch (e) {}
  history.replaceState(null, "", location.pathname); applyBrand(); renderSignIn();
}
async function signIn(token) {
  S.token = token.trim();
  try { S.me = await api("/api/me"); } catch (e) { S.token = null; toast("That token wasn't accepted", true); return; }
  try { sessionStorage.setItem("fw_token", S.token); } catch (e) {}
  await loadConfig();
  if (S.pendingDep) { location.hash = "#/dep/" + S.pendingDep; S.pendingDep = null; }
  await route();
  startStream();
  if (S.flash) {
    const f = S.flash;
    if (f.connected) toast(`${(TOOLS.flatMap(g => g.items).find(t => t.key === f.connected) || { name: f.connected }).name} connected`);
    if (f.oauth_error) toast(f.oauth_error, true);
    S.flash = null;
  }
}
async function loadConfig() { const c = await api("/api/config"); S.cfg = c.config; S.meta = c; S.engines = c.engines; applyBrand(); }
function lastWorkspace() { try { return localStorage.getItem("fw_ws") || ""; } catch (e) { return ""; } }

async function loginWith(provider, mode) {
  const body = { provider, mode };
  if (mode === "signup") { body.workspace = (val("nw_name") || "").trim(); if (!body.workspace) { toast("Name your workspace first", true); return; } }
  const r = await fetch("/api/beta/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.detail || "That didn't work", true); return; }
  location.href = j.url;
}
const PROVIDER_NAME = { github: "GitHub", google: "Google" };
async function renderSignIn() {
  H = {};
  let demos = [], beta = { signup: false, providers: [] };
  try { const r = await fetch("/api/demo"); if (r.ok) demos = await r.json(); } catch (e) {}
  try { const r = await fetch("/api/beta"); if (r.ok) beta = await r.json(); } catch (e) {}
  const signupFirst = beta.signup && new URLSearchParams(location.search).has("signup");
  const sso = on(async () => {
    const slug = val("ws").trim().toLowerCase();
    if (!slug) { toast("Enter your workspace name", true); return; }
    const r = await fetch(`/api/auth/workspace/${encodeURIComponent(slug)}`);
    if (!r.ok) { toast("No workspace by that name", true); return; }
    const w = await r.json();
    if (!w.sso) { toast(`${w.name} doesn't use company sign-in; use an access token`, true); return; }
    try { localStorage.setItem("fw_ws", slug); } catch (e) {}
    location.href = `/auth/sso/${encodeURIComponent(slug)}/start`;
  });
  const tok = on(() => signIn(val("tok")));
  const provBtns = mode => beta.providers.map(p => `<button class="btn ${mode === "signup" ? "primary" : ""}" data-on="${on(() => loginWith(p, mode))}">Continue with ${esc(PROVIDER_NAME[p] || p)}</button>`).join("");
  const startPanel = beta.signup && beta.providers.length ? `<div class="panel" style="${signupFirst ? "border-color:var(--accent)" : ""}">
      <div class="row nowrap" style="justify-content:space-between"><h2 style="margin:0">Start a workspace</h2><span class="chip accent">FREE BETA</span></div>
      <p class="small muted" style="margin:0">Your own workspace on the default template: stages, roles, delay ledger, capacity. Make it yours, then invite your team.</p>
      <label class="field"><span>Team or company name</span><input id="nw_name" placeholder="Acme Deployments" autocomplete="organization"></label>
      <div class="stack" style="gap:8px">${provBtns("signup")}</div>
      <p class="xs muted" style="margin:0">Beta: free while it lasts. Your data stays yours; we don't sell or share it. Feedback button on every screen.</p></div>` : "";
  $("#root").innerHTML = `<div class="signin">
    <div class="brand" style="padding:0">${logo(30)}<div><b>${esc(brand().product_name)}</b><small>For deployment teams</small></div></div>
    ${signupFirst ? startPanel : ""}
    <div class="panel">
      <h2>Sign in</h2>
      ${beta.providers.length ? `<div class="stack" style="gap:8px">${provBtns("signin")}</div><div class="xs muted" style="text-align:center">or with your company</div>` : ""}
      <label class="field"><span>Workspace</span><input id="ws" placeholder="your-company" autocomplete="organization" value="${esc(lastWorkspace())}" data-enter="${sso}"></label>
      <button class="btn primary" data-on="${sso}">Sign in with company SSO</button>
      <details><summary>Use an access token instead</summary>
        <div class="stack" style="margin-top:10px"><label class="field"><span>Access token</span><input id="tok" type="password" autocomplete="off" data-enter="${tok}"></label>
        <button class="btn" data-on="${tok}">Sign in with token</button></div></details>
    </div>
    ${signupFirst ? "" : startPanel}
    ${demos.length ? `<div class="panel"><div class="label">Demo workspace · Meridian AI's deployment team</div>
      <div class="stack" style="gap:6px">${demos.map(d => `<button class="btn" style="justify-content:flex-start;height:40px" data-on="${on(() => signIn(d.token))}">${esc(d.label)}</button>`).join("")}</div></div>` : ""}
    <div class="row muted small"><button class="btn sm ghost" data-on="${on(() => { setTheme(theme() === "dark" ? "light" : "dark"); })}">${sunIcon}${theme() === "dark" ? "Light mode" : "Dark mode"}</button><div class="spacer"></div><a href="/welcome">What is this?</a></div>
  </div>`;
}

/* ============================================================== routing */
function go(path) { if (location.hash === "#/" + path) route(); else location.hash = "#/" + path; }
window.addEventListener("hashchange", () => { if (S.me) route(); });
function kind() {
  if (!can("task.view_internal")) return "customer";
  if (scope("deployment.view") === "all" && can("pipeline.view") && scope("flag.handle") === "all") return "director";
  if (can("people.read")) return "manager";
  return "doer";
}
const KIND_CHIP = { director: ["DIRECTOR VIEW", "accent"], manager: ["MANAGER VIEW", "good"], doer: [null, "blue"], customer: ["CUSTOMER VIEW", "purple"] };
function viewChip() {
  const k = kind(); let [t, c] = KIND_CHIP[k];
  if (!t) { const n = S.me.user.role_name; t = (n.length > 14 ? n.split(/\s+/).map(w => w[0]).join("") : n).toUpperCase() + " VIEW"; }
  return `<span class="chip ${c}">${esc(t)}</span>`;
}

function globalNav() {
  const k = kind(), all = scope("deployment.view") === "all";
  const items = [
    ["home", "Home", { doer: "My work today", manager: "Your team", director: "Overview", customer: "Your deployment" }[k], true],
    ["chains", "Chains", all ? "Every deployment" : "Your deployments", can("deployment.view") && k !== "customer"],
    ["projects", "Projects", "Flags · roll-offs", scope("flag.handle") === "all"],
    ["pipeline", "Pipeline", "Staffing check", can("pipeline.view")],
    ["portfolio", "Portfolio", "Medians · delay owners", can("people.read")],
    ["delays", "Delay ledger", "Confirm the cause", can("delay.confirm")],
    ["team", "Team", "Capacity · hours", can("people.read")],
    ["work", "My work", "Tasks · time", can("task.create") && k !== "customer"],
    ["-"],
    ["integrations", "Integrations", "Sources and sync", can("integrations.manage")],
    ["import", "Import", "CSV in", can("deployment.create") || can("pipeline.edit") || can("people.read")],
    ["ai", "AI tools", "MCP · agents", k !== "customer"],
    ["audit", "Audit trail", "Hash-chained", can("audit.read")],
    ["ai_registry", "AI registry", "Models · deployment impact", can("ai.view")],
    ["onboarding", "Get started", "Set up your workspace", can("config.edit") && can("deployment.create")],
    ["settings", "Settings", "Your methodology", can("config.edit") || can("engine.manage")],
  ];
  let i = 0;
  const shown = items.filter(x => x[0] === "-" || x[3]);
  return shown.map((x, idx) => {
    if (x[0] === "-") return idx > 0 && idx < shown.length - 1 ? `<div class="navsep"></div>` : "";
    const n = String(i++).padStart(2, "0");
    const badge = x[0] === "delays" && S.cache.queueCount ? `<span class="dot">${S.cache.queueCount}</span>` : x[0] === "projects" && S.cache.flagCount ? `<span class="dot">${S.cache.flagCount}</span>` : `<span class="n">${n}</span>`;
    return `<button class="navitem ${S.route[0] === x[0] ? "on" : ""}" data-on="${on(() => go(x[0]))}"><span class="l"><span class="t">${esc(x[1])}</span><span class="s">${esc(x[2])}</span></span>${badge}</button>`;
  }).join("");
}

function depNav(d, page) {
  const internal = d.you_can.includes("task.view_internal");
  const back = `<button class="navitem back" data-on="${on(() => go(kind() === "customer" ? "home" : "chains"))}"><span class="l"><span class="t">← ${kind() === "customer" ? "Home" : "All deployments"}</span></span></button>`;
  const item = (key, label, src, n, extra = "") => `<button class="navitem ${page === key ? "on" : ""}" data-on="${on(() => go(`dep/${d.id}/${key}`))}"><span class="l"><span class="t">${esc(label)}${extra}</span><span class="s">${esc(src)}</span></span><span class="n">${n}</span></button>`;
  let h = back + item("overview", "Overview", internal ? "Tasks · team · plan" : "What's shared with you", "00");
  if (!internal) return h;
  if (d.you_can.includes("ai.view")) h += item("ai", "AI workflow", "Versions · Cortex · evals", "AI");
  const st = Object.fromEntries(((d._row || {}).stages || []).map(x => [x.key, x]));
  S.cfg.stages.forEach((s, i) => {
    const x = st[s.key] || {};
    const src = (s.engines || []).map(engName).join(" · ") || "No engine";
    const mark = x.state === "done" ? ` <span class="xs good">✓</span>` : x.state === "skipped" ? ` <span class="xs muted">· skipped</span>`
      : x.state === "hold" ? ` <span class="xs mono blue">· paused</span>` : x.status === "in_progress" ? ` <span class="xs mono ${x.overrun ? "bad" : "warn"}">· now</span>` : "";
    h += item(s.key, s.name, src, String(i + 1).padStart(2, "0"), mark);
  });
  if (d.you_can.includes("bench.match")) h += item("bench", "Bench", "Threshold", String(S.cfg.stages.length + 1).padStart(2, "0"));
  return h;
}

function userMenu() {
  const m = $("#menu"); if (m) { m.remove(); return; }
  const el = document.createElement("div"); el.className = "menu"; el.id = "menu";
  el.innerHTML = `<div class="mhead"><div style="color:var(--text);font-size:13px">${esc(S.me.user.name)}</div>${esc(S.me.user.role_name)} · ${esc(S.me.tenant.name)}<div class="mono xs" style="margin-top:4px">${esc(S.me.user.email)}</div></div>
    ${kind() !== "customer" ? `<button data-on="${on(() => go("ai"))}">AI tools and access tokens</button>` : ""}
    <button data-on="${on(signOut)}">Sign out</button>`;
  document.body.appendChild(el);
}

/* shell(): frame + nav + header; body is filled by the view */
function shell({ nav, ctx }) {
  const t = theme();
  $("#root").innerHTML = `<div class="shell">
    <nav class="side" aria-label="Main">
      <div class="brand">${logo()}<div><b>${esc(brand().product_name)}</b><small>${esc(S.me.tenant.name)}</small></div></div>
      <div class="navlist">${nav}</div>
      <div class="navfoot"><div class="label">Custody</div><div style="margin-top:6px">Every change is on a hash-chained audit trail. Engines run on what you give them; nothing leaves without a person confirming it.</div></div>
    </nav>
    <main class="main">
      <header class="top"><div class="ctx">${ctx}</div>
        <div class="me"><span id="live" class="livedot ${S.live ? "on" : ""}" title="Screens update as things change">LIVE</span><span class="who">${esc(S.me.user.name)} · ${esc(S.me.user.role_name)}</span>
          <button class="btn sm" data-on="${on(feedbackBox)}">Feedback</button>
          <button class="btn sm" aria-label="Switch between light and dark mode" data-on="${on(() => { setTheme(theme() === "dark" ? "light" : "dark"); route(); })}">${sunIcon}${t === "dark" ? "Light mode" : "Dark mode"}</button>
          <button class="avatar chip ${KIND_CHIP[kind()][1]}" id="avatar" aria-label="Account" data-on="${on(userMenu)}">${esc(initials(S.me.user.name))}</button></div>
      </header>
      <div class="scroll"><div class="page" id="page"><div class="muted">Loading…</div></div></div>
    </main></div>`;
}

async function route() {
  H = {}; hid = 0;
  const parts = (location.hash.replace(/^#\/?/, "") || "home").split("/");
  S.route = parts;
  const views = { home: homeView, chains: chainsView, projects: projectsView, pipeline: pipelineView, portfolio: portfolioView,
    delays: delaysView, team: teamView, work: workView, integrations: integrationsView, import: importView, ai: aiView,
    audit: auditView, settings: settingsView, onboarding: onboardingView, ai_registry: aiRegistryView, dep: depView };
  const fn = views[parts[0]] || homeView;
  await refreshBadges();
  if (fn !== depView) shell({ nav: globalNav(), ctx: viewChip() + `<span class="sub">${esc(S.me.tenant.name)}</span>` });
  try { await fn(...parts.slice(1)); }
  catch (e) { if (e.message !== "signed out") { const p = $("#page"); if (p) p.innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
}
function page(html) { const p = $("#page"); if (p) p.innerHTML = html; }
async function refreshBadges() {
  if (S.cache.badgesAt && Date.now() - S.cache.badgesAt < 20000) return;
  S.cache.badgesAt = Date.now();
  try {
    if (can("delay.confirm")) S.cache.queueCount = (await api("/api/delays/queue")).items.length;
    if (scope("flag.handle") === "all") S.cache.flagCount = (await api("/api/flags")).filter(f => f.status !== "owned").length;
  } catch (e) {}
}
const invalidate = () => { S.cache.badgesAt = 0; };

/* ======================================================= shared pieces */
const CELL_CLASS = { done: "done", progress: "progress", stalled: "stalled", pending: "", skipped: "skipped", hold: "hold" };
const CELL_WORD = { done: "done", progress: "in progress", stalled: "past target", pending: "not started", skipped: "skipped", hold: "on hold" };
function cells(list, sm) { return `<div class="cells ${sm ? "sm" : ""}" style="grid-template-columns:repeat(${list.length},minmax(0,1fr))">${list.map(c => `<div class="cell ${CELL_CLASS[c.state]}" title="${esc(c.name)} · ${esc(CELL_WORD[c.state] || c.state)}"></div>`).join("")}</div>`; }
const chainLegend = `<div class="legend"><span><i style="background:var(--good)"></i>done</span><span><i style="background:var(--warn)"></i>in progress</span><span><i style="background:var(--bad)"></i>past target</span><span><i style="background:var(--blue)"></i>on hold</span><span><i style="border:1px dashed var(--line4)"></i>skipped</span><span><i style="background:var(--pending)"></i>not started</span></div>`;
const STATUS = { on_hold: ["on hold", "var(--blue)"], on_track: ["on track", "var(--good)"], at_risk: ["at risk", "var(--warn)"], off_track: ["off track", "var(--bad)"], blocked: ["blocked", "var(--bad)"] };
const statusDot = s => { const [l, c] = STATUS[s] || [s, "var(--muted)"]; return `<span class="status"><span class="sdot" style="background:${c}"></span>${esc(l)}</span>`; };
const sevChip = s => `<span class="chip ${s === "high" ? "bad" : s === "med" ? "warn" : ""}">${esc(upper(s === "med" ? "medium" : s))}</span>`;
const stageChip = (row) => `<span class="chip ${row.overrun ? "bad" : "warn"}">${esc(upper(row.stage_name || stageName(row.stage)))}</span>`;
const kpi = (label, v, d, cls = "", vcls = "") => `<div class="kpi ${cls}"><div class="label">${esc(label)}</div><div class="v ${vcls}">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
const OWNER_CLASS = { customer: "blue", team: "warn", model_vendor: "purple", software_vendor: "purple" };
function bar(frac, color, cls = "") { const w = Math.max(0, Math.min(100, Math.round((frac || 0) * 100))); return `<div class="track ${cls}"><div class="fill" style="width:${w}%;background:${color}"></div></div>`; }
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function dayChip() { const d = new Date(); return `<span class="mono small muted">${upper(DOW[d.getDay()])} · ${upper(MON[d.getMonth()])} ${d.getDate()}</span>`; }

/* One task line: checkbox, title, deployment, stage, due, status */
function taskRow(t, { showDep = true, reload, updateAny = false, showShared = true, links = null } = {}) {
  const editable = t.assignee_id === S.me.user.id || updateAny;
  const done = t.status === "done";
  const due = t.due ? daysFrom(t.due) : null;
  const dueCls = due != null && due < 0 && !done ? "bad" : due != null && due <= 2 && !done ? "warn" : "";
  const toggle = on(async () => { await api(`/api/tasks/${t.id}`, { method: "PATCH", body: { status: done ? "open" : "done" } }); invalidate(); reload(); });
  const setStatus = on(async el => { await api(`/api/tasks/${t.id}`, { method: "PATCH", body: { status: el.value } }); invalidate(); toast(el.value === "blocked" ? "Marked blocked. Say who it's waiting on if you know; work carries on either way." : el.value === "done" ? "Done ✓" : "Task updated"); reload(); });
  const link = links && links[t.id];
  const WHO = { customer: "Customer", team: S.me.tenant.name, model_vendor: "Model vendor", software_vendor: "Software vendor" };
  const waiting = t.status === "blocked" && can("task.view_internal") ? (t.waiting_on
    ? `<div class="waiting">Waiting on <b style="color:var(--text)">${esc(WHO[t.waiting_on] || t.waiting_on)}</b>${t.blocked_reason ? ` · ${esc(t.blocked_reason)}` : ""}${editable ? ` <button class="linkbtn xs" data-on="${on(async () => { await api(`/api/tasks/${t.id}`, { method: "PATCH", body: { waiting_on: "" } }); reload(); })}">change</button>` : ""}</div>`
    : editable ? `<div class="waiting">Waiting on? ${Object.entries(WHO).map(([k, l]) => `<button class="chipbtn" data-on="${on(async () => { await api(`/api/tasks/${t.id}`, { method: "PATCH", body: { waiting_on: k } }); toast(`Noted: waiting on ${l}`); reload(); })}">${esc(l)}</button>`).join("")}<span class="xs">optional</span></div>` : "") : "";
  return `<div class="task">
    <button class="box ${done ? "on" : t.status === "blocked" ? "blocked" : ""}" ${editable ? `data-on="${toggle}"` : "disabled"} aria-label="${done ? "Reopen" : "Mark done"}: ${esc(t.title)}">${done ? "✓" : t.status === "blocked" ? "!" : ""}</button>
    <div class="ttl ${done ? "done" : ""}">${esc(t.title)}
      ${showDep ? `<div class="small muted"><a href="#/dep/${esc(t.deployment_id)}">${esc(t.deployment)}</a></div>` : ""}</div>
    <div class="meta">
      ${showShared && t.visibility === "shared" && can("task.view_internal") ? `<span class="chip purple">shared</span>` : ""}
      ${link ? `<a class="chip line" href="${esc(link.url)}" target="_blank" rel="noopener">↗ ${esc(link.provider)}</a>` : ""}
      ${!showDep || t.assignee_id !== S.me.user.id ? `<span>${esc(t.assignee || "unassigned")}</span>` : ""}
      <span class="mono xs">${esc(upper(stageName(t.stage)))}</span>
      ${t.due ? `<span class="mono xs ${dueCls}">${fmtDate(t.due)}</span>` : ""}
      ${editable && !done ? `<select data-chg="${setStatus}" aria-label="Status of ${esc(t.title)}">${["open", "in_progress", "blocked", "done"].map(s => `<option value="${s}" ${s === t.status ? "selected" : ""}>${s.replace("_", " ")}</option>`).join("")}</select>` : done ? "" : `<span class="chip">${esc(t.status.replace("_", " "))}</span>`}
    </div>${waiting}</div>`;
}

/* ============================================================ home */
const WSPAN = { kpis: 12, chain: 12, clients: 12, pipeline: 12, today: 7, my_tasks: 7, hours: 5, flags: 5, capacity: 7, unassigned: 5, delays: 5, approvals: 5, findings: 7, team: 7 };

async function homeView() {
  const widgets = S.me.home || [];
  const memo = {};
  const get = (k, f) => memo[k] || (memo[k] = f());
  const F = {
    portfolio: () => get("portfolio", () => api("/api/portfolio")),
    today: () => get("today", () => api("/api/today")),
    mine: () => get("mine", () => api("/api/tasks?mine=true")),
    week: () => get("week", () => api("/api/me/week")),
    flags: () => get("flags", () => api("/api/flags")),
    team: () => get("team", () => api("/api/team")),
    pipeline: () => get("pipeline", () => api("/api/pipeline")),
    rollup: () => get("rollup", () => api("/api/delays/rollup")),
    approvals: () => get("approvals", () => api("/api/approvals")),
    dashboard: () => get("dashboard", () => api("/api/dashboard")),
    blockedOnCustomer: () => get("boc", () => api("/api/delays?status=open")),
  };
  const reload = () => route();
  const k = kind();
  const rendered = [];
  for (const w of widgets) {
    const fn = WIDGETS[w]; if (!fn) continue;
    try { const html = await fn(F, reload); if (html) rendered.push([w, html]); }
    catch (e) { if (e.message === "signed out") return; }
  }
  // Mockup layout: full-width rows, and between them a band with a main column and a side column.
  const out = []; let band = [];
  const flush = () => {
    if (!band.length) return;
    const main = band.filter(([w]) => WSPAN[w] !== 5), side = band.filter(([w]) => WSPAN[w] === 5);
    if (main.length && side.length) out.push(`<div class="band"><div class="stack lg">${main.map(x => x[1]).join("")}</div><div class="stack lg">${side.map(x => x[1]).join("")}</div></div>`);
    else out.push(`<div class="${band.length > 1 ? "band" : ""}">${band.map(x => `<div class="stack lg">${x[1]}</div>`).join("")}</div>`);
    band = [];
  };
  for (const r of rendered) { if ((WSPAN[r[0]] || 12) === 12) { flush(); out.push(r[1]); } else band.push(r); }
  flush();
  // Headline
  let title, sub;
  const first = S.me.user.name.split(" ")[0];
  if (k === "doer") {
    const [p, mine, boc] = await Promise.all([F.portfolio(), F.mine(), F.blockedOnCustomer()]);
    const open = mine.filter(t => t.status !== "done").length;
    const cust = boc.filter(x => x.owner === "customer").length;
    title = `${greeting()}, ${first}`;
    sub = `${plural(p.deployments.length, "deployment")} · ${plural(open, "task")} open${cust ? ` · ${cust} blocked on a customer` : ""}`;
  } else if (k === "manager") {
    const [p, t] = await Promise.all([F.portfolio(), can("people.read") ? F.team() : null]);
    title = `${greeting()}, ${first}`;
    sub = `${t ? plural(t.people.length, "person", "people") + " with hours · " : ""}${plural(p.deployments.length, "deployment")}${t ? ` · ${plural(t.unassigned.length, "item")} waiting for an owner` : ""}`;
  } else if (k === "director") {
    const [p, fl] = await Promise.all([F.portfolio(), F.flags()]);
    const ending = p.deployments.filter(d => d.days_left != null && d.days_left >= 0 && d.days_left <= 30).length;
    title = `${greeting()}, ${first}`;
    sub = `${plural(p.kpis ? p.kpis.active_deployments : p.deployments.length, "active deployment")} · ${plural(fl.length, "open flag")} · ${ending} ending in the next 30 days`;
  } else {
    title = `${greeting()}, ${first}`;
    sub = `What ${esc(S.me.tenant.name)} has shared with you`;
  }
  const pf = can("deployment.view") ? await F.portfolio() : { deployments: [] };
  page(`<div class="headrow"><div><h1>${esc(title)}</h1><p class="lede">${sub}</p></div>${dayChip()}</div>
    ${await gettingStarted(pf)}
    ${out.length ? out.join("") : `<div class="empty">Your home screen has no sections. A workspace admin can add them in Settings → Home screens.</div>`}`);
}

/* Self-service setup; source data remains editable until activation. */
async function onboardingView() {
  const available = await api('/api/onboarding');
  let draft = null;
  const fields = ['customer', 'deployment', 'stage', 'health'];
  const activate = on(async el => {
    if (!draft || !val('setup_reviewed')) return toast('Review and confirm the preview first.', true);
    el.disabled = true;
    try {
      const result = await api(`/api/onboarding/${encodeURIComponent(draft.id)}/activate`, {method:'POST', body:{reviewed:true}});
      await loadConfig(); S.cache = {}; draft = null;
      toast(`${plural(result.created, 'deployment')} ready. Invite your team whenever you like.`);
      go('chains');
    } catch (e) { toast(e.message, true); el.disabled = false; }
  });
  const review = on(() => { const button = $('#setup_apply'); if(button) button.disabled = !val('setup_reviewed'); });
  const preview = on(async el => {
    el.disabled = true; el.textContent = 'Preparing your workspace…';
    draft = null; $('#setup_preview').textContent = '';
    try {
      const result = await api('/api/onboarding/preview', {method:'POST', body:{
        description:val('setup_description'), csv_text:val('setup_csv'), use_ai:!!val('setup_ai')
      }});
      draft = result.id ? result : null;
      const list = (title, items) => items.length ? `<div class="panel"><h3>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
      $('#setup_preview').innerHTML = `<div class="panel"><div class="label">2 · Review your setup</div>
        <h2>${result.mode === 'ai' ? 'AI suggested setup' : 'Guided setup'}</h2>
        <p>Review the stages, column mapping and deployments below. Nothing changes until you apply this preview.</p>
        <p><b>Stages:</b> ${result.stages.map(s=>esc(s.name)).join(' → ')}</p>
        <p><b>Spreadsheet mapping:</b> ${fields.map(f=>`${esc(f)} ← ${esc(result.mapping[f] || 'not mapped')}`).join(' · ')}</p>
        <p><b>${plural(result.deployments.length,'deployment')}</b> ready to import. You will be their initial lead.</p>
        ${result.deployments.length ? `<div style="overflow:auto"><table><thead><tr><th>Customer</th><th>Deployment</th><th>Stage</th><th>Health</th></tr></thead><tbody>${result.deployments.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.name)}</td><td>${esc(result.stages.find(s=>s.key===x.stage)?.name || x.stage)}</td><td>${esc(x.health)}</td></tr>`).join('')}</tbody></table></div>` : '<p>You can add your first deployment later.</p>'}
        </div>${list('Correct these items and preview again',result.errors)}${list('Check these defaults',result.warnings)}${list('Questions to consider before applying',result.questions)}
        ${draft ? `<div class="panel"><label><input id="setup_reviewed" type="checkbox" data-chg="${review}"> I reviewed the stage labels, mapped columns and all deployments.</label>
        <button id="setup_apply" class="btn primary" disabled data-on="${activate}">Apply setup and open Fieldwork</button><p class="small muted">This preview expires in 30 minutes. Existing deployments, access rules and tool connections are preserved.</p></div>` : ''}`;
    } catch(e) { $('#setup_preview').textContent=e.message; }
    finally { el.disabled=false; el.textContent='Preview my setup'; }
  });
  const invalidate = () => { draft=null; $('#setup_preview').textContent='Your inputs changed. Generate a fresh preview.'; };
  const changed = on(invalidate);
  const upload = on(async el => {
    const file=el.files?.[0]; if(!file)return;
    if(file.size>100000)return toast('Use a CSV under 100 KB.',true);
    $('#setup_csv').value=await file.text(); invalidate();
  });
  page(`<div class="headrow"><div><h1>Make Fieldwork yours</h1><p class="lede">A few inputs. A clear preview. Your team can start working.</p></div></div>
    <div class="panel"><div class="label">1 · Tell us how your team delivers</div>
    <label for="setup_description">What do you deploy, and what stages do you follow?</label>
    <textarea id="setup_description" maxlength="4000" rows="4" data-chg="${changed}" placeholder="We deploy healthcare AI. We work through discovery, integration, testing, go-live, adoption and value measurement."></textarea>
    <label for="setup_csv">Bring your active deployments (optional)</label>
    <p class="small muted">Upload or paste a CSV. Customer and Deployment are required. Stage and Health are optional. Up to 200 deployments.</p>
    <input type="file" accept=".csv,text/csv" aria-label="Upload deployment CSV" data-chg="${upload}">
    <textarea id="setup_csv" rows="7" maxlength="100000" data-chg="${changed}" placeholder="Customer,Deployment,Stage,Health&#10;Acme,Voice agent rollout,Discover,On track"></textarea>
    <p class="small muted">Unknown stages and invalid rows will get correction instructions before anything is imported. Additional columns are listed in the preview.</p>
    ${available.ai_available ? `<label><input id="setup_ai" type="checkbox" data-chg="${changed}"> Use AI to suggest stage names and match columns. My description and column headings may be sent to the AI provider; spreadsheet rows stay in Fieldwork.</label>` : '<p class="small muted">Guided setup is available. AI suggestions are currently unavailable.</p>'}
    <button class="btn primary" data-on="${preview}">Preview my setup</button></div><div id="setup_preview" aria-live="polite"></div>`);
}

async function gettingStarted(pf) {
  if (!can("deployment.create") && !can("config.edit")) return "";
  const done = { dep: pf.deployments.length > 0 };
  if (!S.welcome && done.dep) return "";
  let people = [], cat = null;
  try { people = can("people.read") ? await api("/api/people").then(r => r.filter(x => x.active !== 0)) : []; } catch (e) {}
  try { cat = can("integrations.manage") ? await api("/api/connections") : null; } catch (e) {}
  done.team = people.length > 1;
  done.tools = !!cat && cat.providers.some(p => !p.personal && p.connections.some(c => c.status === "active"));
  const step = (ok, t, d, btn) => `<div class="row nowrap" style="gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start"><span class="mono ${ok ? "good" : "muted"}" style="width:18px">${ok ? "✓" : "○"}</span><div style="flex:1"><div style="font-weight:500">${esc(t)}</div><div class="small muted">${esc(d)}</div></div>${ok ? "" : btn}</div>`;
  const hide = on(() => { S.welcome = false; route(); });
  return `<div class="panel" style="gap:4px;border-color:var(--accent)"><div class="phead"><div class="label">Getting started · ${esc(S.me.tenant.name)}</div>${done.dep ? `<button class="btn xs ghost" data-on="${hide}">Hide</button>` : ""}</div>
    ${can("config.edit") && can("deployment.create") ? step(false, "Let Fieldwork help you set up", "Describe your delivery process, import active deployments and review your setup.", `<button class="btn sm primary" data-on="${on(() => go("onboarding"))}">Get started</button>`) : ""}
    ${step(done.dep, "Open your first deployment", "A customer and what you're deploying for them. Stages, clocks and the delay ledger start here.", `<button class="btn sm primary" data-on="${on(() => go("chains"))}">Open one</button>`)}
    ${can("people.manage") ? step(done.team, "Invite your team", "Add people with the email they'll sign in with, and pick their role.", `<button class="btn sm" data-on="${on(() => go("team"))}">Invite</button>`) : ""}
    ${cat ? step(done.tools, "Connect Slack and your tracker", "Alerts with buttons, and tasks that sync both ways with GitHub, Linear or Jira.", `<button class="btn sm" data-on="${on(() => go("integrations"))}">Connect</button>`) : ""}
    ${can("config.edit") ? step(false, "Make it yours", "Your stages, roles, what each role sees, your name and colors. Optional; the defaults work.", `<button class="btn sm ghost" data-on="${on(() => go("settings"))}">Settings</button>`) : ""}
  </div>`;
}

function feedbackBox() {
  const ex = $("#fbbox"); if (ex) { ex.remove(); return; }
  const el = document.createElement("div"); el.className = "menu"; el.id = "fbbox"; el.style.cssText = "width:min(360px,calc(100vw - 32px));padding:14px;right:16px;top:60px";
  const send = on(async () => { const t = ($("#fb_t").value || "").trim(); if (!t) return; await api("/api/feedback", { method: "POST", body: { text: t, page: location.hash.slice(1) || "/" } }); el.remove(); toast("Thanks. It went straight to the team building this."); });
  el.innerHTML = `<div class="stack" style="gap:8px"><b>What's working, what isn't?</b><textarea id="fb_t" rows="5" placeholder="Anything: a bug, a missing piece, how your team works." style="width:100%;box-sizing:border-box"></textarea><div class="row"><button class="btn primary sm" data-on="${send}">Send</button><button class="btn sm ghost" data-on="${on(() => el.remove())}">Cancel</button><span class="xs muted">It includes which screen you're on.</span></div></div>`;
  document.body.appendChild(el); $("#fb_t").focus();
}

const WIDGETS = {
  async kpis(F) {
    const p = await F.portfolio(); const k = p.kpis; if (!k) return "";
    const stalled = p.deployments.filter(d => d.overrun).length;
    const stalledCust = p.deployments.filter(d => d.overrun && d.delay && d.delay.owner === "customer").length;
    const roll = p.delays || {};
    return `<div class="grid g4">
      ${kpi("Active deployments", k.active_deployments, `${k.off_track} off track · ${k.at_risk} at risk${k.on_hold ? ` · ${k.on_hold} on hold` : ""}`)}
      ${kpi(`Median days to ${stageName(k.live_stage || "").toLowerCase()}`, k.median_days_to_live ?? "—", k.days_to_live_target ? `target ${k.days_to_live_target}, from your stage targets` : "")}
      ${kpi("Stalled past target", stalled, stalled ? (stalledCust ? `${stalledCust} waiting on the customer` : "none waiting on the customer") : "every stage within target", stalled ? "alert" : "", stalled ? "bad" : "")}
      ${kpi("Confirmed delay rows", roll.confirmed_rows ?? 0, roll.unconfirmed_rows ? `${roll.unconfirmed_rows} waiting for someone to confirm` : "the ledger that compounds")}
    </div>`;
  },
  async chain(F) { const p = await F.portfolio(); return chainTable(p, 8); },
  async clients(F) {
    const p = await F.portfolio();
    if (!p.deployments.length) return `<div class="empty">You're not on any deployments yet.</div>`;
    const mine = p.deployments.slice(0, 6);
    return `<div class="grid ${mine.length > 1 ? "g2" : ""}">${mine.map(d => {
      const internal = d.status !== undefined;
      const next = d.next_milestone ? `${d.next_milestone.label}${d.next_milestone.on ? " · " + fmtDate(d.next_milestone.on) : ""}` : "—";
      return `<div class="panel" style="cursor:pointer" data-on="${on(() => go("dep/" + d.id))}">
        <div class="phead"><div><div style="font-size:16px;font-weight:600">${esc(d.customer)}</div><div class="small muted">${esc(d.name)}</div></div>${stageChip(d)}</div>
        ${cells(d.cells, true)}
        <div class="grid g3" style="gap:10px;font-size:12.5px">
          <div><div class="label" style="font-size:10px">Next milestone</div><div style="margin-top:3px">${esc(next)}</div></div>
          <div><div class="label" style="font-size:10px">${internal ? "Customer contact" : "Days in stage"}</div><div style="margin-top:3px">${internal ? esc(d.contact || "—") : d.days_in_stage + " d"}</div></div>
          <div><div class="label" style="font-size:10px">${internal ? "Delay owner" : "Status"}</div><div style="margin-top:3px">${internal ? (d.delay ? `<span class="${OWNER_CLASS[d.delay.owner]}">${esc(d.delay.label)}</span> · ${d.delay.days} d` : `<span class="muted">none open</span>`) : esc((STATUS[d.health] || [d.health])[0])}</div></div>
        </div></div>`;
    }).join("")}</div>`;
  },
  async today(F) {
    const t = await F.today();
    const row = (title, sub, dep, right) => `<div class="task" style="grid-template-columns:minmax(0,1fr) auto"><div class="ttl">${dep ? `<a href="#/dep/${esc(dep)}">${esc(title)}</a>` : esc(title)}<div class="small muted">${esc(sub)}</div></div><div class="meta">${right || ""}</div></div>`;
    const blocks = [];
    if (t.confirm.length) blocks.push(`<div class="label" style="margin-top:4px">Waiting for your confirmation</div>${t.confirm.slice(0, 5).map(x => row(x.title, x.deployment, x.deployment_id, `<span class="chip purple">${esc(engName(x.engine))}</span>`)).join("")}`);
    const dup = (S.me.home || []).includes("my_tasks");  // don't repeat what My tasks already shows
    if (t.due.length && !dup) blocks.push(`<div class="label" style="margin-top:4px">Due soon${t.overdue ? ` · <span class="bad">${t.overdue} overdue</span>` : ""}</div>${t.due.slice(0, 5).map(x => row(x.title, x.deployment, x.deployment_id, `<span class="mono xs">${fmtDate(x.due)}</span>`)).join("")}`);
    if (t.new.length && !dup) blocks.push(`<div class="label" style="margin-top:4px">New for you</div>${t.new.slice(0, 4).map(x => row(x.title, x.deployment, x.deployment_id)).join("")}`);
    if (t.moved.length) blocks.push(`<div class="label" style="margin-top:4px">Moved in the last two days</div>${t.moved.slice(0, 4).map(x => row(`${x.deployment} → ${stageName(x.to_stage)}`, x.actor, x.deployment_id)).join("")}`);
    if (!blocks.length) return "";
    return `<div class="panel"><div class="label">Today</div>${blocks.join("")}</div>`;
  },
  async my_tasks(F, reload) {
    const t = (await F.mine()).filter(x => x.status !== "done" || (x.updated_at || "").slice(0, 10) === todayIso());
    return `<div class="panel" style="gap:4px"><div class="phead" style="margin-bottom:6px"><div class="label">My tasks${t.length ? ` · ${t.filter(x => x.status !== "done").length} open` : ""}</div>${can("task.create") ? `<a class="small" href="#/work">All my work →</a>` : ""}</div>
      ${t.length ? t.slice(0, 9).map(x => taskRow(x, { reload })).join("") : `<div class="empty">Nothing on your plate.</div>`}</div>`;
  },
  async hours(F) {
    const [w, boc] = await Promise.all([F.week(), F.blockedOnCustomer()]);
    const cust = boc.filter(x => x.owner === "customer").sort((a, b) => b.days - a.days)[0];
    const esc_ = cust ? on(async () => {
      await api(`/api/deployments/${cust.deployment_id}/flags`, { method: "POST", body: { text: `Blocked on the customer ${cust.days} days: ${cust.proposed_reason}${cust.evidence ? " (" + cust.evidence + ")" : ""}`, severity: cust.days > 7 ? "high" : "med" } });
      invalidate(); toast("Escalated. Your lead sees it as a flag.");
    }) : null;
    return `<div class="stack lg">
      ${cust ? `<div class="panel alert" style="gap:8px"><div class="label bad">Blocked on customer · ${plural(Math.round(cust.days), "day")}</div>
        <div style="font-size:13.5px;line-height:1.45">${esc(cust.evidence || cust.proposed_reason)}</div>
        <div class="small muted">${esc(cust.deployment)} · ${esc(cust.signal_label)}${cust.status === "open" ? " · owner not confirmed yet" : ""}</div>
        <div class="row" style="margin-top:4px"><a class="btn primary" href="#/dep/${esc(cust.deployment_id)}">Open deployment</a>${can("deployment.edit") ? `<button class="btn" data-on="${esc_}">Escalate to lead</button>` : ""}</div></div>` : ""}
      <div class="panel" style="flex-direction:row;justify-content:space-between;align-items:flex-start">
        <div><div class="label">This week</div><div style="font-size:26px;font-weight:600;margin-top:4px">${num(w.logged)} h</div>
          <div class="small muted">${w.planned ? `planned ${num(w.planned)} of ${num(w.available)} h` : `${num(w.available)} h available`}</div>
        ${logTodayBtn(w)}</div>
        <div style="text-align:right;font-size:12.5px;color:var(--muted);line-height:1.7">${w.by_deployment.length ? w.by_deployment.map(x => `${esc((x.deployment || "Internal").split(" ").slice(0, 3).join(" "))} ${num(x.hours)} h`).join("<br>") : "No time logged yet"}<br><a href="#/work">Log time →</a></div></div>
    </div>`;
  },
  async flags(F, reload) { const f = await F.flags(); return flagsPanel(f.slice(0, 4), reload, f.length > 4); },
  async capacity(F) { const t = await F.team(); return capacityPanel(t); },
  async unassigned(F, reload) { const t = await F.team(); return unassignedPanel(t, reload); },
  async pipeline(F) {
    const p = await F.pipeline();
    const deals = p.columns.flatMap(c => c.deals).sort((a, b) => b.probability - a.probability).slice(0, 5);
    return `<div class="panel"><div class="phead"><div class="label">Pipeline · ${money(p.total)} · weighted ${money(p.weighted)}</div><a class="small" href="#/pipeline">Board →</a></div>
      <table class="tbl compact inpanel"><thead><tr><th>Deal</th><th>Stage</th><th>Value</th><th>Start</th><th>Staffing</th></tr></thead><tbody>
      ${deals.map(d => `<tr><td><div class="nm">${esc(d.name)}</div><div class="sm">${esc(d.use_case)}</div></td><td class="mono small">${esc(upper(d.stage_label))}</td><td class="mono">${money(d.value)}</td><td class="mono small muted">${fmtDate(d.expected_start)}</td><td>${staffingLabel(d.staffing)}</td></tr>`).join("")}</tbody></table>
      ${p.collisions.length ? `<div class="small"><span class="label accent">Capacity check</span> ${esc(collisionText(p))}</div>` : ""}</div>`;
  },
  async delays(F) { const r = await F.rollup(); return ownersPanel(r); },
  async approvals(F, reload) { const a = await F.approvals(); if (!a.length && kind() !== "manager") return ""; return approvalsPanel(a, reload); },
  async findings(F) {
    const d = await F.dashboard(); const f = d.findings || [];
    return `<div class="panel"><div class="label">Findings waiting for confirmation</div>
      ${f.length ? `<table class="tbl compact inpanel"><tbody>${f.map(x => `<tr class="click" data-on="${on(() => go("dep/" + x.deployment_id + "/" + stageForEngine(x.engine)))}"><td><div class="nm">${esc(x.title)}</div><div class="sm">${esc(x.deployment)}</div></td><td><span class="chip purple">${esc(engName(x.engine))}</span></td><td class="mono small muted">${fmtDate(x.created_at)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Nothing waiting.</div>`}</div>`;
  },
  async team(F) {
    const d = await F.dashboard(); const t = d.team || [];
    return `<div class="panel"><div class="label">Team load</div><table class="tbl compact inpanel"><thead><tr><th>Person</th><th>Role</th><th>Deployments</th><th>Open tasks</th></tr></thead><tbody>
      ${t.map(p => `<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.role_name)}</td><td class="mono">${p.deployments}</td><td class="mono">${p.open_tasks}</td></tr>`).join("")}</tbody></table></div>`;
  },
};
function logTodayBtn(w) {
  const t = w.today || {};
  if (t.logged) return `<div class="small good" style="margin-top:8px">✓ ${num(t.logged)} h logged today</div>`;
  if (!t.planned) return "";
  const go_ = on(async () => { const r = await api("/api/time/today", { method: "POST" }); toast(r.hours ? `Logged ${num(r.hours)} h across ${plural(r.logged.length, "deployment")}` : "Already logged"); route(); });
  return `<button class="btn primary sm" style="margin-top:10px" data-on="${go_}">Log today · ${num(t.planned)} h as planned</button>`;
}
function stageForEngine(e) { const s = S.cfg.stages.find(s => (s.engines || []).includes(e)); return s ? s.key : e === "threshold" ? "bench" : "overview"; }
</script>
<script>
"use strict";
/* ============================================================ chains */
function chainTable(p, limit) {
  const internal = p.deployments.some(d => d.status !== undefined);
  const rows = limit ? p.deployments.slice(0, limit) : p.deployments;
  const head = p.stages.map(s => upper(s.name)).join(" → ");
  return `<div class="panel flush"><div class="tblwrap"><table class="tbl"><thead><tr><th style="width:26%">Customer · use case</th><th>${esc(head)}</th>${internal ? "<th>Delay owner</th>" : ""}<th style="text-align:right">Days in stage</th></tr></thead><tbody>
    ${rows.map(d => `<tr class="click" data-on="${on(() => go("dep/" + d.id))}">
      <td><div class="nm" style="font-size:14px">${esc(d.customer)}</div><div class="sm">${esc(d.name)}</div></td>
      <td style="min-width:220px">${cells(d.cells)}</td>
      ${internal ? `<td style="font-size:12.5px">${d.delay ? `<span class="${OWNER_CLASS[d.delay.owner]}">${esc(d.delay.label)}</span> · <span class="text2">${esc(d.delay.reason)}</span>${d.delay.confirmed ? "" : ` <span class="muted xs">(proposed)</span>`}` : `<span class="muted">—</span>`}</td>` : ""}
      <td class="mono" style="text-align:right;font-size:13px;color:${d.overrun ? "var(--bad)" : "var(--text)"}">${d.days_in_stage} d${d.target_days ? `<span class="muted xs"> / ${d.target_days}</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="4"><div class="empty">No deployments yet.</div></td></tr>`}
    </tbody></table></div>
    <div class="tfoot">${chainLegend}${limit && p.deployments.length > limit ? `<div class="spacer"></div><a class="small" href="#/chains">All ${p.deployments.length} →</a>` : ""}</div></div>`;
}

async function chainsView() {
  const p = await api("/api/portfolio");
  const all = scope("deployment.view") === "all";
  const newDep = can("deployment.create") ? on(() => newDeploymentForm()) : null;
  page(`<div class="headrow"><div><h1>Deployment chains</h1>
      <p class="lede">Every customer deployment runs the same ${S.cfg.stages.length}-stage chain. Nobody owns the whole chain, so ${esc(brand().product_name)} does.</p></div>
      ${newDep ? `<button class="btn primary" data-on="${newDep}">New deployment</button>` : ""}</div>
    <div id="newdep"></div>
    ${await WIDGETS.kpis({ portfolio: async () => p })}
    ${chainTable(p)}
    ${!all ? `<p class="small muted">Showing the deployments you're staffed on.</p>` : ""}`);
}

async function newDeploymentForm() {
  const [customers, people] = await Promise.all([api("/api/customers"), can("people.read") ? api("/api/people").then(r => r.filter(x => x.active !== 0)) : []]);
  const create = on(async () => {
    let cid = val("nd_c");
    if (cid === "__new") {
      if (!val("nd_cn").trim()) { toast("Name the customer", true); return; }
      cid = (await api("/api/customers", { method: "POST", body: { name: val("nd_cn").trim() } })).id;
    }
    const r = await api("/api/deployments", { method: "POST", body: { customer_id: cid, name: val("nd_n"), lead_id: val("nd_l") || null, fields: readFields("deployment") } });
    toast("Deployment opened"); go("dep/" + r.id);
  });
  const toggle = on(el => { $("#nd_cn_l").style.display = el.value === "__new" ? "" : "none"; });
  $("#newdep").innerHTML = `<div class="panel"><div class="label">New deployment</div><div class="formgrid">
    <label class="field"><span>Customer</span><select id="nd_c" data-chg="${toggle}">${customers.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}<option value="__new">+ New customer…</option></select></label>
    <label class="field" id="nd_cn_l" style="display:${customers.length ? "none" : ""}"><span>New customer name</span><input id="nd_cn"></label>
    <label class="field"><span>Use case</span><input id="nd_n" placeholder="e.g. Invoice exception agent"></label>
    <label class="field"><span>Lead</span><select id="nd_l"><option value="">—</option>${people.filter(p => p.role !== "customer").map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.role_name)}</option>`).join("")}</select></label>
    ${fieldInputs("deployment", {})}
    <div><button class="btn primary" data-on="${create}">Open deployment</button></div></div></div>`;
  if (!customers.length) $("#nd_c").value = "__new";
}

function fieldInputs(scope_, values, disabled) {
  return S.cfg.fields[scope_].map(f => {
    const v = values[f.key] ?? ""; const id = `fld_${scope_}_${f.key}`; const dis = disabled ? "disabled" : "";
    let input;
    if (f.type === "select") input = `<select id="${id}" ${dis}><option value=""></option>${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.type === "bool") input = `<input id="${id}" type="checkbox" ${v ? "checked" : ""} ${dis}>`;
    else input = `<input id="${id}" ${dis} type="${f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}" value="${esc(v)}">`;
    return `<label class="field"><span>${esc(f.label)}</span>${input}</label>`;
  }).join("");
}
function readFields(scope_) {
  const out = {};
  S.cfg.fields[scope_].forEach(f => { const el = document.getElementById(`fld_${scope_}_${f.key}`); if (el) out[f.key] = f.type === "bool" ? el.checked : el.value; });
  return out;
}

/* ============================================================ flags */
function flagsPanel(flags, reload, more, hideDep) {
  const card = f => {
    const meta = `${f.raised_by_name} · ${f.age_days < 1 ? "today" : plural(Math.round(f.age_days), "day") + " ago"}${f.status === "owned" ? ` · taken by ${f.handled_by_name}` : ""}`;
    const take = on(async () => { await api(`/api/flags/${f.id}/take`, { method: "POST", body: {} }); invalidate(); toast("It's yours. The team lead can see you took it."); reload(); });
    const back = on(async () => {
      const box = document.getElementById("fb_" + f.id);
      if (box.style.display === "none") { box.style.display = ""; box.querySelector("input").focus(); return; }
      await api(`/api/flags/${f.id}/return`, { method: "POST", body: { note: box.querySelector("input").value } }); invalidate(); toast("Back with the team lead"); reload();
    });
    const resolve = on(async () => { await api(`/api/flags/${f.id}/resolve`, { method: "POST", body: { note: "" } }); invalidate(); toast("Resolved"); reload(); });
    return `<div class="sub-card">
      <div class="row nowrap">${sevChip(f.severity)}${hideDep ? "" : `<a href="#/dep/${esc(f.deployment_id)}" style="font-size:13px;font-weight:500;color:var(--text)">${esc(f.deployment)}</a>`}${f.rule_key ? `<span class="chip line xs">rule</span>` : ""}</div>
      <div style="font-size:12.5px;color:var(--text2);line-height:1.45">${esc(f.text)}</div>
      <div class="mono xs muted">${esc(meta)}</div>
      ${f.status === "returned" && f.note ? `<div class="small"><span class="label">Back to team lead</span> <span class="text2">${esc(f.note)}</span></div>` : ""}
      ${f.you_can_handle ? `<div class="row" style="gap:8px">
        ${f.status !== "owned" && scope("flag.handle") === "all" ? `<button class="btn primary sm" data-on="${take}">I'll take it</button>` : ""}
        ${f.status !== "returned" && scope("flag.handle") === "all" ? `<button class="btn sm" data-on="${back}">Back to team lead</button>` : ""}
        <button class="btn sm ghost" data-on="${resolve}">Resolve</button></div>
        <div id="fb_${esc(f.id)}" style="display:none" class="row nowrap"><input placeholder="What should the lead do?" style="flex:1" data-enter="${back}"><button class="btn sm" data-on="${back}">Send</button></div>` : ""}
    </div>`;
  };
  return `<div class="panel alert" style="gap:10px"><div class="phead"><div class="label bad">Flags and escalations · ${flags.length}${more ? "+" : ""}</div>${more ? `<a class="small" href="#/projects">All →</a>` : ""}</div>
    ${flags.length ? flags.map(card).join("") : `<div class="small good">No open flags.</div>`}</div>`;
}

async function projectsView() {
  const [p, flags, team] = await Promise.all([api("/api/portfolio"), api("/api/flags"), can("people.read") ? api("/api/team") : null]);
  const reload = () => route();
  const ending = p.deployments.filter(d => d.days_left != null && d.days_left >= 0 && d.days_left <= 30).length;
  const sweep = on(async () => { const r = await api("/api/sweep", { method: "POST" }); invalidate(); toast(`Rules checked ${r.deployments} deployments: ${r.flags_raised} raised, ${r.flags_resolved} resolved`); reload(); });
  const rows = p.deployments.map(d => {
    const tl = d.days_left == null ? "no end date" : d.days_left < 0 ? `ended ${-d.days_left} d ago` : `${d.days_left} d left · ends ${fmtDate(d.end_on)}`;
    const col = d.progress == null ? "var(--line3)" : d.days_left != null && d.days_left <= 14 ? "var(--warn)" : "var(--good)";
    return `<tr class="click" data-on="${on(() => go("dep/" + d.id))}">
      <td><div class="nm">${esc(d.customer)}</div><div class="sm">${esc(d.name)}${d.lead ? " · " + esc(d.lead) : ""}${d.arr ? " · " + money(d.arr) : ""}</div></td>
      <td class="mono small">${esc(upper(d.stage_name))}</td>
      <td>${statusDot(d.status || d.health)}</td>
      <td style="min-width:170px"><div class="stack" style="gap:5px">${bar(d.progress, col, "thin")}<div class="mono xs ${d.days_left != null && d.days_left <= 14 && d.days_left >= 0 ? "warn" : "muted"}">${tl}</div></div></td>
      <td>${d.burn != null ? `<span class="mono small ${d.progress != null && d.burn - d.progress > 0.2 ? "bad" : ""}">${pct(d.burn)}</span>` : `<span class="muted">—</span>`}</td>
      <td class="mono" style="color:${d.flags_high ? "var(--bad)" : d.flags ? "var(--accent)" : "var(--muted)"}">${d.flags || "—"}</td></tr>`;
  }).join("");
  page(`<div class="headrow"><div><h1>Active projects</h1><p class="lede">${plural(p.deployments.length, "project")} · ${plural(flags.length, "open flag")} · ${ending} ending in the next 30 days</p></div>
      <div class="row"><div class="legend"><span><span class="sdot" style="background:var(--good)"></span>on track</span><span><span class="sdot" style="background:var(--accent)"></span>at risk</span><span><span class="sdot" style="background:var(--bad)"></span>off track</span></div>
      ${scope("flag.handle") === "all" ? `<button class="btn sm" data-on="${sweep}">Run the rules now</button>` : ""}</div></div>
