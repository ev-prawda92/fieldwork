    <div class="grid g-wide">
      <div class="panel flush"><div class="tblwrap"><table class="tbl"><thead><tr><th>Project</th><th>Stage</th><th>Status</th><th>Time to end</th><th>Burn</th><th>Flags</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="stack lg">${flagsPanel(flags, reload)}
        ${team ? `<div class="panel"><div class="label">Engineers freeing up</div>${team.rolloff.length ? team.rolloff.map(r => `<div class="row nowrap" style="font-size:13px"><span class="mono small warn" style="width:56px;flex-shrink:0">${fmtDate(r.on)}</span><span>${esc(r.user)} rolls off ${esc(r.deployment)} <span class="muted">(${pct(r.frees)})</span></span></div>`).join("") : `<div class="small muted">Nobody rolls off in the next 60 days.</div>`}</div>` : ""}
      </div></div>
    <p class="small muted">Rules raise flags on their own when a stage runs past its target, hours burn ahead of the calendar, a conformance gate fails, or a task sits blocked for more than 3 days. They clear themselves when the condition does.</p>`);
}

/* ========================================================== pipeline */
function staffingLabel(s) {
  if (!s) return `<span class="muted small">—</span>`;
  if (s.ok === null) return `<span class="mono xs muted">${esc(s.label)}</span>`;
  return `<span class="mono xs ${s.ok ? "good" : "bad"}">${s.ok ? "✓ " : "✕ "}${esc(s.label.replace(/\d{4}-\d{2}-\d{2}/, m => fmtDate(m)))}</span>`;
}
function collisionText(p) {
  const c = p.collisions;
  if (!c.length) return "";
  const names = c.map(x => x.opportunity.split(" · ")[0]);
  const first = c[0];
  return `${names.join(" and ")} ${c.length > 1 ? "each fit" : "fits"} on its own but not alongside the likelier deals ahead of it. ${first.earliest ? `The earliest start with room is the week of ${fmtDate(first.earliest)}.` : "There's no room in the next six months."} Hire, push a start date, or free someone up.`;
}
async function pipelineView() {
  const p = await api("/api/pipeline");
  const edit = can("pipeline.edit");
  const cols = [...p.columns, { stage: "won", label: "Won", total: p.won.reduce((a, d) => a + d.value, 0), deals: p.won }];
  const card = d => {
    const mv = on(async el => { await api(`/api/opportunities/${d.id}`, { method: "PATCH", body: { stage: el.value } }); toast(`Moved to ${el.options[el.selectedIndex].text}`); route(); });
    return `<div class="panel" style="padding:12px;gap:6px;border-radius:8px">
      <div style="font-size:13.5px;font-weight:500">${esc(d.name)}</div>
      <div class="small muted">${esc(d.use_case || d.customer)}</div>
      <div class="row nowrap" style="justify-content:space-between;margin-top:2px"><span class="mono small">${money(d.value)}${d.stage !== "won" ? ` <span class="muted">· ${pct(d.probability)}</span>` : ""}</span><span class="mono xs muted">${d.expected_start ? "start " + fmtDate(d.expected_start) : ""}</span></div>
      ${d.stage !== "won" ? `<div>${staffingLabel(d.staffing)}</div>` : d.deployment_id ? `<a class="small" href="#/dep/${esc(d.deployment_id)}">Deployment →</a>` : can("deployment.create") ? `<button class="btn xs primary" data-on="${on(async () => { const r = await api(`/api/opportunities/${d.id}/open-deployment`, { method: "POST" }); toast("Deployment opened"); go("dep/" + r.deployment_id); })}">Open deployment</button>` : ""}
      ${d.source && !["console", "import"].includes(d.source) ? `<span class="mono xs muted">from ${esc(d.source)}</span>` : ""}
      ${edit ? `<select data-chg="${mv}" aria-label="Stage for ${esc(d.name)}" style="height:28px;font-size:12px">${["lead", "qualified", "proposal", "commit", "won", "lost"].map(s => `<option value="${s}" ${s === d.stage ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select>` : ""}
    </div>`;
  };
  const add = on(async () => {
    await api("/api/opportunities", { method: "POST", body: { name: val("op_n"), customer: val("op_c"), use_case: val("op_u"), value: +val("op_v") || 0,
      probability: (+val("op_p") || 0) / 100, stage: val("op_s"), expected_start: val("op_d") || null, weekly_hours: +val("op_h") || 0 } });
    toast("Added to the pipeline"); route();
  });
  page(`<div class="headrow"><div><h1>Client pipeline</h1><p class="lede">Incoming and prospective clients, checked against who is actually free to staff them. A deal is staffable when the team has its weekly hours free for its first four weeks.</p></div>
      <div class="row" style="gap:24px">
        <div style="text-align:right"><div class="label">Pipeline</div><div style="font-size:22px;font-weight:600">${money(p.total)}</div></div>
        <div style="text-align:right"><div class="label">Weighted</div><div style="font-size:22px;font-weight:600">${money(p.weighted)}</div></div>
        <div style="text-align:right"><div class="label">Win rate</div><div style="font-size:22px;font-weight:600">${pct(p.win_rate)}</div></div></div></div>
    ${p.collisions.length ? `<div class="panel" style="flex-direction:row;align-items:center;gap:12px;padding:14px 18px"><span class="label warn" style="flex-shrink:0">Capacity check</span><span style="font-size:13px">${esc(collisionText(p))}</span></div>` : ""}
    <div class="grid" style="grid-template-columns:repeat(${cols.length},minmax(200px,1fr));gap:12px;overflow-x:auto">
      ${cols.map(c => `<div class="panel sunk" style="padding:12px;gap:10px;min-height:360px"><div class="phead" style="padding:2px 4px"><span class="label">${esc(c.label)}</span><span class="mono xs muted">${money(c.total)}</span></div>
        ${c.deals.map(card).join("") || `<div class="small muted" style="padding:4px">—</div>`}</div>`).join("")}
    </div>
    ${edit ? `<details><summary>Add a deal (or import your CRM export under Import)</summary><div class="panel" style="margin-top:10px"><div class="formgrid">
      <label class="field"><span>Deal</span><input id="op_n" placeholder="Acme · Claims agent"></label>
      <label class="field"><span>Customer</span><input id="op_c"></label>
      <label class="field"><span>Use case</span><input id="op_u"></label>
      <label class="field"><span>Value ($)</span><input id="op_v" type="number"></label>
      <label class="field"><span>Probability (%)</span><input id="op_p" type="number" value="20"></label>
      <label class="field"><span>Stage</span><select id="op_s">${["lead", "qualified", "proposal", "commit"].map(s => `<option value="${s}">${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select></label>
      <label class="field"><span>Expected start</span><input id="op_d" type="date"></label>
      <label class="field"><span>Team hours / week</span><input id="op_h" type="number" value="40"></label>
      <div><button class="btn primary" data-on="${add}">Add deal</button></div></div></div></details>` : ""}`);
}

/* ========================================================= portfolio */
function ownersPanel(r) {
  const total = r.total_days || 0;
  const col = { customer: "var(--blue)", team: "var(--warn)", model_vendor: "var(--purple)", software_vendor: "var(--bad)" };
  return `<div class="panel" style="gap:14px"><div class="phead"><div class="label">Who owns the delay · ${plural(r.confirmed_rows, "confirmed row")}</div>${can("delay.confirm") && r.unconfirmed_rows ? `<a class="small" href="#/delays">${r.unconfirmed_rows} to confirm →</a>` : ""}</div>
    ${total ? r.owners.map(o => `<div class="stack" style="gap:6px"><div class="row nowrap" style="justify-content:space-between;font-size:13px"><span>${esc(o.label)}</span><span class="mono">${pct(o.share)} · ${num(o.days)} d</span></div>
      ${bar(o.share, col[o.owner], "thin")}<div class="small muted">${o.top_reason ? "Top reason: " + esc(o.top_reason) : "No confirmed delay"}</div></div>`).join("") : `<div class="empty">No confirmed delays yet. Confirm some in the delay ledger.</div>`}
    ${(r.priors || []).filter(x => x.overrides_default).map(x => `<div class="small text2" style="border-top:1px solid var(--line);padding-top:10px"><span class="label">Learned</span> ${esc(x.explain)}</div>`).join("")}</div>`;
}
async function portfolioView() {
  const [p, billing] = await Promise.all([api("/api/portfolio"), billingPanel().catch(() => "")]);
  const k = p.kpis || {};
  const max = Math.max(...p.stage_medians.map(s => Math.max(s.median_days || 0, s.target_days || 0)), 1);
  const worst = p.stage_medians.filter(s => s.median_days != null).sort((a, b) => (b.median_days / b.target_days) - (a.median_days / a.target_days))[0];
  page(`<div><h1>Deployments portfolio</h1><p class="lede">${plural(k.active_deployments || 0, "active deployment")} · ${esc(S.me.tenant.name)} · every figure computed from the record, none entered by hand</p></div>
    <div class="grid g5">
      ${kpi("Contract value in flight", money(k.contract_value), "annual contract value across active customers")}
      ${kpi("Active deployments", k.active_deployments ?? "—", `${k.off_track || 0} off track · ${k.at_risk || 0} at risk`)}
      ${kpi(`Median days to ${stageName(k.live_stage || "").toLowerCase()}`, k.median_days_to_live ?? "—", k.days_to_live_target ? `target ${k.days_to_live_target}` : "")}
      ${kpi("Utilization · 4 weeks", pct(k.utilization), k.utilization == null ? "log time to see it" : "logged over available hours")}
      ${kpi("Open flags", k.open_flags ?? 0, "raised by rules and people", k.open_flags ? "alert" : "", k.open_flags ? "bad" : "")}
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
      <div class="panel" style="gap:14px"><div class="label">Median days in stage vs target</div>
        ${p.stage_medians.map(s => {
          const over = s.median_days != null && s.median_days > s.target_days;
          return `<div class="stbar"><span class="mono small">${esc(upper(s.name))}</span>
            <div class="track" style="overflow:visible"><div class="fill" style="width:${Math.round(100 * (s.median_days || 0) / max)}%;background:${over ? "var(--bad)" : "var(--good)"}"></div><div class="tick" style="left:${Math.round(100 * s.target_days / max)}%"></div></div>
            <span class="mono small ${over ? "bad" : ""}">${s.median_days == null ? "—" : num(s.median_days)} / ${s.target_days}${s.n ? `<span class="muted xs"> n${s.n}</span>` : ""}</span></div>`;
        }).join("")}
        <div class="small muted">Bar is the median across finished stages; the tick is your target.${worst && worst.median_days > worst.target_days ? ` ${esc(worst.name)} is where deployments slip.` : ""}</div></div>
      ${ownersPanel({ ...p.delays, priors: [] })}
    </div>
    ${billing}
    ${chainTable(p)}`);
}

/* ======================================================= delay ledger */
async function delaysView() {
  const [q, roll] = await Promise.all([api("/api/delays/queue"), api("/api/delays/rollup")]);
  const labels = Object.fromEntries(q.owners.map(o => [o.key, o.label]));
  const reload = () => { invalidate(); route(); };
  const opts = sel => q.owners.map(o => `<option value="${o.key}" ${o.key === sel ? "selected" : ""}>${esc(o.label)}</option>`).join("");
  const groups = q.groups.map(g => {
    const confirmAll = on(async () => { const r = await api("/api/delays/batch", { method: "POST", body: { span_ids: g.span_ids } }); toast(`${r.decided} confirmed at ${r.weight_each} weight each`); reload(); });
    const reassignAll = on(async () => { const o = val("ga_" + g.signal + g.proposed_owner); const r = await api("/api/delays/batch", { method: "POST", body: { span_ids: g.span_ids, owner: o } }); toast(`${r.decided} reassigned to ${labels[o]}`); reload(); });
    return `<div class="sub-card"><div class="row nowrap"><span class="mono small">${g.count} ×</span><b style="font-size:13.5px">${esc(g.signal_label)}</b><span class="muted small">proposed</span><span class="chip ${OWNER_CLASS[g.proposed_owner]}">${esc(labels[g.proposed_owner])}</span><div class="spacer"></div><span class="mono small muted">${num(g.days)} d</span></div>
      ${g.count > 1 ? `<div class="row"><button class="btn sm" data-on="${confirmAll}">Confirm all ${g.count}</button><select id="ga_${esc(g.signal + g.proposed_owner)}" style="height:30px">${opts(g.proposed_owner === "customer" ? "team" : "customer")}</select><button class="btn sm" data-on="${reassignAll}">Reassign all</button><span class="xs muted">A batch decision counts a quarter as much as one made row by row.</span></div>` : ""}</div>`;
  }).join("");
  const items = q.items.map(x => delayCard(x, labels, opts, reload)).join("");
  page(`<div><h1>Delay ledger · confirm the cause</h1><p class="lede">Signals propose who owns each stretch of waiting; a person confirms or reassigns it. Every confirmed row is a labeled record of why deployments slip, and after enough of them the proposals learn your workspace's patterns.</p></div>
    <div class="grid g-main">
      <div class="stack lg">
        ${q.groups.length ? `<div class="panel"><div class="label">Waiting for a decision · grouped</div>${groups}</div>` : ""}
        <div class="panel"><div class="label">One at a time · ${q.items.length}</div>${items || `<div class="small good">Queue clear. Every delay has a confirmed owner.</div>`}</div>
      </div>
      ${ownersPanel(roll)}
    </div>`);
}
function delayCard(x, labels, opts, reload) {
  const confirm = on(async () => { await api(`/api/delays/${x.id}/decide`, { method: "POST", body: {} }); toast(`Confirmed as ${labels[x.proposed_owner]}`); reload(); });
  const reassign = on(async () => { const o = val("dl_" + x.id); await api(`/api/delays/${x.id}/decide`, { method: "POST", body: { owner: o } }); toast(`Reassigned to ${labels[o]}`); reload(); });
  const alt = x.proposed_owner === "customer" ? "team" : "customer";
  return `<div class="sub-card">
    <div class="row nowrap"><span class="mono small ${x.days > 7 ? "bad" : "warn"}">${num(x.days)} d</span><span style="font-size:13.5px">in ${esc(stageName(x.stage))} · <a href="#/dep/${esc(x.deployment_id)}">${esc(x.deployment || "")}</a></span>${x.open ? `<span class="chip line xs">still open</span>` : ""}</div>
    <div style="font-size:12.5px;color:var(--text2)">Proposed: <b class="${OWNER_CLASS[x.proposed_owner]}">${esc(labels[x.proposed_owner])}</b> · ${esc(x.proposed_reason)}</div>
    ${x.evidence ? `<div class="small muted">${esc(x.evidence)}</div>` : ""}
    <div class="xs muted">Why this proposal: ${esc(x.proposal_basis)}</div>
    <div class="row"><button class="btn primary sm" data-on="${confirm}">Confirm</button><select id="dl_${esc(x.id)}" style="height:30px">${opts(alt)}</select><button class="btn sm" data-on="${reassign}">Reassign</button></div></div>`;
}

/* ============================================================== team */
function capacityPanel(t) {
  return `<div class="panel" style="gap:14px"><div class="phead"><div class="label">Capacity · hours booked this week</div><span class="mono xs muted">week of ${fmtDate(t.week)}</span></div>
    ${t.people.map(p => {
      const frac = p.available ? p.planned / p.available : 0;
      const c = p.over > 0 ? "var(--bad)" : frac >= 0.9 ? "var(--warn)" : "var(--good)";
      return `<div class="capacity"><div style="min-width:0"><div style="font-size:13.5px;font-weight:500">${esc(p.name)}</div><div class="xs muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.allocations.map(a => esc(a.deployment.split(" ").slice(0, 2).join(" "))).join(", ") || "not allocated"}</div></div>
        ${bar(frac, c)}<span class="mono small" style="color:${c}" title="${p.off_days && p.off_days.length ? `Out ${p.off_days.length} day(s) this week` : ""}">${num(p.planned)} / ${num(p.available)}${p.off_days && p.off_days.length ? ` <span class="blue">· out ${p.off_days.length}d</span>` : ""}</span></div>`;
    }).join("") || `<div class="empty">Nobody has weekly hours set. Set them on the Team page.</div>`}
    <div class="small muted" style="border-top:1px solid var(--line);padding-top:12px">Planned hours are each person's allocation on active deployments times their weekly hours. ${t.logged ? `${num(t.logged)} h logged so far this week.` : ""}</div></div>`;
}
function unassignedPanel(t, reload) {
  const deliveryIds = t.people.map(p => p.user_id);
  const item = u => {
    const pick = on(() => { const el = document.getElementById("ua_" + u.id); el.style.display = el.style.display === "none" ? "" : "none"; });
    const opts = t.people.map(p => {
      const assign = on(async () => {
        try { await api(`/api/deployments/${u.deployment_id}/members`, { method: "POST", body: { user_id: p.user_id } }); } catch (e) {}
        await api(`/api/tasks/${u.id}`, { method: "PATCH", body: { assignee_id: p.user_id } });
        invalidate(); toast(`${u.title} → ${p.name}`); reload();
      });
      return `<button class="btn sm" style="background:var(--panel2)" data-on="${assign}">${esc(p.name)} <span class="muted xs">${num(p.free)} h free</span></button>`;
    }).join("");
    return `<div class="sub-card"><button class="linkbtn" style="color:var(--text);font-size:13.5px;font-weight:500" data-on="${pick}">${esc(u.title)}</button>
      <span class="mono xs muted">${esc(upper(stageName(u.stage)))} · ${esc(u.deployment)}${u.due ? " · due " + fmtDate(u.due) : ""}</span>
      ${u.you_can_assign ? `<div id="ua_${esc(u.id)}" style="display:none" class="row">${opts}</div>` : ""}</div>`;
  };
  return `<div class="panel" style="gap:10px"><div class="label">Unassigned work · ${t.unassigned.length}</div>
    ${t.unassigned.map(item).join("") || `<div class="small good">Everything has an owner.</div>`}
    ${t.unassigned.length ? `<div class="xs muted">Click an item, then a person. They're added to the deployment if they aren't on it.</div>` : ""}</div>`;
}
function approvalsPanel(a, reload) {
  return `<div class="panel" style="gap:10px"><div class="label">Agent approvals · ${a.filter(x => x.status === "pending").length} pending</div>
    ${a.map(x => {
      const yes = on(async () => { await api(`/api/approvals/${x.id}/decide`, { method: "POST", body: { approve: true } }); toast("Approved. The agent can go ahead."); reload(); });
      const no = on(async () => { await api(`/api/approvals/${x.id}/decide`, { method: "POST", body: { approve: false } }); toast("Held. The agent won't act."); reload(); });
      return `<div class="sub-card"><div style="font-size:13.5px">${esc(x.request)}</div>
        <div class="mono xs muted">${esc(x.agent)} · asked by ${esc(x.requested_by_name)} · ${esc(x.deployment)}</div>
        ${x.detail ? `<div class="small text2">${esc(x.detail)}</div>` : ""}
        ${x.status === "pending" ? (x.you_can_decide ? `<div class="row"><button class="btn primary sm" data-on="${yes}">Approve</button><button class="btn sm" data-on="${no}">Hold</button></div>` : `<div class="xs muted">Waiting for someone else to decide.</div>`) : `<div class="mono xs ${x.status === "approved" ? "good" : "bad"}">${esc(x.status)} by ${esc(x.decided_by_name || "")}</div>`}</div>`;
    }).join("") || `<div class="small good">Queue clear. Decisions are written to the audit trail.</div>`}</div>`;
}

      ${kpi("Milestones next 14 days", soon.length, soon.map(d => esc(d.customer.split(" ")[0])).join(", ") || "none")}

function offboardForm(x, people, reload) {

    const r = await api(`/api/people/${x.id}/deactivate`, { method: "POST", body: { reassign_to: heir } });
    toast(`${x.name} is offboarded: ${plural(r.tasks_reassigned, "task")} handed over${r.tasks_unassigned ? `, ${r.tasks_unassigned} waiting for an owner` : ""}`);
    reload();
  });
  row.style.display = "";
  row.firstElementChild.innerHTML = `<div class="sub-card" style="gap:8px"><b>Offboard ${esc(x.name)}</b>
    <div class="small text2">Their sign-in, sessions and access tokens stop working now. They come off every deployment, their calendar and mailbox connections are removed with what those collected, and everything they did stays on the audit trail. You can reactivate them later.</div>
    <div class="row nowrap"><label class="small">Hand their ${plural(x.open_tasks, "open task")} to</label>
      <select id="off_to_${esc(x.id)}"><option value="">Nobody yet (Unassigned)</option>${people.filter(p => p.id !== x.id).map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select>
      <button class="btn sm danger" data-on="${go_}">Offboard</button><button class="btn sm ghost" data-on="${on(() => { row.style.display = "none"; })}">Cancel</button></div></div>`;
}

"use strict";

async function depView(id, pg = "overview") {
  const d = await api(`/api/deployments/${id}`);
  const port = await api("/api/portfolio");
  const row = port.deployments.find(x => x.id === id) || { cells: [], days_in_stage: 0 };
  d._row = row; d._stalled = row.overrun;
  const internal = d.you_can.includes("task.view_internal");
  if (!internal) pg = "overview";
  shell({ nav: depNav(d, pg), ctx: `<span class="label">Deployment</span><span class="nm">${esc(d.name)}</span>${stageChip({ ...row, stage: d.stage })}<span class="sub">${esc(d.customer)}</span>` });
  const reload = () => route();
  if (pg === "overview") return internal ? depOverview(d, row, reload) : customerOverview(d, row, reload);
  if (pg === "bench") return benchPage(d, reload);
  if (pg === "ai") return aiDeploymentPage(d, reload);
  return stagePage(d, row, pg, reload);
}

function stepper(d, row) {
  const internal = d.you_can.includes("task.view_internal");
  const st = Object.fromEntries((row.stages || []).map(x => [x.key, x]));
  return `<div class="stepper" style="grid-template-columns:repeat(${S.cfg.stages.length},minmax(0,1fr))">${S.cfg.stages.map((s, i) => {
    const x = st[s.key] || { state: "pending" };
    const cls = { done: "done", progress: "progress", stalled: "stalled", hold: "hold", skipped: "skipped" }[x.state] || "";
    let sub;
    if (x.state === "done") sub = x.days != null ? `done · ${x.days} d` : "done";
    else if (x.state === "skipped") sub = "skipped";
    else if (x.state === "hold") sub = `paused · ${x.days} d`;
    else if (x.status === "in_progress") sub = internal && x.target_days ? `${x.days} of ${x.target_days} d` : `${x.days} d`;
    else sub = internal ? `${s.target_days} d target` : "not started";
    return `<a class="step ${cls}" ${internal ? `href="#/dep/${esc(d.id)}/${esc(s.key)}"` : ""} style="text-decoration:none;color:inherit"><div class="k">${String(i + 1).padStart(2, "0")} · ${esc(sub.toUpperCase())}</div><div class="nm">${esc(s.name)}</div><div class="bar"></div></a>`;
  }).join("")}</div>`;
}

/* The one move people make most: finish what's in progress here and start the next stage.
   Anything else (back, skip ahead) is a pick from the list, no note required. */
function moverHtml(d) {
  const keys = S.cfg.stages.map(s => s.key); const idx = keys.indexOf(d.stage); const next = keys[idx + 1];
  const yc = a => d.you_can.includes(a);
  if (!yc("deployment.advance")) return "";
  const move = async to => {
    await api(`/api/deployments/${d.id}/advance`, { method: "POST", body: { to_stage: to } });
    invalidate(); toast(keys.indexOf(to) > idx ? `${stageName(d.stage)} done. On to ${stageName(to)}.` : `Back to ${stageName(to)}`); route();
  };
  const nextBtn = next ? `<button class="btn primary" data-on="${on(() => move(next))}">${esc(stageName(d.stage))} done → ${esc(stageName(next))}</button>` : "";
  const pick = yc("deployment.jump") ? `<select aria-label="Move to another stage" data-chg="${on(el => { if (el.value) move(el.value); })}" style="width:auto"><option value="">Move to…</option>${S.cfg.stages.filter(s => s.key !== d.stage).map(s => `<option value="${esc(s.key)}">${esc(s.name)}</option>`).join("")}</select>` : "";
  return `<div class="row">${nextBtn}${pick}</div>`;
}

function holdHtml(d, row) {
  if (!d.you_can.includes("deployment.edit")) return row.on_hold ? `<div class="holdbar"><b>On hold</b> for ${plural(Math.round(row.on_hold.days), "day")}${row.on_hold.reason ? ` · ${esc(row.on_hold.reason)}` : ""}</div>` : "";
  if (row.on_hold) {
    const resume = on(async () => { await api(`/api/deployments/${d.id}/hold`, { method: "POST", body: { on: false } }); invalidate(); toast("Resumed. The clock is running again."); route(); });
    return `<div class="holdbar"><b>On hold</b><span>for ${plural(Math.round(row.on_hold.days), "day")}${row.on_hold.reason ? ` · ${esc(row.on_hold.reason)}` : ""}</span><span class="small muted">The stage clock is paused; the time is on the delay ledger.</span><div class="spacer"></div><button class="btn primary sm" data-on="${resume}">Resume</button></div>`;
  }
  return "";
}
function pauseBtn(d, row) {
  if (!d.you_can.includes("deployment.edit") || row.on_hold) return "";
  const open = on(() => { const el = $("#holdform"); el.style.display = el.style.display === "none" ? "" : "none"; });
  return `<button class="btn sm" data-on="${open}">Pause</button>`;
}
function holdForm(d) {
  const WHO = { customer: "Customer", team: S.me.tenant.name, model_vendor: "Model vendor", software_vendor: "Software vendor" };

  return `<div id="holdform" style="display:none" class="panel"><div class="row nowrap"><input id="hold_r" placeholder="Why, if you want to say (optional)" style="flex:1"></div>
    <div class="row small muted">Waiting on ${Object.entries(WHO).map(([k, l]) => `<button class="chipbtn" data-on="${put(k)}">${esc(l)}</button>`).join("")}<button class="chipbtn" data-on="${put(null)}">Not sure</button></div></div>`;
}

      ${kpi("Waiting on", row.delay ? `<span class="${OWNER_CLASS[row.delay.owner]}" style="font-size:22px">${esc(row.delay.label)}</span>` : `<span class="good" style="font-size:22px">nobody</span>`, row.delay ? `${row.delay.days} d · ${esc(row.delay.reason)}${row.delay.confirmed ? "" : " (proposed)"}` : "no open delay")}

    <div class="grid g-main">
      <div class="stack lg">
        <div class="panel" style="gap:4px"><div class="phead" style="margin-bottom:6px"><div class="label">Tasks · ${open.length} open</div>${linkInfo.sync.provider ? `<span class="chip line">↔ ${esc(linkInfo.sync.provider)}</span>` : ""}</div>

        <div class="panel"><div class="phead"><div class="label">Delays on this deployment</div><span class="mono xs muted">${num(delays.reduce((a, x) => a + x.days, 0))} d total</span></div>
          ${delays.slice(0, 8).map(x => `<div class="row nowrap small" style="border-top:1px solid var(--line2);padding-top:8px"><span class="mono xs ${x.open ? "warn" : "muted"}" style="width:46px;flex-shrink:0">${num(x.days)} d</span><span style="flex:1;min-width:0">${esc(x.confirmed_reason || x.proposed_reason)} <span class="muted">· ${esc(stageName(x.stage))}</span></span><span class="chip ${OWNER_CLASS[x.owner]}">${esc(x.owner_label)}</span>${x.status === "open" ? `<span class="xs muted">proposed</span>` : x.status === "deduced" ? `<span class="xs muted">by rule</span>` : ""}</div>`).join("") || `<div class="small muted">No delays logged.</div>`}

          ${yc("deployment.staff") && people.length ? `<div class="row nowrap"><select id="addm" style="flex:1" aria-label="Person">${people.filter(p => !d.members.some(m => m.id === p.id)).map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.role_name)}</option>`).join("")}</select><button class="btn sm" data-on="${addMember}">Add</button></div>` : ""}</div>
        <div class="panel"><div class="label">Plan</div><div class="formgrid">
          <label class="field"><span>Start</span><input id="pl_s" type="date" value="${esc(d.start_on || "")}" ${yc("deployment.staff") ? "" : "disabled"}></label>
          <label class="field"><span>End</span><input id="pl_e" type="date" value="${esc(d.end_on || "")}" ${yc("deployment.staff") ? "" : "disabled"}></label>

        ${syncCard(linkInfo.sync, yc, syncGo)}

}

async function draftReport(id, audience) { await api(`/api/deployments/${id}/reports`, { method: "POST", body: { audience } }); toast("Report drafted from the record"); route(); }
function mdToHtml(md) {
  return `<div class="md">${md.split("\n").map(l => {
    const h = esc(l).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (l.startsWith("# ")) return `<h3>${h.slice(2)}</h3>`;
    if (l.startsWith("### ")) return `<div class="label" style="margin:10px 0 4px">${h.slice(4)}</div>`;
    if (l.startsWith("## ")) return `<div class="h">${h.slice(3)}</div>`;
    if (l.startsWith("- ")) return `<div class="li">• ${h.slice(2)}</div>`;
    return l.trim() ? `<div class="text2">${h}</div>` : "";
  }).join("")}</div>`;
}
function reportsHtml(reps, mayShare, reload) {
  if (!reps.length) return `<div class="small muted">No reports yet. A draft is built only from this deployment's tasks, stage moves and confirmed findings.</div>`;
  return reps.map((r, i) => {
    const copy = on(async () => { try { await navigator.clipboard.writeText(r.body_md); toast("Copied"); } catch (e) { toast("Couldn't copy; select the text instead", true); } });
    const share = on(async () => { await api(`/api/reports/${r.id}/share`, { method: "POST", body: { shared: r.visibility !== "shared" } }); toast(r.visibility === "shared" ? "Now internal only" : "Shared with the customer"); reload(); });
    return `<details ${i === 0 ? "open" : ""} style="border-top:1px solid var(--line2);padding-top:8px"><summary><span style="color:var(--text)">${r.audience === "customer" ? "Customer update" : "Internal update"}</span> · <span class="mono xs">${fmtDate(r.created_at)}</span> · ${esc(r.created_by_name)}${r.visibility === "shared" ? ` <span class="chip purple">shared</span>` : ""}</summary>
      <div class="panel sunk" style="margin-top:8px;padding:14px">${mdToHtml(r.body_md)}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-on="${copy}">Copy as text</button>${mayShare && r.audience === "customer" ? `<button class="btn sm" data-on="${share}">${r.visibility === "shared" ? "Unshare" : "Share with customer"}</button>` : ""}</div></details>`;
  }).join("");
}
function syncCard(sync, yc, go_) {
  const ints = S.cfg.integrations || {};
  const enabled = ["github", "linear", "jira"].filter(p => (ints[p] || {}).enabled);
  const label = { github: "GitHub", linear: "Linear", jira: "Jira" }, hint = { github: "owner/repo", linear: "Linear team ID", jira: "Jira project key" };
  if (!sync.provider && !(yc("deployment.staff") && enabled.length)) return "";
  return `<div class="panel"><div class="label">Task sync</div>
    ${sync.provider ? `<div class="small">Tasks sync both ways with <b>${esc(label[sync.provider])}</b> · <span class="mono">${esc(sync.target)}</span></div>` : `<div class="small muted">Not syncing with a tracker.</div>`}
    ${yc("deployment.staff") && enabled.length ? `<div class="row nowrap"><select id="syncp" aria-label="Tracker"><option value="">Off</option>${enabled.map(p => `<option value="${p}" ${p === sync.provider ? "selected" : ""}>${label[p]}</option>`).join("")}</select>
      <input id="synct" placeholder="${esc(hint[sync.provider || enabled[0]])}" value="${esc(sync.target || "")}" style="flex:1;min-width:100px"><button class="btn sm" data-on="${go_}">Save</button></div>` : ""}</div>`;
}

/* ============================================ commercials: SOWs, billable milestones, sign-off */
const cash = (v, cur) => v == null ? "—" : new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD", maximumFractionDigits: v % 1 ? 2 : 0 }).format(v);
const MS_STATUS = { pending: ["IN DELIVERY", ""], ready: ["READY TO SUBMIT", "blue"], submitted: ["AWAITING SIGN-OFF", "warn"], changes_requested: ["CHANGES ASKED", "bad"], accepted: ["SIGNED OFF · TO INVOICE", "good"], invoiced: ["INVOICED", "purple"], paid: ["PAID", "good"] };
const MS_CUSTOMER = { pending: ["IN PROGRESS", ""], ready: ["IN PROGRESS", ""], submitted: ["NEEDS YOUR SIGN-OFF", "warn"], changes_requested: ["CHANGES REQUESTED", "bad"], accepted: ["SIGNED OFF", "good"], invoiced: ["SIGNED OFF", "good"], paid: ["SIGNED OFF", "good"] };
const shortHash = h => h ? String(h).replace("sha256:", "").slice(0, 12) : "";

function receiptHtml(pk) {
  if (!pk || !pk.anchor_seq) return "";
  const check = on(async () => {
    const r = await api("/api/audit/verify-anchor", { method: "POST", body: { seq: pk.anchor_seq, hash: pk.anchor_hash } });
    toast(r.ok ? `Matches the record: entry ${r.seq}, ${fmtDateY(r.at)}` : `Doesn't match the record: ${r.reason}`, !r.ok);
  });
  return `<span class="row nowrap" style="gap:4px;flex-wrap:wrap"><span class="xs muted mono" title="Keep this: the evidence fingerprint and the record entry it was written into. Anyone in the workspace can check it later.">evidence ${esc(shortHash(pk.customer_hash))} · record #${pk.anchor_seq} ${esc(shortHash(pk.anchor_hash))}</span><button class="btn xs ghost" data-on="${check}">Check</button></span>`;
}

async function showPacket(mid, boxId) {
  const box = document.getElementById(boxId); if (!box) return;
  if (box.dataset.open) { box.innerHTML = ""; delete box.dataset.open; return; }
  const r = await api(`/api/milestones/${mid}/packet`); const p = r.packet;
  box.dataset.open = "1";
  box.innerHTML = `<div class="panel sunk" style="padding:12px 14px;gap:8px;margin-top:6px">
    <div class="row nowrap"><span class="label" style="flex:1">Evidence frozen ${esc(fmtDateY(p.submitted.at))} · ${esc(p.submitted.by)}</span><span class="chip ${r.intact ? "good" : "bad"}" style="font-size:10px">${r.intact ? "INTACT" : "ALTERED"}</span></div>
    ${p.milestone.criteria ? `<div class="small"><b>Acceptance criteria.</b> ${esc(p.milestone.criteria)}</div>` : ""}
    ${p.submitted.note ? `<div class="small text2">${esc(p.submitted.note)}</div>` : ""}
    <div class="small"><b>Stages.</b> ${p.stages.map(s => `${esc(s.name)} <span class="muted">${s.state === "done" ? "done " + esc(fmtDate(s.done)) : esc(s.state.replace("_", " "))}</span>`).join(" · ")}</div>
    <div class="small"><b>Work finished</b> <span class="muted">(${p.work_done.length})</span>${p.work_done.slice(0, 15).map(t => `<div class="li">• ${esc(t.title)} <span class="muted xs">${esc(fmtDate(t.done_at))}</span></div>`).join("") || `<div class="muted xs">None listed for this milestone.</div>`}</div>
    ${p.results.length ? `<div class="small"><b>Confirmed results</b>${p.results.map(f => `<div class="li">• ${esc(f.title)}${f.summary ? `: <span class="text2">${esc(f.summary)}</span>` : ""}</div>`).join("")}</div>` : ""}
    ${p.audience === "internal" ? `<div class="small muted">Internal copy · ${num(p.hours_logged)} h logged${p.budget_hours ? ` of ${num(p.budget_hours)}` : ""}${p.delays.length ? ` · delays: ${p.delays.map(x => `${esc(x.owner)} ${num(x.days)} d`).join(", ")}` : ""}</div>` : ""}
    <div class="xs muted mono" style="word-break:break-all;line-height:1.5">Customer evidence ${esc(r.customer_hash)}<br>Record entry #${r.receipt.record_position} · ${esc(r.receipt.record_hash || "")}</div></div>`;
}

function parseMilestones(text) {
  return String(text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const [name, amount, stage] = l.split(/\s*[,|;]\s*/);
    const st = (stage || "").toLowerCase();
    const hit = S.cfg.stages.find(s => s.key === st || s.name.toLowerCase() === st);
    return { name, amount: +String(amount || "0").replace(/[^0-9.]/g, "") || 0, stage: hit ? hit.key : null };
  });
}

function commercialsHtml(d, cm, reload, erps) {
  const yc = cm.you_can; const mayEdit = yc["sow.edit"], maySubmit = yc["milestone.submit"];
  if (!cm.sows.length && !mayEdit) return "";
  const post = (path, body, msg) => on(async () => { await api(path, { method: "POST", body }); toast(msg); reload(); });
  const msRow = m => {
    const [lab, cls] = MS_STATUS[m.status] || [upper(m.status), ""]; const bid = "pk_" + m.id;
    let acts = "";
    if (maySubmit && (["ready", "changes_requested"].includes(m.status) || (m.status === "pending" && !m.stage)))
      acts += `<button class="btn xs primary" data-on="${post(`/api/milestones/${m.id}/submit`, {}, "Submitted. The evidence is frozen and the customer can sign off.")}">${m.status === "changes_requested" ? "Resubmit" : "Submit for sign-off"}</button>`;
    if (mayEdit && (["submitted", "ready", "changes_requested"].includes(m.status) || (m.status === "pending" && !m.stage))) {
      const rec = on(async () => { const note = val("px_" + m.id); if (!note || note.length < 3) { toast("Say how the customer signed off", true); return; } await api(`/api/milestones/${m.id}/record-acceptance`, { method: "POST", body: { note } }); toast("Sign-off recorded, marked as recorded on their behalf"); reload(); });
      acts += `<details><summary class="small">Signed off elsewhere?</summary><div class="row nowrap" style="margin-top:6px"><input id="px_${m.id}" placeholder="How: e.g. email from Ruth, Sep 12" style="flex:1;min-width:160px;height:28px"><button class="btn xs" data-on="${rec}">Record</button></div></details>`;
    }
    if (mayEdit && m.status === "accepted") acts += `<input id="inv_${m.id}" placeholder="Invoice #" aria-label="Invoice number" style="width:110px;height:28px"><button class="btn xs" data-on="${on(async () => { await api(`/api/milestones/${m.id}/invoiced`, { method: "POST", body: { invoice_ref: val("inv_" + m.id) || "" } }); toast("Marked invoiced"); reload(); })}">Invoiced</button>`;
    if (mayEdit && m.status === "invoiced") acts += `<button class="btn xs" data-on="${post(`/api/milestones/${m.id}/paid`, {}, "Marked paid")}">Paid</button>`;
    if (mayEdit && m.erp_status === "error") acts += `<button class="btn xs" data-on="${on(async () => { const r = await api(`/api/milestones/${m.id}/push`, { method: "POST" }); toast(r.erp_status === "sent" ? "Sent to the ERP" : `Still failing: ${r.erp_error || r.erp_status}`, r.erp_status !== "sent"); reload(); })}">Retry ERP</button>`;
    if (m.packet) acts += `<button class="btn xs ghost" data-on="${on(() => showPacket(m.id, bid))}">Evidence</button>`;
    const sub = [m.stage_name ? `bills when ${esc(m.stage_name)} is done` : "milestone you mark done", m.due_on ? `due ${esc(fmtDate(m.due_on))}` : "",
      m.decided_by && ["accepted", "invoiced", "paid"].includes(m.status) ? `signed off by ${esc(m.decided_by)}${m.proxy ? " (recorded)" : ""} ${esc(fmtDate(m.decided_at))}` : "",
      m.invoice_ref ? `invoice ${esc(m.invoice_ref)}` : "", m.erp_status ? `ERP ${esc(m.erp_status.replace("_", " "))}` : ""].filter(Boolean).join(" · ");
    return `<div style="border-top:1px solid var(--line2);padding:9px 0 7px" class="stack"><div class="row nowrap" style="gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:500">${esc(m.name)}</div><div class="xs muted">${sub}</div>
        ${m.status === "changes_requested" && m.decision_note ? `<div class="xs bad">Customer: “${esc(m.decision_note)}”</div>` : ""}${m.erp_error ? `<div class="xs bad">${esc(m.erp_error)}</div>` : ""}</div>
        <span class="mono small" style="white-space:nowrap">${m.amount != null ? cash(m.amount, m.currency) : ""}</span><span class="chip ${cls}" style="font-size:10px;white-space:nowrap">${lab}</span></div>
      ${acts ? `<div class="row" style="gap:6px;align-items:center">${acts}</div>` : ""}<div id="${bid}"></div></div>`;
  };
  const addTo = s => {
    if (!mayEdit) return "";
    const go_ = on(async () => { const name = val("nm_" + s.id); if (!name) return; await api(`/api/sows/${s.id}/milestones`, { method: "POST", body: { name, amount: +val("na_" + s.id) || 0, stage: val("ns_" + s.id) || null } }); toast("Milestone added"); reload(); });

function customerCommercialsHtml(d, cm, reload) {

  const accept = m => on(async () => {

  });
  const changes = m => on(async () => {
    const note = val("an_" + m.id); if (!note) { toast("Say what needs to change", true); return; }
    await api(`/api/milestones/${m.id}/request-changes`, { method: "POST", body: { packet_hash: m.packet.customer_hash, note } });
    toast("Sent back with your note"); reload();
  });
  const row = m => {
    const [lab, cls] = MS_CUSTOMER[m.status] || [upper(m.status), ""]; const bid = "pk_" + m.id;

        <div class="xs muted">${[m.stage_name ? `after ${esc(m.stage_name)}` : "", m.criteria ? esc(m.criteria) : "", ["accepted", "invoiced", "paid"].includes(m.status) && m.decided_at ? `signed off ${esc(fmtDateY(m.decided_at))}${m.decided_by ? " by " + esc(m.decided_by) : ""}` : ""].filter(Boolean).join(" · ")}</div></div>
        ${m.amount != null ? `<span class="mono small">${cash(m.amount, m.currency)}</span>` : ""}<span class="chip ${cls}" style="font-size:10px;white-space:nowrap">${lab}</span></div>
      ${m.packet ? `<div class="row" style="gap:6px;align-items:center"><button class="btn xs ${mayAccept ? "" : "ghost"}" data-on="${on(() => showPacket(m.id, bid))}">${mayAccept ? "Review the evidence" : "Evidence"}</button>${["accepted", "invoiced", "paid"].includes(m.status) ? receiptHtml(m.packet) : ""}</div>` : ""}<div id="${bid}"></div>
      ${mayAccept ? `<div class="row" style="gap:6px"><input id="an_${m.id}" placeholder="Note (required if you're asking for changes)" style="flex:1;min-width:140px"><button class="btn primary sm" data-on="${accept(m)}">Sign off</button><button class="btn sm" data-on="${changes(m)}">Ask for changes</button></div>` : ""}
      ${m.status === "changes_requested" && m.decision_note ? `<div class="xs text2">You asked: “${esc(m.decision_note)}”. The team will resubmit.</div>` : ""}</div>`;

      ${bar(w.done / Math.max(1, w.total), "var(--good)", "thin")}
      ${cm.waiting_on_customer.length ? `<div class="small warn">${plural(cm.waiting_on_customer.length, "milestone is", "milestones are")} waiting for your sign-off.</div>` : ""}
      ${cm.sows.map(s => `<div class="stack" style="gap:0"><div class="small muted" style="margin-top:6px">${esc(s.reference || "Statement of work")}${s.total_value != null ? ` · ${cash(s.total_value, s.currency)}` : ""}</div>${s.milestones.map(row).join("")}</div>`).join("") || `<div class="small muted">Milestones will show here once the statement of work is set up.</div>`}</div>`;

/* ========================================================= stage pages */
async function stagePage(d, row, key, reload) {
  const stage = stageOf(key);
  const list = (stage.engines || []).filter(k => S.engines[k]);
  const tabKey = `eng_${d.id}_${key}`;
  const current = S[tabKey] && list.includes(S[tabKey]) ? S[tabKey] : list[0];
  const [findings, tasks] = await Promise.all([api(`/api/deployments/${d.id}/findings`), api(`/api/tasks?deployment_id=${encodeURIComponent(d.id)}`)]);
  const yc = a => d.you_can.includes(a);
  const eng = current ? S.engines[current] : null;
  const runs = findings.filter(f => f.engine === current);
  const latest = runs[0];
  const keys = S.cfg.stages.map(s => s.key); const here = keys.indexOf(d.stage), me = keys.indexOf(key);
  const sx = (row.stages || []).find(x => x.key === key) || { status: "not_started" };
  const setState = st => on(async () => {
    await api(`/api/deployments/${d.id}/stages/${key}`, { method: "PUT", body: { state: st } });
    invalidate(); toast(st === "done" ? `${stage.name} done ✓` : st === "in_progress" ? `${stage.name} in progress` : st === "skipped" ? `${stage.name} skipped` : `${stage.name} reset`); route();
  });
  const LBL = { not_started: "Not started", in_progress: "In progress", done: "Done", skipped: "Skipped" };
  const where = yc("deployment.advance")
    ? `<div class="seg" role="group" aria-label="${esc(stage.name)} state">${Object.entries(LBL).map(([k, l]) => `<button class="${sx.status === k ? "on " + k : ""}" aria-pressed="${sx.status === k}" data-on="${setState(k)}">${l}</button>`).join("")}</div>
       ${sx.days != null && sx.status !== "not_started" ? `<span class="mono small ${sx.overrun ? "bad" : "muted"}">${sx.days} d${sx.target_days ? ` of ${sx.target_days}` : ""}${sx.state === "hold" ? " · paused" : ""}</span>` : ""}`
    : `<span class="chip">${esc(upper(LBL[sx.status] || sx.status))}</span>`;
  const extras = [];
  if (list.includes("golive") || key === "golive") extras.push(await checklistPanel(d, reload));
  if (list.includes("cortex")) extras.push(approvalsPanel(await api(`/api/approvals?status=all&deployment_id=${encodeURIComponent(d.id)}`), reload));
  if (list.includes("value_study") || list.includes("attribution")) extras.push(await depDelaysPanel(d, reload));
  const stageTasks = tasks.filter(t => t.stage === key);
  page(`<div class="headrow"><div><div class="row">${where}</div><h1 style="margin-top:12px">${esc(stage.name)}${eng ? ` · ${esc(eng.name)}` : ""}</h1>
      <p class="lede">${esc(eng ? eng.does : "")}${stage.exit_criteria ? `<br><span class="text2">Exit: ${esc(stage.exit_criteria)}</span>` : ""}</p></div>
      </div>
    ${list.length > 1 ? `<div class="tabs" role="tablist">${list.map(k => `<button role="tab" aria-selected="${k === current}" class="tab ${k === current ? "on" : ""}" data-on="${on(() => { S[tabKey] = k; route(); })}">${esc(S.engines[k].name)}</button>`).join("")}</div>` : ""}
    ${!eng ? `<div class="empty">No engine on this stage. Add one in Settings → Deployment chain.</div>` :
      latest ? `${resultHero(current, latest.result, false, latest)}` : `<div class="empty">No ${esc(eng.name)} results on this deployment yet.${yc("engine.run") && eng.kind !== "push" ? " Run it below." : ""}</div>`}
    ${extras.length ? `<div class="grid ${extras.length > 1 ? "g2" : ""}">${extras.join("")}</div>` : ""}
    ${eng ? `<div class="grid g-main">
      <div class="panel"><div class="label">Runs · ${runs.length}</div>${runs.map(f => runRow(f, d, reload)).join("") || `<div class="small muted">None yet.</div>`}</div>
      <div class="panel">${runForm(eng, current, d, yc)}</div></div>` : ""}
    <div class="panel" style="gap:4px"><div class="label" style="margin-bottom:6px">Tasks in ${esc(stage.name)} · ${stageTasks.filter(t => t.status !== "done").length} open</div>${stageTasks.map(t => taskRow(t, { showDep: false, reload, updateAny: yc("task.update_any") })).join("") || `<div class="small muted">None.</div>`}</div>`);
}

function runRow(f, d, reload) {
  const yc = a => d.you_can.includes(a);
  const confirm = on(async () => { await api(`/api/findings/${f.id}/confirm`, { method: "POST" }); toast("Confirmed into the record"); reload(); });
  const share = on(async () => { await api(`/api/findings/${f.id}/share`, { method: "POST", body: { shared: f.visibility !== "shared" } }); toast(f.visibility === "shared" ? "Now internal only" : "Shared with the customer"); reload(); });
  const r = f.result || {};
  const status = r.status || (f.engine === "sendero" ? (r.classification === "BUILD" ? "fail" : "info") : "info");
  const sum = r.summary || (f.engine === "sendero" ? `${r.classification} · ${r.confidence_pct}% confidence` : f.engine === "threshold" ? `${(r.ranked || []).length} people scored` : "");
  const lab = f.engine === "sendero" ? r.classification : f.engine === "threshold" ? "scored" : status;
  return `<div class="sub-card"><div class="row nowrap"><span class="chip ${status === "pass" ? "good" : status === "fail" ? "bad" : status === "warn" ? "warn" : "blue"}">${esc(upper(lab))}</span><b style="font-size:13px;flex:1;min-width:0">${esc(f.title)}</b>${f.visibility === "shared" ? `<span class="chip purple">shared</span>` : ""}</div>
    <div class="small text2">${esc(sum)}</div>
    <div class="row"><span class="mono xs muted">${esc(f.created_by_name)} · ${fmtDate(f.created_at)}</span><div class="spacer"></div>
      ${f.confirmed_by ? `<span class="mono xs good">✓ confirmed · ${esc(f.confirmed_by_name)}</span>` : yc("finding.confirm") && f.created_by !== S.me.user.id ? `<button class="btn primary xs" data-on="${confirm}">Confirm</button>` : `<span class="mono xs muted">awaiting a second person</span>`}
      ${yc("customer.share") && f.confirmed_by ? `<button class="btn xs" data-on="${share}">${f.visibility === "shared" ? "Unshare" : "Share"}</button>` : ""}</div></div>`;
}

function runForm(eng, key, d, yc) {
  if (!yc("engine.run")) return `<div class="label">Run</div><div class="small muted">Your role can see results here but not run engines.</div>`;
  if (eng.kind === "push") return `<div class="label">Run</div><div class="small muted">This engine runs in its own environment and posts results in with its engine token. They appear under Runs.</div>`;
  if (key === "sendero") {
    const sample = on(async () => { const s = await api("/api/demo/sample-csv"); $("#se_csv").value = s.csv; $("#se_m").value = s.metric; $("#se_b").value = s.baseline; if (!val("se_t")) $("#se_t").value = "Invoice exception handling time"; });
    const run = on(async el => {
      el.disabled = true;
      try {
        const b = val("se_b");
        await api(`/api/deployments/${d.id}/engines/sendero`, { method: "POST", body: { title: val("se_t") || "Friction point", csv: val("se_csv"), metric: val("se_m").trim(), baseline: b === "" ? null : +b, higher_is_worse: val("se_h") === "1" } });
        toast("Saved as a finding. Someone else confirms it."); route();
      } finally { el.disabled = false; }
    });
    return `<div class="label">Classify a friction point</div>
      <label class="field"><span>Friction point</span><input id="se_t" placeholder="Invoice exception handling time"></label>
      <label class="field"><span>Per-user data · CSV: one row per user, a metric column, cohort columns</span><textarea id="se_csv" rows="6" placeholder="user_id,minutes,tenure_months,site"></textarea></label>
      <div class="formgrid"><label class="field"><span>Metric column</span><input id="se_m"></label><label class="field"><span>Baseline</span><input id="se_b" type="number" step="any"></label>
      <label class="field"><span>Higher is worse</span><select id="se_h"><option value="1">yes</option><option value="0">no</option></select></label></div>
      <div class="row"><button class="btn primary" data-on="${run}">Classify</button>${S.demo ? `<button class="btn" data-on="${sample}">Load sample data</button>` : ""}</div>`;
  }
  const sample = on(async () => { $("#gen_in").value = (await api(`/api/demo/sample-input/${key}`)).input; });
  const run = on(async el => {
    el.disabled = true;
    try {
      const path = eng.builtin ? `stage/${key}` : `custom/${key}`;
      await api(`/api/deployments/${d.id}/engines/${path}`, { method: "POST", body: { input: val("gen_in") } });
      toast("Saved as a finding. Someone else confirms it."); route();
    } finally { el.disabled = false; }
  });
  return `<div class="phead"><div class="label">Run ${esc(eng.name)}</div>${eng.builtin === false ? `<span class="chip line">your engine · ${esc(eng.kind)}</span>` : `<span class="chip">built in</span>`}</div>
    ${eng.input_hint ? `<div class="mono xs muted">${esc(eng.input_hint)}</div>` : ""}
    <textarea id="gen_in" rows="9" aria-label="Engine input"></textarea>
    <div class="row"><button class="btn primary" data-on="${run}">Run</button>${S.demo ? `<button class="btn" data-on="${sample}">Load sample</button>` : ""}</div>`;
}

async function checklistPanel(d, reload) {
  const items = await api(`/api/deployments/${d.id}/checklist`);
  const edit = d.you_can.includes("deployment.edit");
  const add = on(async () => { await api(`/api/deployments/${d.id}/checklist`, { method: "POST", body: { label: val("ck_new") } }); reload(); });
  const defaults = on(async () => { await api(`/api/deployments/${d.id}/checklist`, { method: "POST", body: { defaults: true } }); reload(); });
  const done = items.filter(i => i.done).length;
  return `<div class="panel" style="gap:4px"><div class="phead" style="margin-bottom:6px"><div class="label">Cutover checklist · ${done} of ${items.length}</div>${items.length ? bar(done / items.length, "var(--good)", "thin").replace('class="track thin"', 'class="track thin" style="width:120px"') : ""}</div>
    ${items.map(i => `<div class="task" style="grid-template-columns:24px minmax(0,1fr) auto"><button class="box ${i.done ? "on" : ""}" ${edit ? `data-on="${on(async () => { await api(`/api/checklist/${i.id}`, { method: "PATCH", body: { done: !i.done } }); reload(); })}"` : "disabled"} aria-label="${esc(i.label)}">${i.done ? "✓" : ""}</button>
      <div class="ttl ${i.done ? "done" : ""}">${esc(i.label)}</div><div class="meta">${i.done ? `<span class="xs">${esc(i.done_by_name || "")} · ${fmtDate(i.done_at)}</span>` : ""}</div></div>`).join("") || `<div class="small muted">No checklist yet.</div>`}
    ${edit ? `<div class="row nowrap" style="margin-top:10px"><input id="ck_new" placeholder="Add an item" style="flex:1" data-enter="${add}"><button class="btn sm" data-on="${add}">Add</button>${!items.length ? `<button class="btn sm" data-on="${defaults}">Use the default list</button>` : ""}</div>` : ""}</div>`;
}

async function depDelaysPanel(d, reload) {
  const q = can("delay.confirm") && d.you_can.includes("delay.confirm") ? await api("/api/delays/queue") : null;
  const all = await api(`/api/delays?deployment_id=${encodeURIComponent(d.id)}`);
  const labels = q ? Object.fromEntries(q.owners.map(o => [o.key, o.label])) : { customer: "Customer", team: S.me.tenant.name, model_vendor: "Model vendor", software_vendor: "Software vendor" };
  const opts = sel => Object.entries(labels).map(([k, l]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
  const waiting = all.filter(x => x.status === "open");
  const confirmed = all.filter(x => x.status !== "open").length;
  return `<div class="panel"><div class="phead"><div class="label">Delay ledger · confirm the cause</div><span class="mono xs muted">${confirmed} confirmed</span></div>
    ${waiting.map(x => q ? delayCard(x, labels, opts, () => { invalidate(); reload(); }) : `<div class="sub-card"><div class="small"><span class="mono">${num(x.days)} d</span> in ${esc(stageName(x.stage))}</div><div class="small text2">Proposed: ${esc(x.proposed_owner_label)} · ${esc(x.proposed_reason)}</div></div>`).join("") || `<div class="small good">Every delay here has a confirmed owner.</div>`}
    ${all.filter(x => x.status !== "open").slice(0, 8).map(x => `<div class="row nowrap small" style="border-top:1px solid var(--line2);padding-top:8px"><span class="mono xs muted" style="width:46px;flex-shrink:0">${num(x.days)} d</span><span style="flex:1;min-width:0">${esc(x.confirmed_reason || x.proposed_reason)} <span class="muted">· ${esc(stageName(x.stage))}</span></span><span class="chip ${OWNER_CLASS[x.owner]}">${esc(x.owner_label)}</span><span class="xs muted">${x.status === "deduced" ? "by rule" : x.status}</span></div>`).join("")}
    <div class="xs muted">Every confirmed row is a labeled record of why deployments slip.</div></div>`;
}

/* ================================================== engine result heroes */
function resultHero(engine, r, compact, f) {
  const x = (r && r.result) || {};
  const status = r && r.status;
  const confirmedNote = f ? (f.confirmed_by ? `<span class="mono xs good">✓ confirmed by ${esc(f.confirmed_by_name)}</span>` : `<span class="mono xs warn">awaiting confirmation</span>`) : "";
  const head = !compact ? `<div class="row"><span class="label">Latest run · ${fmtDate(f && f.created_at)}</span>${confirmedNote}</div>` : "";
  if (engine === "census" && x.systems) {
    const gaps = x.systems.filter(s => s.severity !== "ok").length;
    const sevC = s => s === "blocker" ? "bad" : s === "gap" ? "warn" : "good";
    return `${head}<div class="grid ${compact ? "" : "g-main"}"><div class="panel flush"><table class="tbl"><thead><tr><th>System</th><th>Status</th><th>Gaps</th></tr></thead><tbody>
      ${x.systems.map(s => `<tr><td class="nm">${esc(s.system)}</td><td class="mono small ${sevC(s.severity)}">${esc(s.severity === "ok" ? "ready" : s.severity)}</td><td class="text2 small">${esc(s.gaps.join("; ")) || "—"}</td></tr>`).join("")}</tbody></table></div>
      ${compact ? "" : `<div class="stack lg"><div class="panel">${`<div class="label">Systems ready</div><div style="font-size:30px;font-weight:600">${x.systems.length - gaps} of ${x.systems.length}</div><div class="small muted">${gaps} with an ownership, access, documentation or control gap</div>`}</div>
        <div class="panel"><div class="label">Findings memo · ${f && f.confirmed_by ? "confirmed" : "draft"}</div>${mdToHtml(x.memo || "")}</div></div>`}</div>`;
  }
  if (engine === "cortex" && x.scenarios) {
    return `${head}<div class="grid ${compact ? "" : "g-main"}"><div class="panel flush"><table class="tbl"><thead><tr><th>Scenario</th><th>Expected</th><th>Cortex decided</th></tr></thead><tbody>
      ${x.scenarios.map(s => `<tr><td><div class="nm">${esc(s.scenario)}</div><div class="sm">${esc(s.reasons.join("; "))}</div></td><td class="mono small">${esc(s.expected || "—")}</td><td><span class="chip ${s.ok ? "good" : "bad"}">${esc(s.decision)}</span></td></tr>`).join("")}</tbody></table></div>
      ${compact ? "" : `<div class="panel ${x.risks.length ? "alert" : ""}"><div class="label ${x.risks.length ? "bad" : ""}">Risky grants · ${x.risks.length}</div>${x.risks.map(k => `<div class="small text2" style="border-top:1px solid var(--line2);padding-top:8px">${esc(k)}</div>`).join("") || `<div class="small good">None found.</div>`}
        ${x.profile_errors.length ? `<div class="small bad">${x.profile_errors.map(esc).join("<br>")}</div>` : ""}</div>`}</div>`;
  }
  if (engine === "conformance" && x.by_category) {
    const gate = x.critical_failures.length || x.pass_rate < x.threshold;
    return `${head}<div class="grid g3">
      ${kpi("Pass rate", `${pct(x.pass_rate)}`, `against a ${pct(x.threshold)} bar`, "", x.pass_rate >= x.threshold ? "good" : "bad")}
      ${kpi("Critical misses", x.critical_failures.length, x.critical_failures.join(", ") || "none", x.critical_failures.length ? "alert" : "", x.critical_failures.length ? "bad" : "")}
      ${kpi("Against the bar", gate ? "Below" : "Clear", gate ? (x.critical_failures.length ? "a critical case fails · advisory, nothing is held" : "below the bar · advisory") : "suite is green", gate ? "alert" : "", gate ? "bad" : "good")}</div>
      ${compact ? "" : `<div class="panel flush"><table class="tbl"><thead><tr><th>Category</th><th>Passed</th><th>Rate</th><th>Failures</th></tr></thead><tbody>
      ${Object.entries(x.by_category).map(([k, v]) => `<tr><td class="nm">${esc(k)}</td><td class="mono">${v.passed}/${v.total}</td><td class="mono ${v.rate >= x.threshold ? "good" : "bad"}">${pct(v.rate)}</td><td class="small text2">${x.failures.filter(ff => ff.category === k).map(ff => `${esc(ff.case_id)}: expected “${esc(ff.expected)}”, got “${esc(ff.actual)}”${ff.critical ? ` <span class="bad">critical</span>` : ""}`).join("<br>") || "—"}</td></tr>`).join("")}</tbody></table></div>`}`;
  }
  if (engine === "golive" && x.checks) {
    const sev = x.open_by_severity || {};
    return `${head}<div class="grid ${compact ? "" : "g2"}"><div class="panel"><div class="label">Readiness to stand down</div>
      ${x.checks.map(c => `<div class="row nowrap" style="border-top:1px solid var(--line2);padding-top:8px"><span class="box ${c.ok ? "on" : "blocked"}" style="flex-shrink:0">${c.ok ? "✓" : "!"}</span><span style="flex:1;font-size:13px">${esc(c.check)}</span><span class="small muted">${esc(c.detail)}</span></div>`).join("")}</div>
      ${compact ? "" : `<div class="panel"><div class="label">Open issues</div><div class="grid g4" style="gap:10px">${["sev1", "sev2", "sev3", "sev4"].map(s => `<div><div class="mono xs muted">${upper(s)}</div><div style="font-size:24px;font-weight:600" class="${s === "sev1" && sev[s] ? "bad" : s === "sev2" && sev[s] ? "warn" : ""}">${sev[s] || 0}</div></div>`).join("")}</div>
        <div class="small muted">New in the last 24h: ${x.new_last_24h} (prior 24h: ${x.new_prior_24h}) · mean time to resolve sev1 ${x.mean_time_to_resolve.sev1_hours ?? "—"} h, sev2 ${x.mean_time_to_resolve.sev2_hours ?? "—"} h</div>
        ${Object.keys(x.open_by_area || {}).length ? `<div class="row">${Object.entries(x.open_by_area).map(([a, n]) => `<span class="chip">${esc(a)} · ${n}</span>`).join("")}</div>` : ""}</div>`}</div>`;
  }
  if (engine === "sendero" && r && r.classification) {
    const col = r.classification === "BUILD" ? "var(--bad)" : r.classification === "TRAINING" ? "var(--blue)" : "var(--accent)";
    const b = Math.round(r.build_score * 100);
    return `${head}<div class="panel"><div class="row"><b style="font-size:20px;color:${col}">${esc(r.classification)}</b><span class="muted">${r.confidence_pct}% confidence · n=${r.n}</span></div>
      <div class="track" style="display:flex"><div style="width:${b}%;background:var(--bad)"></div><div style="width:${100 - b}%;background:var(--blue)"></div></div><div class="mono xs muted">build ${b}% · training ${100 - b}%</div>
      ${compact ? "" : `<div style="font-size:13.5px">${esc(r.recommendation || "")}</div><div class="small muted">${esc((r.level1_dispersion || {}).reading || "")}</div><div class="small muted">${esc((r.level2_explanatory || {}).reading || "")}</div>`}</div>`;
  }
  if (engine === "value_study" && x.treatment) {
    const t = x.treatment, c = x.control, u = x.unit ? " " + x.unit : "";
    const good = x.improved;
    return `${head}<div class="panel" style="gap:14px"><div class="label">${esc(x.metric)} · before and after ${fmtDateY(x.effective_from)}</div>
      <div class="grid g2" style="gap:12px">
        <div class="sub-card"><div class="small muted">With the change · ${t.n} people</div><div style="font-size:26px;font-weight:600">${num(t.before)} <span class="muted" style="font-size:18px">→</span> <span class="${good ? "good" : ""}">${num(t.after)}</span></div></div>
        <div class="sub-card"><div class="small muted">Comparison group · ${c.n} people</div><div style="font-size:26px;font-weight:600">${num(c.before)} <span class="muted" style="font-size:18px">→</span> ${num(c.after)}</div></div></div>
      ${x.sufficient ? `<div class="row" style="align-items:baseline"><span style="font-size:26px;font-weight:600" class="${good ? "good" : "bad"}">${x.adjusted_change > 0 ? "+" : ""}${num(x.adjusted_change)}${esc(u)}</span><span class="small muted">attributable to the deployment · permutation p = ${x.p_value} · ${t.n} and ${c.n} per group</span></div>` : ""}
      <div style="font-size:13.5px" class="${x.sufficient ? "text2" : "warn"}">${esc(x.verdict)}</div>
      ${x.hours_saved_per_month ? `<div class="small muted">About ${num(x.hours_saved_per_month)} staff hours a month at current volume. This is the number that goes in the expansion conversation.</div>` : ""}</div>`;
  }
  if (engine === "attribution" && x.value) {
    const v = x.value, dc = x.delay_days_by_cause || {};
    const total = Object.values(dc).reduce((a, b) => a + b, 0) + (x.unattributed_days || 0);
    const seg = (n, col) => total ? `<div style="width:${100 * n / total}%;background:${col}"></div>` : "";
    return `${head}<div class="grid ${compact ? "g2" : "g3"}" style="${compact ? "gap:10px" : ""}">${kpi("Improvement", pct(v.improvement_pct / 100), esc(v.metric), "", "good")}${v.hours_saved_per_month != null ? kpi("Hours saved / month", num(v.hours_saved_per_month), "") : ""}${v.value_per_year != null ? kpi("Value / year", money(v.value_per_year), "at the stated cost per hour") : ""}</div>
      ${x.slip_days ? `<div class="panel"><div class="label">${x.slip_days} days late, attributed</div><div class="track" style="display:flex;height:12px">${seg(dc.customer, "var(--blue)")}${seg(dc.vendor, "var(--warn)")}${seg(dc.third_party, "var(--purple)")}${seg(x.unattributed_days, "var(--line3)")}</div>
        <div class="legend"><span><i style="background:var(--blue)"></i>customer ${dc.customer} d</span><span><i style="background:var(--warn)"></i>us ${dc.vendor} d</span><span><i style="background:var(--purple)"></i>third party ${dc.third_party} d</span><span><i style="background:var(--line3)"></i>unattributed ${x.unattributed_days} d</span></div></div>` : ""}`;
  }
  const summary = r && r.summary ? `<div class="row"><span class="chip ${status === "pass" ? "good" : status === "fail" ? "bad" : status === "warn" ? "warn" : "blue"}">${esc(upper(status || "info"))}</span><b>${esc(r.summary)}</b></div>` : "";
  return `${head}<div class="panel">${summary}${Object.keys(x).length ? `<details><summary>Details</summary><pre class="code" style="margin-top:8px">${esc(JSON.stringify(x, null, 2))}</pre></details>` : ""}</div>`;
}

/* ================================================================ bench */
async function benchPage(d, reload) {
  const findings = (await api(`/api/deployments/${d.id}/findings`)).filter(f => f.engine === "threshold");
  const latest = findings[0];
  const yc = a => d.you_can.includes(a);
  const save = on(async () => { await api(`/api/deployments/${d.id}`, { method: "PATCH", body: { staffing_req: val("th_req") } }); toast("Requirements saved"); });
  const match = on(async el => { el.disabled = true; try { await api(`/api/deployments/${d.id}/engines/threshold`, { method: "POST" }); toast("Scored. Saved as a finding."); reload(); } finally { el.disabled = false; } });
  const V = { apply: "good", arguable: "warn", open_question: "blue", blocked: "bad" };
  const VL = { apply: "Can staff", arguable: "Arguable", open_question: "Open question", blocked: "Gap on a must-have" };
  const short = t => { const x = t.replace(/^(\d+\+? years? of |experience (with|integrating with|in) |willing to |background in |working knowledge of )/i, ""); return x.length > 26 ? x.slice(0, 25) + "…" : x; };
  page(`<div class="headrow"><div><h1>Bench · who's on it</h1><p class="lede">Threshold scores people against what this deployment actually needs. Every requirement is met by cited work or it isn't; a resume line alone doesn't count, and nothing it can't see is inferred.</p></div>
      <button class="btn primary" data-on="${match}">Match the bench</button></div>
    <div class="grid g-main">
      <div class="panel flush">${latest ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Person</th><th>Verdict</th><th>Requirements</th></tr></thead><tbody>
        ${latest.result.ranked.map(p => `<tr><td><div class="nm">${esc(p.name)}</div><div class="sm">${esc(p.summary)}</div></td><td><span class="chip ${V[p.verdict] || ""}">${esc(upper(VL[p.verdict] || p.verdict))}</span></td>
          <td><div class="row" style="gap:4px">${p.findings.map(f => `<span class="chip ${f.status === "met" ? "good" : f.status === "missing" ? "bad" : f.status === "arguable" ? "warn" : "blue"}" title="${esc(f.requirement + " · " + f.detail + (f.citations.length ? " · " + f.citations.join(", ") : ""))}">${f.gate ? "◆ " : ""}${esc(short(f.requirement))}</span>`).join("")}</div></td></tr>`).join("")}
        </tbody></table></div><div class="tfoot legend"><span><span class="chip good">met</span> cited work</span><span><span class="chip warn">arguable</span> claimed only</span><span><span class="chip bad">missing</span> routes to training</span><span><span class="chip blue">unknown</span> ask, don't guess</span><span>◆ gate</span></div>` : `<div class="empty" style="margin:18px">Not scored yet.</div>`}</div>
      <div class="panel"><div class="label">Staffing requirements</div><textarea id="th_req" rows="12">${esc(d.staffing_req)}</textarea>${yc("deployment.staff") ? `<div><button class="btn sm" data-on="${save}">Save requirements</button></div>` : ""}</div>
    </div>`);
}

const ago = iso => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
};
const HEALTH = { healthy: ["HEALTHY", "good"], stale: ["QUIET", "warn"], erroring: ["ERRORS", "bad"], needs_reauth: ["RECONNECT", "bad"], disconnected: ["OFF", ""] };

async function startConnect(key) {
  const r = await api(`/api/connections/${key}/start`, { method: "POST" });
  location.href = r.url;
}

async function integrationsView() {
  const [cov, info, cat] = await Promise.all([api("/api/coverage"), api("/api/integrations"), api("/api/connections")]);
  const cfg = JSON.parse(JSON.stringify(S.cfg));
  const provs = Object.fromEntries(cat.providers.map(p => [p.key, p]));
  const all = TOOLS.flatMap(g => g.items);
  const statusOf = t => {
    const p = provs[t.key];
    if (p) {
      if (p.personal) return p.people_connected ? [`${plural(p.people_connected, "person", "people")} connected`, true] : p.configured ? ["nobody yet", false] : ["needs app setup", false];
      const c = p.connections.find(x => x.status !== "disconnected");
      if (c) { const [lab] = HEALTH[c.health.state] || [c.health.state]; return [`${c.account_name} · ${lab.toLowerCase()}`, c.health.state === "healthy" || c.health.state === "stale"]; }
      if (t.key in cov.trackers && cov.trackers[t.key].enabled && cov.trackers[t.key].connected) return ["connected with a token", true];
      if (t.key === "slack" && cov.slack.enabled && cov.slack.connected) return ["webhook only", true];
      return p.configured ? ["not connected", false] : ["needs app setup", false];
    }
    if (t.key === "webhooks") return cov.webhooks ? [`${cov.webhooks} endpoint${cov.webhooks > 1 ? "s" : ""}`, true] : ["none", false];
    if (t.key === "sso") return cov.sso.enabled ? [cov.sso.required ? "required" : "on", true] : ["off", false];
    if (t.key === "mcp") return cov.personal_tokens ? [`${cov.personal_tokens} token${cov.personal_tokens > 1 ? "s" : ""}`, true] : ["no tokens yet", false];
    if (t.key === "engines") return cov.custom_engines ? [`${cov.custom_engines} registered`, true] : ["none yet", false];
    if (t.key === "time_csv") return cov.time_entries_30d ? [`${cov.time_entries_30d} entries · 30 d`, true] : ["no hours yet", false];
    if (t.key === "pipeline_csv") return cov.opportunities ? [`${cov.opportunities} deals`, true] : ["no deals yet", false];
    if (t.key === "billing_csv") return can("billing.view") ? ["ready", true] : ["", false];
    return ["", false];
  };
  const live = k => { const p = provs[k]; return !!p && (p.personal ? p.people_connected > 0 : p.connections.some(c => c.status === "active")); };
  const anyLive = (...ks) => ks.some(live);
  const trackerOn = anyLive("github", "linear", "jira") || Object.values(cov.trackers).some(x => x.enabled && x.connected);
  const connected = all.filter(t => statusOf(t)[1]).length;
  if (S.flash && S.flash.connected && provs[S.flash.connected]) S.intSel = S.flash.connected;
  const sel = all.find(t => t.key === S.intSel) || all[0];
  const coverage = [
    ["Chains", [cov.deployments > 0, trackerOn], trackerOn ? `${cov.deployments} deployments · tasks in sync` : "connect a tracker"],
    ["Capacity", [cov.people_with_hours > 0, cov.time_entries_30d > 0, anyLive("google_calendar", "outlook_calendar")], !cov.time_entries_30d ? "needs time data" : !anyLive("google_calendar", "outlook_calendar") ? "calendars add time off" : "hours, time, time off"],
    ["Pipeline", [cov.opportunities > 0, anyLive("salesforce", "hubspot")], anyLive("salesforce", "hubspot") ? "live from the CRM" : cov.opportunities ? `${cov.opportunities} deals from import` : "connect the CRM"],
    ["Burn", [cov.time_entries_30d > 0, anyLive("harvest", "toggl")], anyLive("harvest", "toggl") ? "live from timesheets" : cov.time_entries_30d ? "from logged or imported time" : "needs time data"],
    ["Delay ledger", [cov.delays_confirmed > 0, trackerOn], trackerOn ? `${cov.delays_confirmed} confirmed` : "connect a tracker for more signals"],
    ["Alerts", [live("slack") || (cov.slack.enabled && cov.slack.connected), live("slack")], live("slack") ? "Slack app with buttons" : cov.slack.connected ? "webhook only: install the app for buttons" : "connect Slack"],
  ].map(([view, parts, missing]) => {
    const f = parts.filter(Boolean).length / parts.length; const ok = f === 1;
    return `<div class="panel ${ok ? "goodline" : ""}" style="padding:14px 16px;gap:8px"><div class="phead"><span style="font-size:13px;font-weight:600">${esc(view)}</span><span class="chip ${ok ? "good" : f ? "warn" : ""}" style="font-size:10px">${ok ? "LIVE" : f ? "PARTIAL" : "NO DATA"}</span></div>${bar(f, ok ? "var(--good)" : "var(--warn)", "thin")}<div class="xs muted">${esc(missing)}</div></div>`;
  }).join("");
  const tiles = TOOLS.map(g => `<div class="stack" style="gap:8px"><div class="row" style="align-items:baseline;gap:10px"><span class="label">${esc(g.group)}</span><span class="small muted">${esc(g.why)}</span></div>
    <div class="grid g3" style="gap:8px">${g.items.map(t => { const [st, ok] = statusOf(t); return `<button class="tile ${t.key === sel.key ? "on" : ""}" data-on="${on(() => { S.intSel = t.key; route(); })}"><span class="mark ${ok ? "" : "off"}" style="background:${t.color}">${esc(t.ini)}</span><span class="l" style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:13.5px;font-weight:500">${esc(t.name)}</span><span class="mono xs ${ok ? "good" : "muted"}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(st)}</span></span></button>`; }).join("")}</div></div>`).join("");
  page(`<div class="headrow"><div><h1>Integrations</h1><p class="lede">Connect the tools your team already uses and the screens run on live data: installs are one click, changes arrive as they happen, and everything is reconciled nightly so a missed webhook costs minutes, not data.</p></div><span class="mono small muted">${connected} of ${all.length} connected</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">${coverage}</div>
    <div class="grid int-split" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start">
      <div class="stack lg">${tiles}</div>
      <div class="panel" id="tooldetail" style="gap:16px;position:sticky;top:0">${toolDetail(sel, statusOf(sel), cfg, info, provs[sel.key], cat)}</div></div>`);
  const p = provs[sel.key];
  const c = p && p.connections.find(x => x.status !== "disconnected" && !x.personal);
  if (c) act(connectionDetail)(c.id, sel);
}

function setupHtml(p, cat) {
  const txt = (p.setup || "").split("{public}").join(cat.public_url);
  return `<div class="sub-card" style="gap:8px"><div class="row nowrap"><span class="chip warn">NEEDS APP SETUP</span><span class="small muted">once per install of ${esc(brand().product_name)}</span></div>
    <div class="small text2" style="line-height:1.5">${esc(txt)}</div>
    ${p.auth === "oauth" ? `<div class="stack" style="gap:4px"><div class="label" style="font-size:10px">Callback / redirect URL</div><code class="code" style="font-size:11.5px">${esc(cat.redirect_uri)}</code></div>` : ""}
    ${p.env_needed.length ? `<div class="stack" style="gap:4px"><div class="label" style="font-size:10px">Then set, where it runs</div>${p.env_needed.map(e => `<code class="code" style="font-size:11.5px">${esc(e)}</code>`).join("")}</div>` : ""}</div>`;
}

function connectBtn(p, label) {
  if (!p.configured) return "";
  const tf = p.token_fields || [];
  if (tf.length) {
    const go_ = on(async () => {
      const fields = Object.fromEntries(tf.map(f => [f.key, (val(`tf_${p.key}_${f.key}`) || "").trim()]));
      const gap = tf.find(f => f.required !== false && !fields[f.key]); if (gap) { toast(`Fill in ${gap.label}`, true); return; }
      if (p.tenant_app) { const r = await api(`/api/connections/${p.key}/start`, { method: "POST", body: { fields } }); location.href = r.url; return; }
      await api(`/api/connections/${p.key}/token`, { method: "POST", body: { fields } });
      toast(`${p.name} connected`); route();
    });
    return `<div class="stack" style="gap:8px">${tf.map(f => `<label class="field"><span>${esc(f.label)}${f.help ? ` <span class="muted">· ${esc(f.help)}</span>` : ""}</span><input id="tf_${p.key}_${f.key}" ${f.secret ? `type="password" autocomplete="off"` : `class="mono" autocomplete="off"`}></label>`).join("")}
      <div><button class="btn primary sm" data-on="${go_}">${esc(label || `Connect ${p.name}`)}</button></div></div>`;
  }
  if (p.auth === "token") {
    const go_ = on(async () => {
      const token = val("tk_" + p.key); if (!token) { toast("Paste the token first", true); return; }
      await api(`/api/connections/${p.key}/token`, { method: "POST", body: { token, account: val("tka_" + p.key) || "" } });
      toast(`${p.name} connected`); route();
    });
    return `<div class="stack" style="gap:8px"><label class="field"><span>API token</span><input id="tk_${p.key}" type="password" autocomplete="off"></label>
      <label class="field"><span>Workspace id <span class="muted">(optional; defaults to the token owner's)</span></span><input id="tka_${p.key}" class="mono"></label>
      <div><button class="btn primary sm" data-on="${go_}">${esc(label || "Connect")}</button></div></div>`;
  }
  return `<button class="btn primary sm" data-on="${on(() => startConnect(p.key))}">${esc(label || `Connect ${p.name}`)}</button>`;
}
